<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 現場チェックリスト</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-neon-dark-v1.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <link rel="stylesheet" href="/css/field-checklist-v1.css" />
  <style>
    .project-pick-card { cursor: pointer; margin-bottom: 0.5rem; }
    #checklist-mount.friendly-card { padding: 0.85rem; }
  </style>
</head>
<body class="tisly-friendly field-ops-touch tisly-neon-dark">
  <main class="app-main">
    <div id="view-projects">
      <p class="section-label">✅ 現場チェックリスト — 案件を選択</p>
      <div id="project-list" class="empty-state">読み込み中…</div>
    </div>
    <div id="view-checklist" class="hidden">
      <div id="project-header" class="friendly-card"></div>
      <div id="checklist-mount" class="friendly-card"></div>
      <div id="work-session-mount"></div>
      <button type="button" class="btn-sub" id="btn-back" style="min-height:48px;">案件一覧に戻る</button>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/field-checklist-v1.js"></script>
</body>
</html>
