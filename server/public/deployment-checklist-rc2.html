<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiSLY — 初回導入チェックリスト RC2</title>
  <style>
    :root { --green: #1a7f37; --border: #d0d7de; }
    body { max-width: 720px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, sans-serif; }
    h1 { color: var(--green); }
    .ok { color: #1a7f37; font-weight: 700; }
    .pending { background: #fff8c5; border: 2px solid #d4a72c; padding: 1rem; border-radius: 12px; margin: 1rem 0; }
    .ready { background: #dafbe1; border: 2px solid var(--green); padding: 1rem; border-radius: 12px; margin: 1rem 0; font-weight: 700; text-align: center; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    li.done { background: #f6ffed; border-color: var(--green); }
    li small { display: block; color: #57606a; margin-top: 0.25rem; }
    button { background: var(--green); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <nav><a href="/app">App Hub</a> · <a href="/field/new">案件ウィザード</a></nav>
  <h1>初回導入チェックリスト RC2</h1>
  <p id="project-meta">読込中…</p>
  <div id="banner" class="pending">—</div>
  <ul id="checklist-items"></ul>
  <script type="module" src="/js/deployment-checklist-rc2.js"></script>
</body>
</html>
