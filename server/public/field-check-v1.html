<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c5cbf" />
  <title>TiSLY — 持ち物チェック</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    .check-item { display:flex; align-items:center; gap:0.75rem; padding:0.65rem 0; border-bottom:1px solid #e8ecf0; }
    .check-item:last-child { border-bottom:none; }
    .check-item input[type=checkbox] { width:1.35rem; height:1.35rem; flex-shrink:0; }
    .check-item label { flex:1; cursor:pointer; }
    .check-qty { color:#64748b; font-size:0.85rem; }
    .session-row { font-size:0.85rem; color:#475569; padding:0.35rem 0; }
    .progress-bar { height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; margin:0.5rem 0; }
    .progress-fill { height:100%; background:#7c5cbf; transition:width 0.2s; }
    .shortage-banner { margin-bottom:0.75rem; padding:0.65rem 0.75rem; background:#fef2f2; border:1px solid #fca5a5; border-radius:8px; }
    .shortage-title { margin:0; font-weight:700; color:#b91c1c; }
    .shortage-list { margin:0.35rem 0 0; padding-left:1.1rem; color:#991b1b; font-size:0.9rem; }
  </style>
</head>
<body class="tisly-friendly field-ops-touch">
  <main class="app-main">
    <div id="view-projects">
      <p class="section-label">🧰 持ち物チェック — 案件を選択</p>
      <div id="project-list" class="empty-state">読み込み中…</div>
    </div>
    <div id="view-checklist" class="hidden">
      <div id="shortage-banner" class="shortage-banner hidden" role="alert"></div>
      <div id="project-header" class="friendly-card"></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      <p id="progress-text" class="section-hint"></p>
      <div id="checklist" class="friendly-card"></div>
      <button type="button" class="btn-primary" id="btn-complete">出発前チェック完了</button>
      <p class="section-label">チェック履歴</p>
      <div id="sessions" class="friendly-card"></div>
      <button type="button" class="btn-sub" id="btn-back">案件一覧に戻る</button>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/field-check-v1.js"></script>
</body>
</html>
