<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY 3Dプリンター" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2003" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>TiSLY — 3Dプリンター作成</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/features/print-generator/print-generator-v1.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="pg-body tisly-friendly">
  <!--
    現場パーツ・筐体のパラメトリック
    STL 即時生成コーナー
  -->
  <header class="pg-header">
    <a class="pg-back" href="/app">← App Hub</a>
    <div>
      <p class="pg-brand">TiSLY · AIものづくり</p>
      <h1 class="pg-title">3Dプリンター作成</h1>
      <p class="pg-sub">オンデマンド造形 / STL生成 · 現場特化パーツ</p>
    </div>
  </header>

  <main class="pg-main">
    <section class="pg-card" aria-label="パーツ選択">
      <p class="pg-card-label">現場特化テンプレート</p>
      <div class="pg-tpl-grid" id="pg-tpl-grid" role="listbox" aria-label="テンプレート一覧"></div>
    </section>

    <!--
      自然言語・音声で寸法指示
      （テンプレートとプレビューの間）
    -->
    <section class="pg-card pg-ai-prompt-card" aria-label="AIプロンプト">
      <p class="pg-card-label">💬 AIに言葉で指示して3D生成</p>
      <label class="pg-ai-prompt-label" for="pg-ai-prompt">
        寸法・形状を日本語で入力
      </label>
      <textarea
        id="pg-ai-prompt"
        class="pg-ai-prompt"
        rows="3"
        placeholder="例: 幅50mm、高さ30mm、M5のビス穴を2箇所あけたL字ステー"
      ></textarea>
      <div class="pg-ai-prompt-row">
        <button
          type="button"
          class="pg-btn pg-btn-secondary"
          id="pg-ai-voice-btn"
          aria-pressed="false"
        >
          🎙️ 音声入力
        </button>
        <button
          type="button"
          class="pg-btn pg-btn-primary pg-btn-lg pg-ai-generate-btn"
          id="pg-ai-generate-btn"
        >
          🚀 AIで3D生成・パラメータ更新
        </button>
      </div>
      <p id="pg-ai-prompt-status" class="pg-hint" role="status"></p>
      <div id="pg-ai-feature-flags" class="pg-ai-features" hidden></div>
    </section>

    <section class="pg-layout">
      <div class="pg-card pg-viewer-card" aria-label="3Dプレビュー">
        <p class="pg-card-label">3Dプレビュー</p>
        <div id="pg-canvas-wrap" class="pg-canvas-wrap">
          <div id="pg-viewer-hint" class="pg-viewer-hint">①〜④を動かすと3D番号も連動</div>
        </div>
        <p class="pg-hint">ドラッグで回転 · ピンチ/ホイールでズーム</p>
      </div>

      <div class="pg-side">
        <section class="pg-card" aria-label="寸法スライダー">
          <p class="pg-card-label">パラメトリック寸法（mm）</p>
          <div id="pg-sliders" class="pg-sliders"></div>
        </section>

        <section class="pg-card" aria-label="方眼紙スケッチ">
          <p class="pg-card-label">方眼紙スケッチ・AI寸法抽出</p>
          <!--
            ライブラリ選択とカメラ撮影を分離。
            capture はカメラ入力のみに付与する。
          -->
          <div class="pg-sketch-row">
            <label class="pg-btn pg-btn-secondary pg-file-label" for="pg-sketch-library">
              写真から選ぶ
              <input
                type="file"
                id="pg-sketch-library"
                accept="image/*"
                hidden
              />
            </label>
            <label class="pg-btn pg-btn-secondary pg-file-label" for="pg-sketch-camera">
              カメラで撮影
              <input
                type="file"
                id="pg-sketch-camera"
                accept="image/*"
                capture="environment"
                hidden
              />
            </label>
            <button type="button" class="pg-btn pg-btn-primary" id="pg-ai-extract-btn">
              AI寸法抽出
            </button>
          </div>
          <div id="pg-sketch-preview" class="pg-sketch-preview" hidden>
            <div class="pg-sketch-preview-head">
              <span class="pg-sketch-preview-label">選択中のスケッチ</span>
              <button
                type="button"
                class="pg-btn pg-btn-ghost pg-sketch-clear"
                id="pg-sketch-clear"
                aria-label="スケッチを削除"
              >
                削除
              </button>
            </div>
            <img id="pg-sketch-img" alt="方眼紙スケッチ" />
          </div>
          <p id="pg-ai-status" class="pg-hint" role="status"></p>
        </section>

        <section class="pg-card pg-actions" aria-label="出力">
          <button type="button" class="pg-btn pg-btn-primary pg-btn-lg" id="pg-stl-btn">
            ワンタップ STL ダウンロード
          </button>
          <a
            class="pg-btn pg-btn-secondary"
            href="/print-model-viewer?from=/3d-generator"
            id="pg-viewer-link"
          >
            印刷ビューワーで確認
          </a>
          <p id="pg-export-status" class="pg-hint" role="status"></p>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="/js/features/print-generator/print-generator-v1.js"></script>
</body>
</html>
