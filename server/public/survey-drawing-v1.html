<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1565c0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY現調図面" />
  <link rel="manifest" href="/manifest-survey-v1.webmanifest" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2003" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>TiSLY — 現調図面</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <link rel="stylesheet" href="/css/survey-drawing-v1.css?v=survey-drawing-ui-v26" />
  <link rel="stylesheet" href="/css/features/drawing/drawing-editor-v1.css" />
</head>
<body class="tisly-friendly field-ops-touch survey-drawing-body">
  <header class="drawing-toolbar" id="drawing-toolbar">
    <button type="button" class="drawing-tool-btn" id="btn-back" title="戻る">←</button>
    <button type="button" class="drawing-tool-btn" id="btn-toggle-tools" title="描画ツール" aria-expanded="true" aria-controls="drawing-tool-strip">🛠</button>
    <span id="drawing-title" class="drawing-title">現調図面</span>
    <button type="button" class="drawing-tool-btn" id="btn-ai-export" title="AI清書用出力">🤖</button>
    <button type="button" class="drawing-tool-btn" id="btn-grid-ocr" title="方眼紙AI解析">🔍</button>
    <button type="button" class="drawing-tool-btn primary" id="btn-save" title="保存">💾</button>
  </header>

  <div class="drawing-tool-strip" id="drawing-tool-strip" role="toolbar" aria-label="描画ツール">
    <button type="button" class="drawing-tool-btn drawing-tool-undo" id="btn-undo" title="元に戻す（Undo）" disabled aria-label="元に戻す">↩</button>
    <button type="button" class="drawing-tool-btn active" data-tool="pen" title="ペン">✏️</button>
    <button type="button" class="drawing-tool-btn" data-tool="eraser" title="消しゴム">🧽</button>
    <button type="button" class="drawing-tool-btn" data-tool="line" title="直線">／</button>
    <button type="button" class="drawing-tool-btn" data-tool="route" title="配線">🔌</button>
    <button type="button" class="drawing-tool-btn" data-tool="symbol" title="記号">📍</button>
    <button type="button" class="drawing-tool-btn" data-tool="text" title="テキスト">T</button>
    <button type="button" class="drawing-tool-btn" data-tool="voice-pin" title="音声ピン（マイク）">🎤</button>
    <button type="button" class="drawing-tool-btn" data-tool="select" title="選択">👆</button>
    <button type="button" class="drawing-tool-btn" data-tool="pan" title="移動">✋</button>
    <button type="button" class="drawing-tool-btn" id="btn-zoom-in" title="拡大">＋</button>
    <button type="button" class="drawing-tool-btn" id="btn-zoom-out" title="縮小">−</button>
    <button type="button" class="drawing-tool-btn" id="btn-zoom-reset" title="リセット">◎</button>
    <label class="drawing-color-wrap" title="線の色">
      <input type="color" id="stroke-color" value="#dc2626" />
    </label>
    <button type="button" class="drawing-tool-btn drawing-tool-photo" id="btn-import-photo" title="写真を背景に敷く">📷</button>
  </div>
  <!-- iOS: JSの.click()は使わず
       labelのforでOS直起動 -->
  <!-- 閉じ時はJSがdisplay:noneで撤去 -->
  <div
    id="drawing-photo-picker-backdrop"
    class="drawing-photo-picker-backdrop hidden"
    aria-hidden="true"
  ></div>
  <div id="drawing-photo-picker" class="drawing-photo-picker hidden" role="menu" aria-label="背景写真の取り込み" aria-hidden="true">
    <label for="survey-camera-input" class="drawing-photo-picker-btn" id="btn-photo-camera">📷 その場で撮影</label>
    <label for="survey-album-input" class="drawing-photo-picker-btn" id="btn-photo-album">🖼 アルバムから選択</label>
  </div>

  <div id="line-type-palette" class="line-type-palette hidden" role="listbox" aria-label="線種"></div>
  <div id="symbol-palette" class="symbol-palette hidden" role="listbox" aria-label="記号"></div>
  <div id="symbol-inspector" class="symbol-inspector hidden" aria-label="記号操作">
    <span id="symbol-inspector-label" class="symbol-inspector-label"></span>
    <button type="button" id="btn-symbol-rotate-left" title="左回転">↺</button>
    <button type="button" id="btn-symbol-rotate-right" title="右回転">↻</button>
    <button type="button" id="btn-symbol-delete" title="削除" class="danger">🗑</button>
  </div>

  <div id="drawing-knowledge-alert" class="drawing-knowledge-alert hidden" role="status" aria-live="polite"></div>
  <div id="drawing-voice-listening" class="drawing-voice-listening hidden" aria-live="polite">🎤 音声認識中…</div>

  <main class="drawing-stage-wrap" id="drawing-stage-wrap">
    <div id="drawing-stage" class="drawing-stage">
      <div id="drawing-bg-placeholder" class="drawing-bg-placeholder">📷 写真を取り込むか、下のボタンで方眼紙を撮影してください</div>
      <!-- JSが探すIDと完全一致（SVG直前） -->
      <div id="survey-bg-photo-layer" class="survey-bg-photo-layer hidden" aria-hidden="true"></div>
      <!-- 手書きは透明SVGレイヤーとして前面に重ねる -->
      <svg id="drawing-svg" class="drawing-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="drawing-overlay" class="drawing-overlay"></div>
    </div>
  </main>

  <div id="drawing-symbol-dock-v1" class="hidden" aria-hidden="true"></div>

  <p id="drawing-status" class="drawing-status" aria-live="polite">読み込み中…</p>
  <p id="drawing-offline-badge" class="drawing-offline-badge hidden" aria-live="polite"></p>
  <div id="spec-photo-link-bar" class="drawing-spec-link hidden" aria-label="仕様書写真スロット">
    <label for="spec-photo-slot-select">仕様書スロットへ紐付け</label>
    <select id="spec-photo-slot-select"><option value="">— 選択 —</option></select>
    <button type="button" class="drawing-est-btn primary" id="btn-spec-photo-link" disabled>紐付け</button>
  </div>

  <div id="drawing-ai-material-bar" class="drawing-ai-material-bar hidden" aria-label="AI材料解析">
    <button type="button" class="drawing-est-btn drawing-ai-material-btn" id="btn-ai-material">🤖 AI材料解析</button>
    <div id="drawing-ai-material-list" class="drawing-ai-material-list hidden"></div>
  </div>

  <div id="drawing-estimate-bar" class="drawing-estimate-bar hidden">
    <div class="drawing-estimate-summary" id="drawing-estimate-summary">見積候補未作成</div>
    <div class="drawing-estimate-actions">
      <button type="button" class="drawing-est-btn" id="btn-est-create">見積候補を作成</button>
      <button type="button" class="drawing-est-btn primary" id="btn-est-apply" disabled>見積に反映</button>
      <button type="button" class="drawing-est-btn" id="btn-est-open" disabled>見積PWAで開く</button>
    </div>
  </div>

  <div id="drawing-pdf-bar" class="drawing-estimate-bar hidden" aria-label="仕様書PDF操作">
    <div class="drawing-estimate-summary">仕様書PDF（図面付き）</div>
    <div class="drawing-estimate-actions">
      <button type="button" class="drawing-est-btn primary" id="btn-drawing-pdf-create">PDF作成</button>
      <button type="button" class="drawing-est-btn" id="btn-drawing-pdf-save">保存</button>
      <button type="button" class="drawing-est-btn" id="btn-drawing-pdf-share">共有</button>
      <button type="button" class="drawing-est-btn" id="btn-drawing-pdf-preview">プレビュー</button>
      <button type="button" class="drawing-est-btn" id="btn-drawing-pdf-redo">やり直し</button>
    </div>
  </div>

  <!-- labelのfor先。JS仲介なしで
       カメラ／アルバムをOS起動。
       formで囲み誤submitを物理遮断 -->
  <form id="survey-photo-pick-form" action="#" method="post" onsubmit="return false;">
    <input
      type="file"
      id="survey-camera-input"
      accept="image/jpeg,image/png,image/heic,image/heif,image/*"
      capture="environment"
      class="survey-file-input-hidden"
      tabindex="-1"
      aria-hidden="true"
    />
    <input
      type="file"
      id="survey-album-input"
      accept="image/jpeg,image/png,image/heic,image/heif,image/*"
      class="survey-file-input-hidden"
      tabindex="-1"
      aria-hidden="true"
    />
    <button type="button" hidden aria-hidden="true" tabindex="-1" id="survey-photo-form-dummy-btn"></button>
  </form>

  <script type="module" src="/js/survey-drawing-v1.js?v=survey-drawing-ui-v26"></script>
</body>
</html>
