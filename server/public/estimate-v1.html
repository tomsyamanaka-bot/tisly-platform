<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a90d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY見積" />
  <link rel="manifest" href="/manifest-estimate-v1.webmanifest" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2001" />
  <title>TiSLY — 見積</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    .pdf-btn-grid { display: grid; gap: 0.5rem; margin: 0.75rem 0; }
    .pdf-btn-grid .btn-sub { width: 100%; text-align: center; }
    .pdf-preview-frame { width: 100%; min-height: 420px; border: 1px solid var(--tisly-border, #e2e8f0); border-radius: 8px; background: #fff; }
    #pdf-error { display: none; margin-top: 0.5rem; }
    #pdf-error.visible { display: block; }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <p class="section-hint" id="page-hint">お仕事の料金をまとめます</p>

    <div id="view-list">
      <div class="tab-row">
        <button type="button" class="tab-btn active" id="tab-pending">見積待ち一覧</button>
        <button type="button" class="tab-btn" id="tab-projects">確定した見積</button>
      </div>
      <div id="pending-list" class="empty-state">読み込み中…</div>
      <div id="project-list" class="empty-state hidden">読み込み中…</div>
    </div>

    <div id="view-detail" class="hidden">
      <div class="friendly-card">
        <span id="detail-status" class="status-badge orange">—</span>
        <h2 id="detail-name">—</h2>
        <p id="detail-meta"></p>
        <p id="detail-customer-info" class="section-hint"></p>
      </div>

      <p class="section-label">📋 見積ヘッダー（TOMS標準）</p>
      <p class="section-hint">お客様へ提出する見積書の表紙情報です</p>
      <div class="friendly-card" id="header-card">
        <label class="friendly-label">宛名 <input type="text" id="hdr-addressee" placeholder="株式会社〇〇 御中" /></label>
        <label class="friendly-label">件名 <input type="text" id="hdr-subject" placeholder="工事件名" /></label>
        <div class="line-qty-price">
          <label class="friendly-label">発行日 <input type="text" id="hdr-issue-date" readonly /></label>
          <label class="friendly-label">見積番号 <input type="text" id="hdr-estimate-no" readonly /></label>
        </div>
        <label class="friendly-label">担当者 <input type="text" id="hdr-staff" /></label>
        <label class="friendly-label">現場名 <input type="text" id="hdr-site-name" /></label>
        <label class="friendly-label">工事場所 <input type="text" id="hdr-work-location" /></label>
        <button type="button" class="btn-sub blue" id="btn-save-header">ヘッダーを保存</button>
      </div>

      <p class="section-label">🧾 お見積りの内訳</p>
      <p class="section-hint">項目を追加・並べ替え・削除できます</p>
      <div class="friendly-card" id="lines-card">
        <div id="line-list"></div>
        <button type="button" class="btn-sub blue" id="btn-add-line" style="margin-top:0.5rem;">＋ 項目を追加</button>
        <div class="totals-box" id="totals-box">
          <div>小計 <span id="total-sub">¥0</span></div>
          <div>消費税（10%） <span id="total-tax">¥0</span></div>
          <div class="grand-total">税込合計 <span id="total-grand">¥0</span></div>
        </div>
      </div>

      <label class="friendly-label">備考 <textarea id="estimate-notes" rows="3" placeholder="見積書に記載する備考"></textarea></label>

      <button type="button" class="btn-sub blue" id="btn-save-items">内訳を保存</button>
      <button type="button" class="btn-main blue" id="btn-finalize">見積を確定（印刷用・写真なし）</button>
      <button type="button" class="btn-sub blue" id="btn-invoice">請求書を作成</button>

      <p class="section-label">📄 書類の確認・印刷</p>
      <p class="section-hint">通常の提出・印刷は「写真なし」です。現場写真を添える場合は「写真付き」を選んでください。</p>
      <div class="pdf-btn-grid friendly-card">
        <button type="button" class="btn-sub blue" id="btn-pdf-estimate-no-photo">見積書を開く（写真なし）</button>
        <button type="button" class="btn-sub blue" id="btn-pdf-estimate-with-photo">見積書を開く（写真付き）</button>
        <button type="button" class="btn-sub blue" id="btn-pdf-invoice-no-photo">請求書を開く（写真なし）</button>
        <button type="button" class="btn-sub blue" id="btn-pdf-invoice-with-photo">請求書を開く（写真付き）</button>
        <button type="button" class="btn-sub blue" id="btn-toms">TOMS形式で確認</button>
      </div>

      <div id="pdf-section" class="friendly-card hidden">
        <iframe id="pdf-preview" class="pdf-preview-frame" title="書類プレビュー"></iframe>
        <a id="link-pdf" class="btn-sub blue" href="#" target="_blank" rel="noopener" style="margin-top:0.5rem;display:block;text-align:center;text-decoration:none;">別のタブで開く</a>
        <div id="pdf-error" class="error-friendly"></div>
      </div>

      <div id="toms-section" class="friendly-card hidden">
        <p style="font-size:0.85rem;color:var(--tisly-muted);margin:0 0 0.5rem;">Excel出力用データ構造（TOMS_見積もり書_フォーマット.xlsx 連携準備）</p>
        <pre id="toms-preview" style="font-size:0.75rem;overflow:auto;max-height:200px;margin:0;background:#f6f8fa;padding:0.75rem;border-radius:8px;"></pre>
        <button type="button" class="btn-sub blue" id="btn-toms-download" style="margin-top:0.5rem;">内容をコピー</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/estimate-v1.js"></script>
</body>
</html>
