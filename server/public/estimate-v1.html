<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0969da" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY見積" />
  <link rel="manifest" href="/manifest-estimate-v1.webmanifest" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2001" />
  <title>TiSLY — 見積PWA v1</title>
  <style>
    :root {
      --blue: #0969da;
      --blue-light: #ddf4ff;
      --border: #d0d7de;
      --muted: #656d76;
      --bg: #f6f8fa;
      --danger: #cf222e;
      --green: #1a7f37;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #1f2328;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--blue);
      color: #fff;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    header h1 { margin: 0; font-size: 1.1rem; flex: 1; }
    header button, header a.btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
    }
    main { padding: 1rem; max-width: 640px; margin: 0 auto; }
    .hidden { display: none !important; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--blue-light);
      color: var(--blue);
      font-weight: 600;
    }
    .badge.pending { background: #fff8c5; color: #9a6700; }
    .badge.done { background: #dafbe1; color: var(--green); }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 1rem 0 0.5rem;
    }
    .list-item { cursor: pointer; }
    .list-item:active { box-shadow: 0 0 0 2px var(--blue); }
    .btn-primary {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0.75rem;
      cursor: pointer;
    }
    .btn-secondary {
      width: 100%;
      background: #fff;
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    label { display: block; margin: 0.4rem 0 0.2rem; font-size: 0.8rem; color: var(--muted); }
    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }
    .line-row {
      display: grid;
      grid-template-columns: 1fr 60px 80px;
      gap: 0.35rem;
      align-items: end;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .line-row .name { grid-column: 1 / -1; font-weight: 600; }
    .totals {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 2px solid var(--border);
      font-size: 0.95rem;
    }
    .totals .grand { font-size: 1.2rem; font-weight: 700; color: var(--blue); }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .tab {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .toast {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #24292f;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
    .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
    .error { color: var(--danger); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <button type="button" id="btn-back" class="hidden" aria-label="戻る">←</button>
    <h1 id="page-title">見積案件</h1>
    <a href="/app" class="btn">Hub</a>
  </header>

  <main>
    <div id="view-list">
      <div class="tabs">
        <button type="button" class="tab active" id="tab-pending">見積待ち</button>
        <button type="button" class="tab" id="tab-projects">見積一覧</button>
      </div>
      <div id="pending-list" class="empty">読み込み中…</div>
      <div id="project-list" class="empty hidden">読み込み中…</div>
    </div>

    <div id="view-detail" class="hidden">
      <div class="card">
        <div id="detail-status" class="badge">—</div>
        <h2 id="detail-name">—</h2>
        <p id="detail-meta" style="color:var(--muted);font-size:0.9rem;"></p>
      </div>

      <p class="section-title">見積明細</p>
      <div class="card" id="lines-card">
        <div id="line-list"></div>
        <div class="totals" id="totals-box">
          <div>小計: <span id="total-sub">¥0</span></div>
          <div>消費税(10%): <span id="total-tax">¥0</span></div>
          <div class="grand">税込合計: <span id="total-grand">¥0</span></div>
        </div>
      </div>

      <button type="button" class="btn-secondary" id="btn-save-items">明細を保存</button>
      <button type="button" class="btn-primary btn-green" id="btn-finalize">確定してPDF生成</button>
      <a id="link-pdf" class="btn-secondary hidden" href="#" target="_blank" rel="noopener">PDFを開く</a>
      <button type="button" class="btn-secondary" id="btn-toms">TOMSフォーマット確認</button>
      <pre id="toms-preview" class="card hidden" style="font-size:0.75rem;overflow:auto;max-height:200px;"></pre>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/estimate-v1.js"></script>
</body>
</html>
