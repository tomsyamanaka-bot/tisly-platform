<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <title>案件司令塔 — TiSLY TOMS</title>
  <link rel="stylesheet" href="/css/tisly-pwa-shell.css" />
  <style>
    .dash-grid { display: grid; gap: 1rem; max-width: 1100px; margin: 0 auto; padding: 1rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: #8b949e; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; background: #1a7f37; border-radius: 4px; font-size: 0.85rem; }
    .badge.warn { background: #9e6a03; }
    .badge.err { background: #da3633; }
    .grid-2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .timeline li { border-left: 3px solid #1a7f37; padding-left: 0.75rem; margin: 0.5rem 0; list-style: none; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .photo-grid img { max-width: 120px; max-height: 90px; object-fit: cover; border-radius: 4px; }
    .floor-stack { display: flex; flex-direction: column; gap: 1.5rem; max-height: 70vh; overflow-y: auto; }
    .floor-layer { position: relative; min-height: 180px; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; }
    .floor-layer h3 { margin: 0; padding: 0.5rem; font-size: 0.9rem; background: #21262d; }
    .floor-layer.anomaly { outline: 2px solid #da3633; }
    .floor-canvas { position: relative; height: 200px; }
    .floor-pin { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; font-size: 0.55rem; color: #fff; transform: translate(-50%, -50%); }
    .device-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; }
    .device-table td, .device-table th { padding: 0.35rem; border-bottom: 1px solid #30363d; text-align: left; }
    .status-online { color: #3fb950; }
    .status-warning { color: #d29922; }
    .status-offline { color: #f85149; }
    .notif-item { padding: 0.5rem; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; gap: 0.5rem; }
    .diff-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .diff-tabs button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; }
    .diff-tabs button.active { background: #1f6feb; border-color: #1f6feb; }
    .diff-item-btn { background: transparent; border: none; color: #c9d1d9; cursor: pointer; text-align: left; padding: 0.25rem 0; }
    .diff-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.35rem; }
    .diff-items-list { list-style: none; padding: 0; }
    .floor-pin.pin-blink { animation: pin-blink 0.8s ease-in-out infinite; }
    @keyframes pin-blink { 50% { box-shadow: 0 0 12px 4px #f85149; transform: translate(-50%,-50%) scale(1.15); } }
    .ws-badge { font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; margin-left: 0.5rem; }
    .ws-online { background: #1a7f37; }
    .ws-offline, .ws-reconnecting { background: #9e6a03; }
    .ws-connecting { background: #30363d; }
    .retry-item { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #30363d; }
    .send-mode { color: #8b949e; font-size: 0.8rem; }
    .notif-item.critical { border-left: 3px solid #da3633; padding-left: 0.5rem; }
    .ai-feedback-btns { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .ai-feedback-btns button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; }
    .field-action-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .field-action-btn { background: #1f6feb; border: none; color: #fff; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; min-height: 44px; flex: 1 1 calc(50% - 0.5rem); }
    .field-action-btn:hover { background: #388bfd; }
    .rc-card h3 { font-size: 0.95rem; margin: 0 0 0.5rem; color: #c9d1d9; }
    .rc-card a { color: #58a6ff; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="tisly-pwa-topbar-root"></div>
  <div class="dash-grid">
    <header>
      <h1 id="dash-title">案件司令塔 RC</h1>
      <p><span id="dash-state" class="badge"></span><span id="dash-ws-status" class="ws-badge ws-connecting">接続中…</span></p>
    </header>
    <section class="card" id="dash-rc-cards">
      <h2>現場フロー（現調→見積→施工→保守→引渡し）</h2>
      <div class="field-action-bar" id="dash-field-actions">
        <button type="button" class="field-action-btn" id="btn-field-estimate">見積作成</button>
        <button type="button" class="field-action-btn" id="btn-field-install">施工へ進む</button>
        <button type="button" class="field-action-btn" id="btn-field-share">顧客に共有</button>
        <button type="button" class="field-action-btn" id="btn-field-pro-remote">PRO Remoteへ反映</button>
      </div>
      <div id="dash-rc-grid" class="grid-2"></div>
    </section>
    <div class="grid-2">
      <section class="card" id="dash-customer"></section>
      <section class="card" id="dash-finance"></section>
      <section class="card" id="dash-pro-remote"></section>
      <section class="card" id="dash-notifications"></section>
    </div>
    <section class="card">
      <h2>Floor Stack（外周 / 1F / 2F）</h2>
      <div id="dash-floor-stack" class="floor-stack"></div>
    </section>
    <section class="card">
      <h2>リアルタイム設備</h2>
      <div id="dash-devices"></div>
    </section>
    <section class="card">
      <h2>図面差分（現調 → 施工 → 完成）</h2>
      <div id="dash-drawing-diff"></div>
    </section>
    <section class="card" id="dash-retry-queue"></section>
    <section class="card" id="dash-ai-estimate"></section>
    <section class="card">
      <h2>保守</h2>
      <div id="dash-maintenance"></div>
    </section>
    <div class="grid-2">
      <section class="card">
        <h2>タイムライン / 連携ログ</h2>
        <ul id="dash-timeline" class="timeline"></ul>
      </section>
      <section class="card">
        <h2>写真</h2>
        <div id="dash-photos" class="photo-grid"></div>
      </section>
    </div>
    <section class="card" id="dash-links"></section>
  </div>
  <script type="module" src="/js/tisly-pwa-shell.js"></script>
  <script type="module" src="/js/project-dashboard.js"></script>
</body>
</html>
