<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#64748b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 設定</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    .settings-menu { display:flex; flex-direction:column; gap:0.5rem; margin-top:0.5rem; }
    .settings-menu a {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.75rem 0.85rem; border-radius:10px; border:1px solid #e2e8f0;
      background:#fff; text-decoration:none; color:#1e293b; font-weight:600;
    }
    .settings-menu a:hover { background:#f8fafc; }
    .settings-menu .menu-desc { font-size:0.78rem; color:#64748b; font-weight:400; margin-top:0.15rem; }
    .status-grid { display:grid; grid-template-columns:minmax(7rem,auto) 1fr; gap:0.35rem 0.75rem; font-size:0.88rem; margin:0.5rem 0 0; }
    .status-grid dt { color:#64748b; margin:0; }
    .status-grid dd { margin:0; color:#1e293b; }
    .status-ok { color:#166534; font-weight:600; }
    .status-warn { color:#92400e; font-weight:600; }
    .status-muted { color:#64748b; }
    .admin-only-hint { font-size:0.82rem; color:#64748b; margin:0 0 0.5rem; }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <p class="section-hint">管理者専用 — 連携・ストレージの設定</p>

    <div class="friendly-card">
      <h2>現在の状態</h2>
      <dl class="status-grid" id="status-grid">
        <dt>ローカル保存</dt><dd id="status-local" class="status-ok">読み込み中…</dd>
        <dt>QNAP</dt><dd id="status-qnap" class="status-muted">読み込み中…</dd>
        <dt>最終確認</dt><dd id="status-last-check">—</dd>
      </dl>
    </div>

    <div class="friendly-card">
      <h2>設定メニュー</h2>
      <p class="admin-only-hint">owner / admin 権限が必要です</p>
      <nav class="settings-menu" aria-label="設定メニュー">
        <a href="/checklist-templates-v1">
          <span>
            ✅ チェックリスト
            <div class="menu-desc">現場チェックテンプレート・月間集計</div>
          </span>
          <span>→</span>
        </a>
        <a href="/storage-settings-v1">
          <span>
            💾 ストレージ
            <div class="menu-desc">ローカル PDF 保存・QNAP バックアップ</div>
          </span>
          <span>→</span>
        </a>
        <a href="/google-calendar-settings-v1">
          <span>
            📅 Googleカレンダー
            <div class="menu-desc">日程同期・OAuth 連携</div>
          </span>
          <span>→</span>
        </a>
      </nav>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/settings-v1.js"></script>
</body>
</html>
