<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiSLY — Recovery Console</title>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header>
    <h1>Recovery Console</h1>
    <nav>
      <a href="/operations">運用</a>
      <a href="/recovery" class="active">Recovery</a>
      <a href="/">ダッシュボード</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h2>概要</h2>
      <div id="recovery-overview"></div>
    </div>
    <div class="card">
      <h2>異常・インシデント</h2>
      <table>
        <thead><tr><th>デバイス</th><th>現場</th><th>状態</th><th>開始</th></tr></thead>
        <tbody id="anomalies-body"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>復旧履歴</h2>
      <table>
        <thead><tr><th>Run ID</th><th>デバイス</th><th>状態</th><th>開始</th></tr></thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>手動実行</h2>
      <input id="action-device" placeholder="device_id" style="width:100%;padding:0.5rem;margin:0.25rem 0" />
      <div style="display:flex;flex-wrap:gap:0.5rem">
        <button class="btn" data-action="restart_device">Restart Device</button>
        <button class="btn secondary" data-action="restart_mqtt">Restart MQTT</button>
        <button class="btn secondary" data-action="restart_node_red">Restart Node-RED</button>
        <button class="btn" data-action="escalate">Escalate</button>
      </div>
      <pre id="action-result" style="margin-top:1rem;font-size:0.8rem"></pre>
    </div>
    <div class="card">
      <h2>タイムライン</h2>
      <ul id="timeline-list"></ul>
    </div>
  </main>
  <script type="module" src="/js/recovery-console.js"></script>
</body>
</html>
