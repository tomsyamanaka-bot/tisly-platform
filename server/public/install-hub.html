<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a7f37" />
  <title>TiSLY — 施工 PWA</title>
  <link rel="stylesheet" href="/css/tisly-pwa-shell.css" />
  <style>
    .install-grid { max-width: 640px; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; }
    .install-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .install-card h2 { margin: 0 0 0.75rem; font-size: 1rem; color: #8b949e; }
    .install-btn { display: block; width: 100%; padding: 0.75rem; margin: 0.35rem 0; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; text-align: center; text-decoration: none; }
    .install-btn.primary { background: #1a7f37; border-color: #1a7f37; color: #fff; }
    .install-status { font-size: 0.9rem; color: #8b949e; }
    #install-qr-result { word-break: break-all; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="tisly-pwa-topbar-root"></div>
  <div class="install-grid">
    <header>
      <h1>施工 PWA</h1>
      <p class="hint">Phase 1621–1680 — 作業開始・完了・写真・QR・機器登録</p>
    </header>
    <section class="install-card">
      <h2>顧客選択</h2>
      <select id="install-customer" class="install-btn" style="text-align:left">
        <option value="TOMS001">TOMS001 — 板橋自宅</option>
        <option value="TOYOSHIMA001">TOYOSHIMA001 — 豊島邸</option>
      </select>
    </section>
    <section class="install-card">
      <h2>作業セッション</h2>
      <p class="install-status" id="install-session-status">未開始</p>
      <button type="button" class="install-btn primary" id="btn-install-start">作業開始</button>
      <button type="button" class="install-btn" id="btn-install-complete" disabled>作業完了</button>
    </section>
    <section class="install-card">
      <h2>写真登録</h2>
      <input type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" capture="environment" multiple id="install-photos" />
      <button type="button" class="install-btn" id="btn-install-photo">写真をアップロード</button>
    </section>
    <section class="install-card">
      <h2>QR 読取 / 機器登録</h2>
      <input type="text" id="install-qr-input" placeholder="QR トークンまたは asset ID" class="install-btn" style="text-align:left" />
      <button type="button" class="install-btn" id="btn-install-qr">QR 照会</button>
      <div id="install-qr-result"></div>
      <a class="install-btn" id="link-device-onboard" href="#">機器オンボードを開く</a>
    </section>
    <a class="install-btn primary" id="link-install-home" href="#">顧客別施工ホーム</a>
    <a class="install-btn" href="/assets">資産一覧</a>
  </div>
  <script type="module" src="/js/tisly-pwa-shell.js"></script>
  <script type="module" src="/js/install-hub.js"></script>
</body>
</html>
