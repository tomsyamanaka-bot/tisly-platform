<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6fa8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — Document Center</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    body.tisly-friendly.has-practical-nav .app-main { max-width: 480px; margin: 0 auto; padding: 0.85rem 1rem 1.25rem; }
    .dc-search input {
      width: 100%; min-height: 48px; padding: 0.65rem 0.9rem; box-sizing: border-box;
      border: 1px solid #cbd5e1; border-radius: 12px; font-size: 1rem; background: #fff;
    }
    .dc-tabs { display: flex; gap: 0.35rem; margin: 0.65rem 0; }
    .dc-tabs button {
      flex: 1; min-height: 42px; border-radius: 10px; border: 1px solid #cbd5e1;
      background: #fff; font-weight: 700; font-size: 0.82rem;
    }
    .dc-tabs button.active { background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8); }
    .dc-card {
      border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
      padding: 0.75rem 0.85rem; margin-bottom: 0.55rem; cursor: pointer;
    }
    .dc-card:active { background: #f8fafc; }
    .dc-card-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: flex-start; }
    .dc-card-title { font-weight: 700; font-size: 0.95rem; line-height: 1.35; margin: 0; }
    .dc-card-meta { font-size: 0.78rem; color: #64748b; margin-top: 0.25rem; line-height: 1.45; }
    .dc-badge {
      font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 999px; white-space: nowrap;
    }
    .dc-star { border: none; background: transparent; font-size: 1.2rem; cursor: pointer; padding: 0; line-height: 1; }
    .dc-folder {
      border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 0.55rem; overflow: hidden; background: #fff;
    }
    .dc-folder-head {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 0.85rem; cursor: pointer;
      font-weight: 700; font-size: 0.92rem;
    }
    .dc-folder-head .count { margin-left: auto; font-size: 0.78rem; color: #64748b; font-weight: 600; }
    .dc-folder-body { border-top: 1px solid #f1f5f9; }
    .dc-folder-body.hidden { display: none; }
    .dc-doc-row {
      padding: 0.65rem 0.85rem; border-bottom: 1px solid #f1f5f9; cursor: pointer;
    }
    .dc-doc-row:last-child { border-bottom: none; }
    .dc-doc-row:active { background: #f8fafc; }
    .dc-doc-title { font-weight: 600; font-size: 0.88rem; }
    .dc-doc-meta { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
    .dc-doc-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .dc-doc-actions button, .dc-doc-actions a {
      min-height: 36px; padding: 0.25rem 0.55rem; font-size: 0.75rem; font-weight: 700;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; text-decoration: none; cursor: pointer;
    }
    .dc-timeline { margin-top: 0.75rem; }
    .dc-tl-row { display: flex; gap: 0.65rem; padding: 0.45rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.82rem; }
    .dc-tl-date { min-width: 2.8rem; color: #64748b; font-weight: 700; }
    .dc-tl-title { font-weight: 600; }
    .dc-preview-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 300;
      display: flex; flex-direction: column;
    }
    .dc-preview-overlay.hidden { display: none; }
    .dc-preview-bar {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem;
      background: #0f172a; color: #fff;
    }
    .dc-preview-bar button { background: transparent; border: none; color: #fff; font-size: 1rem; cursor: pointer; }
    .dc-preview-body { flex: 1; overflow: auto; background: #1e293b; display: flex; align-items: center; justify-content: center; }
    .dc-preview-body iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .dc-preview-body img { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: pinch-zoom; }
    .dc-preview-json {
      width: 100%; max-height: 100%; overflow: auto; padding: 0.75rem; box-sizing: border-box;
      background: #0f172a; color: #e2e8f0; font-size: 0.72rem; font-family: ui-monospace, monospace; white-space: pre-wrap;
    }
    .dc-qnap-bar {
      margin: 0.65rem 0; padding: 0.55rem 0.65rem; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0;
      font-size: 0.8rem;
    }
    .dc-qnap-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .dc-qnap-actions button {
      min-height: 40px; padding: 0.35rem 0.65rem; border-radius: 8px; border: 1px solid #cbd5e1;
      background: #fff; font-weight: 700; font-size: 0.8rem; cursor: pointer;
    }
    .dc-back { display: inline-flex; align-items: center; gap: 0.35rem; margin-bottom: 0.65rem; color: var(--tisly-blue, #4f6fa8); font-weight: 700; text-decoration: none; border: none; background: none; cursor: pointer; font-size: 0.9rem; }
    .hidden { display: none !important; }
    .empty-hint { text-align: center; color: #94a3b8; padding: 1rem 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <div id="view-home">
      <p class="section-label">📁 Document Center</p>
      <p class="section-hint">案件の書類・写真・図面を一元管理</p>
      <div class="dc-search">
        <input id="search-input" type="search" placeholder="案件名・顧客名・見積番号・請求番号・ファイル名" autocomplete="off" />
      </div>
      <div class="dc-tabs" role="tablist">
        <button type="button" id="tab-all" class="active">すべて</button>
        <button type="button" id="tab-favorites">⭐ お気に入り</button>
      </div>
      <div id="search-results" class="hidden"></div>
      <section id="recent-section" class="dash-section">
        <h2 style="font-size:0.92rem;margin:0 0 0.55rem;">🕐 最近使った書類</h2>
        <div id="recent-list"><p class="empty-hint">読み込み中…</p></div>
      </section>
      <section>
        <h2 style="font-size:0.92rem;margin:0 0 0.55rem;">📂 案件一覧</h2>
        <div id="project-list"><p class="empty-hint">読み込み中…</p></div>
      </section>
    </div>

    <div id="view-project" class="hidden">
      <button type="button" class="dc-back" id="btn-back">← 一覧へ</button>
      <div id="project-header"></div>
      <div id="qnap-bar" class="dc-qnap-bar hidden"></div>
      <div id="folder-list"></div>
      <section class="dc-timeline">
        <h2 style="font-size:0.92rem;margin:0 0 0.55rem;">📅 ドキュメント履歴</h2>
        <div id="timeline-list"></div>
      </section>
    </div>
  </main>

  <div id="preview-overlay" class="dc-preview-overlay hidden" aria-hidden="true">
    <div class="dc-preview-bar">
      <button type="button" id="preview-close">← 閉じる</button>
      <span id="preview-title" style="flex:1;font-weight:700;font-size:0.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
    <div id="preview-body" class="dc-preview-body"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/documents-v1.js"></script>
</body>
</html>
