<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>建物の見取り図 — 営業デモ</title>
  <style>
    :root {
      --online: #22c55e;
      --warning: #f59e0b;
      --offline: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 10; background: rgba(15,23,42,0.95); padding: 0.75rem 1rem; border-bottom: 1px solid #334155; }
    header a { color: #86efac; text-decoration: none; font-size: 0.9rem; }
    h1 { margin: 0.25rem 0 0; font-size: 1.1rem; }
    #preview-status { margin: 0.35rem 0 0; font-size: 0.88rem; color: #94a3b8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .toolbar button { min-height: 44px; padding: 0.5rem 1rem; border-radius: 10px; border: none; font-size: 0.9rem; cursor: pointer; }
    #btn-intrusion { background: #dc2626; color: #fff; }
    #btn-refresh { background: #334155; color: #fff; }
    #floor-stack { padding: 1rem; max-width: 900px; margin: 0 auto; }
    .floor-layer { margin-bottom: 2rem; background: var(--card); border-radius: 16px; padding: 1rem; }
    .floor-layer h2 { margin: 0 0 0.75rem; font-size: 1.15rem; color: #86efac; }
    .floor-map-wrap { position: relative; width: 100%; aspect-ratio: 4/3; background: #0b1220; border-radius: 12px; overflow: hidden; }
    .floor-map-img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .floor-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 44px;
      min-height: 44px;
    }
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .pin-online .pin-dot { background: var(--online); }
    .pin-warning .pin-dot { background: var(--warning); }
    .pin-offline .pin-dot { background: var(--offline); }
    .pin-lbl { font-size: 0.65rem; margin-top: 2px; color: #e2e8f0; text-shadow: 0 1px 3px #000; max-width: 72px; text-align: center; }
    .layer-legend { font-size: 0.8rem; color: #94a3b8; margin: 0.5rem 0 0; }
    .legend-bar { display: flex; gap: 1rem; flex-wrap: wrap; padding: 0 1rem 1rem; font-size: 0.8rem; }
    .legend-bar span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .lg-on::before { background: var(--online); }
    .lg-warn::before { background: var(--warning); }
    .lg-off::before { background: var(--offline); }
  </style>
</head>
<body>
  <header>
    <a href="/sales">← 営業デモに戻る</a>
    <h1 id="preview-title">建物の見取り図</h1>
    <p id="preview-status">読み込み中…</p>
    <div class="toolbar">
      <button type="button" id="btn-intrusion">侵入を再現してスクロール</button>
      <button type="button" id="btn-refresh">状態を更新</button>
    </div>
  </header>
  <div class="legend-bar">
    <span class="lg-on">正常</span>
    <span class="lg-warn">注意</span>
    <span class="lg-off">つながらない</span>
  </div>
  <main id="floor-stack"></main>
  <script type="module" src="/js/sales-floor-preview.js"></script>
</body>
</html>
