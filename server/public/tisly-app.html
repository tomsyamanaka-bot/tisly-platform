<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a7f37" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2001" />
  <link rel="manifest" href="/tisly-app/manifest.webmanifest" />
  <title>TiSLY App</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; --accent: #1a7f37; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    nav { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
    nav a { color: var(--muted); text-decoration: none; padding: 0.35rem 0.65rem; border-radius: 6px; }
    nav a.active { color: #fff; background: var(--accent); }
    main { padding: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <nav id="tisly-nav" aria-label="TiSLY App">
    <a href="/tisly-app/home" data-route="home">Home</a>
    <a href="/tisly-app/devices" data-route="devices">Devices</a>
    <a href="/tisly-app/events" data-route="events">Events</a>
    <a href="/tisly-app/settings" data-route="settings">Settings</a>
  </nav>
  <main id="tisly-main">
    <p>読み込み中…</p>
  </main>
  <script src="/tisly-app/app.js" defer></script>
</body>
</html>
