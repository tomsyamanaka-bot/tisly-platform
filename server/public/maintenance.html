<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b45309" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY保守" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest-maintenance.webmanifest" />
  <title>TiSLY — 保守 PWA</title>
  <link rel="stylesheet" href="/css/tisly-pwa-shell.css" />
  <link rel="stylesheet" href="/css/maintenance.css" />
</head>
<body class="maintenance-body">
  <div id="tisly-pwa-topbar-root"></div>
  <header class="maintenance-header">
    <h1>保守 Maintenance</h1>
    <p class="hint">Phase 1681–1720 — 点検・部材・Shelly を1画面で</p>
    <div class="maint-customer-row">
      <select id="maint-customer">
        <option value="TOMS001">TOMS001 — トムズ設備デモ</option>
        <option value="HOTEL001">HOTEL001</option>
        <option value="DEMO001">DEMO001</option>
      </select>
      <select id="maint-site"><option value="">読込中…</option></select>
    </div>
  </header>
  <main class="maint-dashboard" id="maint-dashboard">
    <section class="maint-card maint-card-highlight" data-panel="schedule">
      <h2>点検予定</h2>
      <ul id="maint-schedule-list" class="maint-list"></ul>
      <details class="maint-expand">
        <summary>予定を追加</summary>
        <label>タイトル <input id="maint-schedule-title" placeholder="月次点検" /></label>
        <label>期限 <input id="maint-schedule-due" type="date" /></label>
        <button type="button" class="btn-maint" id="btn-maint-add-schedule">予定を追加</button>
      </details>
    </section>
    <section class="maint-card" data-panel="complete">
      <h2>点検完了</h2>
      <textarea id="maint-report-comment" rows="2" placeholder="点検コメント"></textarea>
      <button type="button" class="btn-maint" id="btn-maint-submit-report">点検完了・報告送信</button>
      <ul id="maint-report-list" class="maint-list"></ul>
    </section>
    <section class="maint-card" data-panel="photos">
      <h2>写真</h2>
      <input type="file" accept="image/*" capture="environment" multiple id="maint-report-photos" class="maint-photo-input" />
      <p class="hint" id="maint-photo-hint">点検時の写真を添付</p>
    </section>
    <section class="maint-card" data-panel="parts">
      <h2>交換部材</h2>
      <label>部材名 <input id="maint-part-name" placeholder="例: PoEスイッチ" /></label>
      <label>数量 <input id="maint-part-qty" type="number" min="1" value="1" style="width:4rem" /></label>
      <ul id="maint-parts-list" class="maint-list"></ul>
    </section>
    <section class="maint-card" data-panel="shelly">
      <h2>Shelly再起動履歴</h2>
      <ul id="maint-shelly-list" class="maint-list"></ul>
      <ul id="maint-recovery" class="maint-list maint-sub"></ul>
    </section>
    <section class="maint-card" data-panel="anomaly">
      <h2>異常メモ</h2>
      <textarea id="maint-memo" rows="3" placeholder="異常・注意事項（ローカル保存）"></textarea>
      <button type="button" class="btn-maint secondary" id="btn-maint-save-memo">メモ保存</button>
      <ul id="maint-notifications" class="maint-list maint-sub"></ul>
    </section>
    <section class="maint-card maint-card-next" data-panel="next">
      <h2>次回点検日</h2>
      <p id="maint-next-date" class="maint-next-value">—</p>
      <p class="hint" id="maint-next-title"></p>
    </section>
    <details class="maint-advanced">
      <summary>デバイス詳細</summary>
      <ul id="maint-devices" class="maint-list"></ul>
      <div id="maint-heartbeat" class="maint-metrics">—</div>
      <div id="maint-mqtt" class="maint-metrics">—</div>
      <button type="button" class="btn-maint secondary" id="btn-maint-create-case">保守案件を作成</button>
    </details>
    <a class="maint-link-history" id="link-install-history" href="#">施工履歴を開く</a>
  </main>
  <script type="module" src="/js/tisly-pwa-shell.js"></script>
  <script type="module" src="/js/maintenance.js"></script>
</body>
</html>
