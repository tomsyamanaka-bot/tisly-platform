<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Customer Master 管理</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    header { background: #0f766e; color: #fff; padding: 16px; }
    header h1 { margin: 0 0 8px; font-size: 1.25rem; }
    header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .toolbar input { flex: 1; min-width: 140px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .toolbar button, .copy-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 0.85rem; }
    .toolbar button.primary { background: #0f766e; color: #fff; border-color: #0f766e; }
    main { padding: 16px; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .stat { background: #fff; border-radius: 10px; padding: 10px 14px; border: 1px solid #e2e8f0; min-width: 100px; }
    .stat strong { display: block; font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: top; font-size: 0.85rem; }
    th { background: #f8fafc; font-weight: 600; }
    .url-cell { display: flex; flex-wrap: wrap; gap: 4px; }
    .copy-btn.copied { background: #dcfce7; border-color: #86efac; }
    .back-link { color: #fff; text-decoration: underline; font-size: 0.85rem; }
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; background: #fff; }
      td { border: none; padding: 4px 0; }
      td::before { content: attr(data-label); font-weight: 600; display: block; font-size: 0.75rem; color: #64748b; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="/app">← App Hub</a>
    <h1>Customer Master 管理</h1>
    <p>Customer / Property 一覧 · URLコピー（社内専用）</p>
  </header>
  <div class="toolbar">
    <input type="search" id="customer-code" placeholder="customerCode 検索 (例: TOMS001)" />
    <input type="search" id="property-query" placeholder="Property 検索" />
    <button type="button" class="primary" id="btn-search">検索</button>
    <button type="button" id="btn-reset">リセット</button>
  </div>
  <main>
    <div class="stats" id="stats"></div>
    <div id="table-wrap"><p>読み込み中…</p></div>
  </main>
  <script type="module" src="/js/customer-admin-v1.js"></script>
</body>
</html>
