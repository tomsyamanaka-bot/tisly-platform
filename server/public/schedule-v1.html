<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8a54b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY日程" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2001" />
  <title>TiSLY — 日程調整</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    .event-desc-snippet {
      display: block;
      margin: 0.15rem 0 0;
      padding: 0;
      border: none;
      background: none;
      text-align: left;
      font-size: 0.78rem;
      line-height: 1.35;
      color: #475569;
      cursor: pointer;
    }
    .event-desc-snippet[aria-expanded="true"] { color: #0f172a; white-space: pre-wrap; }
    .integration-badges { display: none !important; }
    .integration-badge { font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 999px; font-weight: 600; }
    .integration-badge.live { background: #dcfce7; color: #166534; }
    .integration-badge.mock { background: #fef3c7; color: #92400e; }
    .integration-badge.unset { background: #f1f5f9; color: #64748b; }
    .integration-badge.pending { background: #dbeafe; color: #1d4ed8; }
    .integration-badge.error { background: #fee2e2; color: #b91c1c; }
    #sync-status.sync-error { color: #b91c1c; font-weight: 600; }
    .schedule-event-list .event-map-btn { display: inline-block; margin-top: 0.15rem; font-size: 0.72rem; padding: 0.1rem 0.4rem; }
    .schedule-event-list li { align-items: flex-start; }
    .schedule-event-list .event-time { display: block; color: #64748b; }
    .btn-compact { font-size: 0.78rem !important; padding: 0.28rem 0.5rem !important; min-height: 0; line-height: 1.25; }
    .departure-prep-card {
      margin-top: 0.3rem;
      padding: 0.35rem 0.45rem;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
    }
    .departure-prep-summary {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.1rem 0;
      border: none;
      background: none;
      text-align: left;
      font-size: 0.78rem;
      line-height: 1.35;
      color: #78350f;
      cursor: pointer;
    }
    .departure-prep-compact-line { font-weight: 600; }
    .departure-prep-details { margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dashed #fcd34d; }
    .departure-prep-details-title { margin: 0 0 0.2rem !important; font-size: 0.82rem !important; }
    .departure-prep-detail-row { margin: 0.12rem 0; font-size: 0.8rem; }
    .departure-prep-actions { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.35rem; }
    .departure-prep-kit-always { margin-top: 0.25rem; display:flex; flex-wrap:wrap; align-items:center; gap:0.35rem 0.5rem; }
    .departure-kit-progress { font-size:0.82rem; color:#475569; font-weight:600; }
    .departure-remind-badge { font-size: 0.72rem; padding: 0.05rem 0.35rem; border-radius: 999px; background: #dbeafe; color: #1d4ed8; }
    .departure-alert-card { margin: 0 0 0.5rem; padding: 0.5rem 0.6rem; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; }
    .departure-alert-title { margin: 0; font-weight: 700; font-size: 0.88rem; color: #92400e; }
    .departure-alert-body { margin: 0.2rem 0 0.35rem; font-size: 0.82rem; color: #78350f; }
    .schedule-nav-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.65rem;
      height: 1.65rem;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      text-decoration: none;
      font-size: 0.95rem;
      line-height: 1;
    }
    .schedule-nav-icon-btn.schedule-nav-icon-disabled { opacity: 0.35; }
    .schedule-day-compact { padding: 0.38rem 0.55rem !important; margin-bottom: 0.32rem !important; }
    .schedule-day-head-compact { margin-bottom: 0.15rem; }
    .schedule-day-head-main {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.5rem;
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .schedule-day-date { font-size: 0.92rem !important; font-weight: 700; }
    .schedule-day-count { color: #64748b; font-size: 0.78rem; }
    .schedule-day-avail-inline { margin-left: auto; font-size: 0.75rem; color: #64748b; text-align: right; }
    .schedule-day-avail-inline .stars { display: inline; font-size: 0.78rem; letter-spacing: 0.03em; color: #d97706; }
    .schedule-event-list-compact { margin-top: 0.15rem !important; }
    .schedule-event-list-compact .schedule-event-item {
      padding: 0.12rem 0 !important;
      gap: 0.25rem !important;
      align-items: flex-start;
    }
    .schedule-event-icon { font-size: 0.75rem; line-height: 1.35; flex-shrink: 0; opacity: 0.85; }
    .schedule-event-body { flex: 1; min-width: 0; }
    .event-time-line { font-size: 0.75rem; color: #64748b; line-height: 1.3; }
    .event-title-line {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .event-cal-line { margin-top: 0.08rem; font-size: 0.68rem; line-height: 1.2; color: #94a3b8; }
    .event-cal-name { font-size: 0.68rem !important; }
    .event-desc-compact {
      display: block;
      margin: 0.08rem 0 0;
      font-size: 0.72rem !important;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .event-desc-compact[aria-expanded="true"] { white-space: pre-wrap; overflow: visible; }
    .schedule-event-departure { margin-top: 0.15rem; }
    #btn-this-week { margin-bottom: 0.45rem !important; padding: 0.4rem 0.6rem; font-size: 0.85rem; }
    .schedule-summary-grid { margin: 0.3rem 0 !important; gap: 0.25rem !important; }
    .schedule-summary-item { padding: 0.28rem 0.2rem !important; font-size: 0.72rem; }
    .schedule-week-nav { margin-bottom: 0.35rem !important; }
    .schedule-today-badge {
      display: inline-block;
      margin-left: 0.25rem;
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      background: #fef3c7;
      color: #b45309;
      vertical-align: middle;
    }
    .schedule-day-today {
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 1px #fcd34d;
    }
    #btn-prev-week:disabled { opacity: 0.35; cursor: default; }
    .schedule-event-intel { display: block; padding: 0.08rem 0 !important; }
    .schedule-event-intel .schedule-intel-card-compact {
      border-left: 3px solid #e8a54b;
      margin-bottom: 0 !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .schedule-intel-summary {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.28rem 0.4rem;
      border: none;
      background: none;
      text-align: left;
    }
    .schedule-intel-time { font-size: 0.72rem; color: #64748b; line-height: 1.25; }
    .schedule-intel-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.04rem;
    }
    .schedule-intel-weather {
      font-size: 0.68rem;
      line-height: 1.3;
      color: #475569;
      margin-top: 0.06rem;
      white-space: normal;
    }
    .schedule-intel-practical { cursor: default; }
    .schedule-intel-travel {
      font-size: 0.74rem;
      line-height: 1.3;
      color: #0f172a;
      font-weight: 600;
      margin-top: 0.08rem;
    }
    .schedule-intel-travel strong { color: #b45309; }
    .schedule-intel-travel-muted { font-weight: 500; color: #64748b; }
    .schedule-intel-maps-unset {
      font-size: 0.7rem;
      line-height: 1.3;
      color: #64748b;
      margin-top: 0.08rem;
    }
    .schedule-intel-material {
      display: inline-block;
      font-size: 0.7rem;
      line-height: 1.3;
      color: #475569;
      margin-top: 0.06rem;
      text-decoration: none;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }
    a.schedule-intel-material { color: #1d4ed8; }
    .schedule-intel-address-btn { margin-top: 0; position: relative; z-index: 2; }
    .schedule-header-card {
      margin-bottom: 0.5rem;
      padding: 0.55rem 0.65rem;
    }
    .schedule-header-hint {
      margin: 0 0 0.45rem;
      font-size: 0.88rem;
      line-height: 1.35;
      color: #475569;
      white-space: normal;
      writing-mode: horizontal-tb;
      word-break: keep-all;
    }
    .schedule-header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }
    .schedule-header-actions .btn-sub {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
      writing-mode: horizontal-tb;
      text-align: center;
      font-size: 0.78rem;
      padding: 0.38rem 0.5rem;
    }
    .schedule-header-actions #btn-sync-calendar {
      flex: 1 1 100%;
    }
    @media (min-width: 360px) {
      .schedule-header-actions #btn-sync-calendar {
        flex: 1 1 auto;
      }
    }
    .schedule-sync-card {
      margin: 0 0 0.5rem;
      padding: 0.45rem 0.55rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #334155;
      white-space: normal;
      writing-mode: horizontal-tb;
      word-break: keep-all;
    }
    .schedule-sync-card.sync-error-state {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
    .schedule-sync-card.sync-success-state {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .schedule-sync-line { margin: 0; }
    .schedule-sync-detail-btn {
      display: inline-block;
      margin: 0.25rem 0 0;
      padding: 0;
      border: none;
      background: none;
      color: #1d4ed8;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }
    .schedule-sync-detail {
      margin-top: 0.35rem;
      padding-top: 0.35rem;
      border-top: 1px dashed #cbd5e1;
      font-size: 0.75rem;
      color: #64748b;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }
    .schedule-sync-detail.hidden { display: none; }
    .schedule-intel-address-unset {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
      margin-top: 0.2rem;
      padding: 0.28rem 0.4rem;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 6px;
    }
    .schedule-intel-address-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #c2410c;
      white-space: nowrap;
    }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <div class="friendly-card schedule-header-card">
      <p class="schedule-header-hint" id="page-hint">空き日確認・Google同期</p>
      <div class="schedule-header-actions">
        <a class="btn-sub btn-small" href="/settings-v1" title="管理者設定">⚙️ 設定</a>
        <a class="btn-sub btn-small" href="/google-calendar-settings-v1" title="Googleカレンダー連携設定">📅 連携</a>
        <button type="button" class="btn-sub btn-small" id="btn-sync-calendar" title="Googleカレンダー同期">Google予定を同期</button>
      </div>
    </div>
    <div id="integration-badges"></div>
    <div id="departure-alert-mount" class="hidden" aria-live="polite"></div>
    <div id="sync-status-card" class="schedule-sync-card hidden" aria-live="polite">
      <div id="sync-status-summary"></div>
      <button type="button" class="schedule-sync-detail-btn hidden" id="btn-sync-detail-toggle" aria-expanded="false">詳細</button>
      <div id="sync-status-detail" class="schedule-sync-detail hidden" aria-hidden="true"></div>
    </div>

    <div class="schedule-mode-tabs tab-row" role="tablist">
      <button type="button" class="tab-btn active" id="mode-week" role="tab">週間</button>
      <button type="button" class="tab-btn" id="mode-three" role="tab">3週間</button>
      <button type="button" class="tab-btn" id="mode-month" role="tab">月間</button>
    </div>

    <div id="view-week">
      <div class="schedule-week-nav">
        <button type="button" id="btn-prev-week" aria-label="前の7日間">＜</button>
        <div>
          <div class="schedule-week-label" id="week-label">今日から7日間</div>
          <div class="section-hint" id="week-range" style="text-align:center;margin:0;"></div>
        </div>
        <button type="button" id="btn-next-week" aria-label="次の7日間">＞</button>
      </div>
      <button type="button" class="btn-sub hidden" id="btn-this-week" style="width:100%;margin-bottom:0.75rem;">今日に戻る</button>
      <div id="week-summary" class="schedule-summary-grid hidden"></div>
      <div id="week-days"></div>
    </div>

    <div id="view-three" class="hidden">
      <div class="schedule-week-nav">
        <button type="button" id="btn-prev-three">＜</button>
        <div class="schedule-week-label" id="three-label">3週間</div>
        <button type="button" id="btn-next-three">＞</button>
      </div>
      <div id="three-blocks"></div>
    </div>

    <div id="view-month" class="hidden">
      <div class="schedule-week-nav">
        <button type="button" id="btn-prev-month">＜</button>
        <div class="schedule-week-label" id="month-label">—</div>
        <button type="button" id="btn-next-month">＞</button>
      </div>
      <div class="schedule-month-wd schedule-month-grid">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="month-grid" class="schedule-month-grid"></div>
    </div>

    <div id="day-detail" class="friendly-card hidden">
      <h3 id="day-detail-title">—</h3>
      <div id="day-detail-body"></div>
      <button type="button" class="btn-sub" id="btn-close-day">閉じる</button>
    </div>

    <div id="unavail-form" class="friendly-card hidden">
      <p class="section-label">🚫 現場不可にする</p>
      <label class="friendly-label">日付 <input type="date" id="unavail-date" /></label>
      <label class="friendly-label">理由
        <select id="unavail-reason">
          <option value="事務処理">事務処理</option>
          <option value="家族予定">家族予定</option>
          <option value="材料待ち">材料待ち</option>
          <option value="移動不可">移動不可</option>
          <option value="電話対応のみ">電話対応のみ</option>
        </select>
      </label>
      <button type="button" class="btn-main" id="btn-save-unavail">登録する</button>
      <button type="button" class="btn-sub" id="btn-cancel-unavail">やめる</button>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/schedule-v1.js"></script>
</body>
</html>
