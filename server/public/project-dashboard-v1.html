<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6fa8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 案件ダッシュボード</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    body.tisly-friendly.has-practical-nav .app-main {
      padding: 0.85rem 1rem 1.25rem;
      max-width: 480px;
      margin: 0 auto;
    }
    .dash-search {
      margin-bottom: 0.85rem;
    }
    .dash-search input {
      width: 100%; min-height: 48px; padding: 0.65rem 0.9rem;
      border: 1px solid #cbd5e1; border-radius: 12px; font-size: 1rem;
      box-sizing: border-box; background: #fff;
    }
    .kpi-scroll {
      display: flex; gap: 0.55rem; overflow-x: auto;
      padding: 0.15rem 0.1rem 0.5rem; margin-bottom: 1rem;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .kpi-scroll::-webkit-scrollbar { display: none; }
    .kpi-pill {
      flex: 0 0 auto; min-width: 92px; scroll-snap-align: start;
      border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
      padding: 0.6rem 0.65rem; text-align: center;
    }
    .kpi-pill.total { border-color: #4f6fa8; background: #eff6ff; min-width: 100px; }
    .kpi-pill .val { font-size: 1.2rem; font-weight: 800; color: #1e293b; line-height: 1.25; }
    .kpi-pill .lbl { font-size: 0.65rem; color: #64748b; margin-top: 0.2rem; line-height: 1.3; }
    .dash-section {
      margin-bottom: 1.1rem;
    }
    .dash-section h2 {
      font-size: 0.92rem; margin: 0 0 0.55rem; color: #334155;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .dash-card {
      border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
      padding: 0.8rem 0.85rem; margin-bottom: 0.55rem;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .dash-card:active { background: #f8fafc; }
    .dash-card.static {
      cursor: default; background: #f8fafc; border-color: #edf2f7;
      opacity: 0.72;
    }
    .dash-card.static:active { background: #f8fafc; }
    .dash-card-head { display: flex; justify-content: space-between; gap: 0.55rem; align-items: flex-start; }
    .dash-time { font-size: 0.8rem; font-weight: 700; color: #4f6fa8; white-space: nowrap; }
    .dash-title { font-weight: 700; font-size: 0.95rem; margin: 0.25rem 0; line-height: 1.4; }
    .dash-meta { font-size: 0.8rem; color: #64748b; line-height: 1.5; }
    .dash-raw-title { font-size: 0.72rem; color: #94a3b8; margin-top: 0.15rem; }
    .alert-badge {
      font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.45rem;
      border-radius: 999px; white-space: nowrap;
    }
    .alert-red { background: #fee2e2; color: #b91c1c; }
    .alert-yellow { background: #fef3c7; color: #b45309; }
    .alert-blue { background: #dbeafe; color: #1d4ed8; }
    .dash-card.alert-red-border { border-left: 4px solid #ef4444; }
    .dash-card.alert-yellow-border { border-left: 4px solid #f59e0b; }
    .dash-card.alert-blue-border { border-left: 4px solid #3b82f6; }
    .status-chip {
      font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.4rem;
      border-radius: 999px; background: #eff6ff; color: #1d4ed8;
    }
    .city-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
    }
    .city-table th, .city-table td {
      padding: 0.55rem 0.65rem; text-align: left; border-bottom: 1px solid #f1f5f9;
    }
    .city-table th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.72rem; }
    .city-table tr:last-child td { border-bottom: none; }
    .city-table td:last-child { text-align: right; font-weight: 700; }
    .sales-grid {
      display: grid; grid-template-columns: 1fr; gap: 0.45rem;
    }
    .sales-card {
      border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
      padding: 0.65rem 0.75rem; display: flex; justify-content: space-between; align-items: center;
    }
    .sales-card .label { font-size: 0.8rem; color: #64748b; }
    .sales-card .amount { font-size: 1rem; font-weight: 800; color: #1e293b; font-variant-numeric: tabular-nums; }
    .search-results { margin-bottom: 0.75rem; }
    .search-results.hidden { display: none; }
    .empty-hint { text-align: center; color: #94a3b8; padding: 1rem 0.5rem; font-size: 0.85rem; }
    .month-label { font-size: 0.75rem; color: #64748b; margin: 0 0 0.35rem; }
    .link-row { margin-top: 0.5rem; }
    .link-row a {
      font-size: 0.82rem; color: #4f6fa8; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <p class="section-label">📊 案件ダッシュボード</p>
    <p class="section-hint">案件の全体像と今日やることを確認</p>

    <div class="dash-search">
      <input id="search-input" type="search" placeholder="案件ID・顧客名・電話・住所・担当で検索" autocomplete="off" />
    </div>

    <div id="search-results" class="search-results hidden"></div>

    <div id="kpi-scroll" class="kpi-scroll" aria-label="案件KPI"></div>

    <section class="dash-section">
      <h2>📅 今日の予定</h2>
      <p id="today-date-label" class="month-label"></p>
      <div id="today-list"></div>
    </section>

    <section class="dash-section">
      <h2>⚠️ 要対応案件</h2>
      <div id="alerts-list"></div>
    </section>

    <section class="dash-section">
      <h2>🕐 最近使った書類</h2>
      <div id="recent-docs-list"></div>
      <p class="link-row"><a href="/documents-v1">Document Center →</a></p>
    </section>

    <section class="dash-section">
      <h2>🕐 最近更新した案件</h2>
      <div id="recent-list"></div>
      <p class="link-row"><a href="/project-mgmt-v1">案件管理を開く →</a></p>
    </section>

    <section class="dash-section">
      <h2>🏙 市別集計</h2>
      <table class="city-table" id="city-table">
        <thead><tr><th>市</th><th>コード</th><th>件数</th></tr></thead>
        <tbody id="city-tbody"></tbody>
      </table>
    </section>

    <section class="dash-section">
      <h2>💴 月間売上（簡易）</h2>
      <p id="sales-month-label" class="month-label"></p>
      <div id="sales-grid" class="sales-grid"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/project-dashboard-v1.js"></script>
</body>
</html>
