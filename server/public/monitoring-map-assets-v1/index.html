<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050b18" />
  <title>TiSLY — mapAsset Manager V3.1</title>
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2003" />
  <link rel="stylesheet" href="/monitoring-map-assets-v1/css/monitoring-map-assets-v1.css" />
</head>
<body class="mma-body">
  <header class="mma-header">
    <div>
      <p class="mma-brand">TiSLY Monitoring</p>
      <h1>mapAsset Manager V3.1</h1>
      <p id="mma-site-label" class="mma-muted">siteId —</p>
    </div>
    <div class="mma-header-actions">
      <a class="mma-btn secondary" id="mma-link-3d" href="#">3D Dashboard</a>
      <button type="button" class="mma-btn secondary" id="mma-btn-reload">再読込</button>
    </div>
  </header>

  <main class="mma-main">
    <section class="mma-panel">
      <h2>アップロード / メタデータ登録</h2>
      <p class="mma-hint">実ファイル保存は次フェーズ。今回はメタデータ + mock preview 登録。</p>
      <form id="mma-upload-form" class="mma-form">
        <label>タイトル<input name="title" required placeholder="Polycam 1F scan" /></label>
        <label>sourceType
          <select name="sourceType" required>
            <option value="polycam">polycam（GLB推奨）</option>
            <option value="roomplan">roomplan（JSON/USDZ）</option>
            <option value="scaniverse">scaniverse（GLB/OBJ）</option>
            <option value="manual">manual</option>
            <option value="mock">mock</option>
          </select>
        </label>
        <label>fileType
          <select name="fileType">
            <option value="glb">glb</option>
            <option value="gltf">gltf</option>
            <option value="obj">obj</option>
            <option value="ply">ply</option>
            <option value="usdz">usdz</option>
            <option value="json">json</option>
            <option value="image">image</option>
            <option value="unknown">unknown</option>
          </select>
        </label>
        <label>floorLevel
          <select name="floorLevel" required>
            <option value="perimeter">外周 (perimeter)</option>
            <option value="1f">1F</option>
            <option value="2f">2F</option>
            <option value="roof">屋根 (roof)</option>
          </select>
        </label>
        <label>mapType
          <select name="mapType">
            <option value="mesh">mesh</option>
            <option value="pointcloud">pointcloud</option>
            <option value="floorplan">floorplan</option>
            <option value="placeholder">placeholder</option>
            <option value="building_shell">building_shell</option>
          </select>
        </label>
        <label>ファイル名（任意）<input name="fileName" placeholder="scan-1f.glb" /></label>
        <label>メモ<textarea name="notes" rows="2" placeholder="現調メモ"></textarea></label>
        <label class="mma-check"><input type="checkbox" name="setActive" /> 登録後 active にする</label>
        <button type="submit" class="mma-btn">メタデータ登録</button>
      </form>
      <p id="mma-upload-msg" class="mma-msg" hidden></p>
    </section>

    <section class="mma-panel">
      <h2>登録済み 3D マップ</h2>
      <div id="mma-asset-list" class="mma-asset-list"></div>
    </section>

    <section class="mma-panel" id="mma-calibration-panel" hidden>
      <h2>フロアキャリブレーション（transform）</h2>
      <p id="mma-cal-title" class="mma-muted">—</p>
      <div class="mma-transform-grid">
        <label>X<input type="number" step="0.1" id="mma-t-x" /></label>
        <label>Y<input type="number" step="0.1" id="mma-t-y" /></label>
        <label>Z<input type="number" step="0.1" id="mma-t-z" /></label>
        <label>回転 X<input type="number" step="1" id="mma-t-rx" /></label>
        <label>回転 Y<input type="number" step="1" id="mma-t-ry" /></label>
        <label>回転 Z<input type="number" step="1" id="mma-t-rz" /></label>
        <label>スケール X<input type="number" step="0.1" id="mma-t-sx" /></label>
        <label>スケール Y<input type="number" step="0.1" id="mma-t-sy" /></label>
        <label>スケール Z<input type="number" step="0.1" id="mma-t-sz" /></label>
        <label>高さオフセット<input type="number" step="0.1" id="mma-t-ho" /></label>
      </div>
      <div class="mma-actions">
        <button type="button" class="mma-btn" id="mma-btn-save-transform">保存</button>
        <button type="button" class="mma-btn secondary" id="mma-btn-reset-transform">リセット</button>
        <a class="mma-btn secondary" id="mma-btn-preview-3d" href="#" target="_blank">3Dプレビュー</a>
      </div>
      <p id="mma-cal-msg" class="mma-msg" hidden></p>
    </section>

    <section class="mma-panel">
      <h2>開発者向け uploadGuide</h2>
      <div id="mma-upload-guide" class="mma-guide"></div>
    </section>
  </main>

  <script type="module" src="/monitoring-map-assets-v1/js/monitoring-map-assets-v1.js"></script>
</body>
</html>
