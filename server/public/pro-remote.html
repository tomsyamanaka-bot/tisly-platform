<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY監視" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2001" />
  <link rel="manifest" id="pro-remote-manifest" href="/manifest-pro-remote.webmanifest" />
  <title>TiSLY — PRO Remote</title>
  <link rel="stylesheet" href="/css/tisly-pwa-shell.css" />
  <link rel="stylesheet" href="/css/pro-remote-pwa.css" />
  <link rel="stylesheet" href="/css/pro-remote-floor-map.css" />
</head>
<body class="pro-remote-pwa-body">
  <div id="tisly-pwa-topbar-root"></div>
  <header>
    <h1>PRO Remote</h1>
    <p id="pro-remote-customer"></p>
    <p id="pro-remote-security-badge" class="pro-security-badge" hidden></p>
  </header>
  <nav class="pro-remote-nav">
    <a id="link-pro-ops" href="#">運用コンソール</a>
    <a id="link-pro-overview" href="#">概要</a>
    <a id="link-pro-health" href="#">Health</a>
    <a id="link-pro-tv" href="#">TV（非PWA）</a>
  </nav>
  <main class="pro-remote-main">
    <section class="card floor-map-controls">
      <h2>フロアマップ</h2>
      <p id="floor-map-alert" class="floor-map-alert" hidden></p>
      <label>ピン種類
        <select id="floor-pin-type">
          <option value="camera">camera</option>
          <option value="beam">beam</option>
          <option value="pir">pir</option>
          <option value="door">door</option>
          <option value="window">window</option>
          <option value="relay">relay</option>
          <option value="esp">esp</option>
          <option value="shelly">shelly</option>
          <option value="speaker">speaker</option>
          <option value="light">light</option>
        </select>
      </label>
      <button type="button" class="btn-pro" id="btn-floor-alert-jump">異常階へジャンプ</button>
      <p class="hint">縦スワイプ: 外周 → 1F → 2F。図面をタップでピン配置。</p>
    </section>
    <div id="floor-map-stack" class="floor-map-stack"></div>
    <section class="card pro-remote-shortcuts">
      <h2>監視ショートカット</h2>
      <p class="hint">フル機能は <a id="link-operations-full" href="/operations">/operations</a></p>
    </section>
  </main>
  <script type="module" src="/js/tisly-pwa-shell.js"></script>
  <script type="module" src="/js/pro-remote-pwa.js"></script>
</body>
</html>
