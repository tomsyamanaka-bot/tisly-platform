<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — Knowledge v1</title>
  <link rel="stylesheet" href="/css/knowledge-v1.css" />
</head>
<body>
  <div class="kn-page">
    <a href="/app" class="kn-back-link">← App Hub</a>

    <header class="kn-hero">
      <h1>📚 Knowledge</h1>
      <p>現場ナレッジを3秒で検索</p>
    </header>

    <div class="kn-search-wrap">
      <input
        type="search"
        id="search-input"
        class="kn-search-input"
        placeholder="キーワード検索…"
        autocomplete="off"
        enterkeyhint="search"
      />
      <button type="button" class="kn-mic-btn" id="mic-btn" aria-label="音声入力">🎤</button>
    </div>

    <p class="kn-section-label">クイック選択</p>
    <div class="kn-tags" id="tag-row"></div>

    <p class="kn-section-label">ナレッジカード</p>
    <div class="kn-results" id="results" aria-live="polite"></div>
  </div>

  <div class="kn-modal-backdrop" id="modal-backdrop" aria-hidden="true">
    <div class="kn-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="kn-modal-handle"></div>
      <h2 id="modal-title"></h2>
      <div class="kn-modal-body" id="modal-body"></div>
      <button type="button" class="kn-modal-close" id="modal-close">閉じる</button>
    </div>
  </div>

  <script type="module" src="/js/knowledge-v1.js"></script>
</body>
</html>
