<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>TiSLY — Version History</title>
  <link rel="stylesheet" href="/css/tisly-pwa-shell.css" />
  <link rel="stylesheet" href="/css/app-hub.css" />
</head>
<body class="app-hub-body">
  <header class="app-hub-header">
    <h1>Version History</h1>
    <p class="hint"><a href="/app">← Deploy Center / App Hub</a></p>
  </header>
  <section class="card version-history-card">
    <h2>Current Build</h2>
    <dl id="version-current-facts" class="deploy-center-facts"></dl>
  </section>
  <section class="card version-history-card">
    <h2>Build 履歴</h2>
    <div id="version-build-list" class="version-history-list">読み込み中…</div>
  </section>
  <section class="card version-history-card">
    <h2>Deploy 履歴</h2>
    <div id="version-deploy-list" class="version-history-list">読み込み中…</div>
  </section>
  <section class="card version-history-card">
    <h2>Rollback 履歴</h2>
    <div id="version-rollback-list" class="version-history-list">読み込み中…</div>
  </section>
  <script type="module" src="/js/app-version.js"></script>
</body>
</html>
