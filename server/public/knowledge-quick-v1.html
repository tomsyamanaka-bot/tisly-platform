<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#475569" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — ＋ナレッジ登録</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    .quick-hero { text-align: center; margin-bottom: 0.75rem; }
    .quick-hero h1 { margin: 0; font-size: 1.15rem; }
    .quick-hero p { margin: 0.35rem 0 0; color: #64748b; font-size: 0.85rem; }
    .photo-preview {
      width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px;
      border: 1px solid #e2e8f0; background: #f8fafc;
    }
    .photo-preview.hidden { display: none; }
    .form-grid label { display: block; margin: 0.5rem 0; font-size: 0.9rem; }
    .form-grid input, .form-grid select, .form-grid textarea {
      width: 100%; box-sizing: border-box; margin-top: 0.25rem;
    }
    .form-grid textarea { min-height: 5rem; }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0; }
    .tag-chip-btn {
      border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 999px;
      padding: 0.25rem 0.55rem; font-size: 0.78rem; cursor: pointer;
    }
    .tag-chip-btn.active { background: #475569; color: #fff; border-color: #475569; }
    .save-big {
      width: 100%; min-height: 56px; margin-top: 0.75rem; font-size: 1.05rem; font-weight: 700;
      border-radius: 12px; border: none; background: #475569; color: #fff;
    }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <div class="quick-hero">
      <h1>＋ナレッジ登録</h1>
      <p>現場写真 → メモ → 保存（30秒目標）</p>
    </div>

    <div class="friendly-card">
      <form id="quick-form" class="form-grid">
        <label>写真（任意）
          <input id="quick-photo" type="file" accept="image/*" capture="environment" />
        </label>
        <img id="photo-preview" class="photo-preview hidden" alt="プレビュー" />
        <label>タイトル
          <input id="quick-title" type="text" placeholder="例: PoE給電 配線" autocomplete="off" />
        </label>
        <label>カテゴリ
          <select id="quick-category"></select>
        </label>
        <p class="section-hint">タグ（タップで追加）</p>
        <div class="tag-chips" id="tag-chips"></div>
        <label>メモ
          <textarea id="quick-memo" placeholder="現場メモを1〜3文で" required></textarea>
        </label>
        <button type="submit" class="save-big">💾 保存</button>
      </form>
    </div>
    <a href="/knowledge-v1" class="btn-sub" style="display:block;margin-top:0.65rem;text-align:center;">詳細登録画面へ</a>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/knowledge-quick-v1.js"></script>
</body>
</html>
