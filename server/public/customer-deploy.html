<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiSLY — 顧客導入管理</title>
  <style>
    :root { --green: #1a7f37; --border: #d0d7de; }
    body { max-width: 800px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, sans-serif; }
    h1 { color: var(--green); }
    section { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    button { background: var(--green); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin-top: 0.5rem; }
    textarea { width: 100%; min-height: 4rem; }
  </style>
</head>
<body>
  <nav><a href="/deployment/checklist">導入チェックリスト</a></nav>
  <h1 id="title">顧客導入管理</h1>
  <section>
    <h2>保守依頼</h2>
    <textarea id="maint-notes" placeholder="保守内容を入力"></textarea>
    <button id="maint-btn">保守依頼を登録</button>
    <ul id="maint-list"></ul>
  </section>
  <section>
    <h2>引渡し資料</h2>
    <p><a id="pkg-html" href="#" target="_blank">HTMLプレビュー</a> · <a id="pkg-pdf" href="#">PDFダウンロード</a></p>
  </section>
  <section>
    <h2>施工モード</h2>
    <p id="install-link"></p>
    <ul id="install-devices"></ul>
  </section>
  <script type="module" src="/js/customer-deploy.js"></script>
</body>
</html>
