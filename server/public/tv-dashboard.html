<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TiSLY TV Dashboard</title>
  <link rel="stylesheet" href="/css/tv-dashboard.css" />
</head>
<body class="tv-dashboard">
  <div id="tv-normal">
    <header class="tv-header">
      <div class="tv-brand">
        <img id="tv-logo" alt="" hidden />
        <div>
          <h1 id="tv-company">TiSLY</h1>
          <span id="tv-code"></span>
        </div>
      </div>
      <div class="tv-clock" id="tv-clock">--:--:--</div>
    </header>
    <section class="tv-sites" id="tv-sites"></section>
    <section class="tv-summary" id="tv-summary"></section>
    <section class="tv-device-health" id="tv-device-health"></section>
    <section class="tv-cameras" id="tv-cameras"></section>
    <section class="tv-devices" id="tv-devices"></section>
    <p class="tv-recovery" id="tv-recovery"></p>
    <footer class="tv-security-footer" id="tv-pinning-info"></footer>
  </div>
  <div id="tv-alert-overlay" class="tv-alert-overlay" hidden>
    <div class="tv-alert-content">
      <h2 id="tv-alert-title">アラート</h2>
      <p id="tv-alert-message"></p>
      <p class="tv-alert-timer" id="tv-alert-timer">10</p>
      <p class="tv-remote-hint">Enter=詳細 · Back=通常 · ↑↓=表示切替</p>
    </div>
  </div>
  <div id="tv-detail-overlay" class="tv-alert-overlay tv-detail-overlay" hidden>
    <div class="tv-alert-content">
      <h2>詳細</h2>
      <pre id="tv-detail-body" style="white-space:pre-wrap;font-size:1.1rem"></pre>
      <p class="tv-remote-hint">Back で通常画面へ</p>
    </div>
  </div>
  <div id="tv-focus-overlay" class="tv-focus-overlay" hidden>
    <div class="tv-focus-content">
      <h2 id="tv-focus-title">カメラフォーカス</h2>
      <p id="tv-focus-floor"></p>
      <div class="tv-focus-camera-frame" id="tv-focus-camera">
        <div class="cam-label" id="tv-focus-cam-label">—</div>
        <div class="cam-placeholder">拡大表示（10秒）</div>
      </div>
      <p class="tv-focus-timer" id="tv-focus-timer">10</p>
    </div>
  </div>
  <p class="tv-view-label" id="tv-view-label">表示: 概要</p>
  <button type="button" id="tv-demo-focus-btn" class="tv-demo-focus-btn" title="デモ: カメラフォーカス">デモ focus</button>
  <script type="module" src="/js/tv-dashboard.js"></script>
</body>
</html>
