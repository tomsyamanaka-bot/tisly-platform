<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6fa8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 案件詳細</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    .detail-header { margin-bottom: 0.65rem; }
    .detail-id { font-family: ui-monospace, monospace; font-size: 0.9rem; color: #475569; font-weight: 700; }
    .detail-status {
      display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem;
      border-radius: 999px; background: #eff6ff; color: #1d4ed8; margin-top: 0.25rem;
    }
    .detail-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.65rem 0; }
    .detail-tab {
      flex: 1; min-width: 72px; min-height: 40px; padding: 0.35rem 0.45rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 0.78rem; font-weight: 700; color: #475569; cursor: pointer;
    }
    .detail-tab.active { background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8); }
    .tab-panel.hidden { display: none; }
    .info-grid { display: grid; grid-template-columns: minmax(5.5rem, auto) 1fr; gap: 0.35rem 0.65rem; font-size: 0.88rem; }
    .info-grid dt { color: #64748b; margin: 0; }
    .info-grid dd { margin: 0; color: #1e293b; word-break: break-word; }
    .link-card {
      display: block; padding: 0.75rem; border-radius: 10px; border: 1px solid #e2e8f0;
      background: #fff; text-decoration: none; color: inherit; margin-bottom: 0.5rem;
    }
    .link-card strong { display: block; margin-bottom: 0.2rem; }
    .link-card span { font-size: 0.82rem; color: #64748b; }
    .link-card.disabled { opacity: 0.55; pointer-events: none; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.65rem; }
    .btn-row a, .btn-row button {
      flex: 1; min-width: 120px; min-height: 44px; border-radius: 10px;
      border: 1px solid #cbd5e1; background: #f8fafc; font-weight: 600; font-size: 0.85rem;
      text-decoration: none; color: #334155; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-row .primary { background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8); }
    .btn-danger { color: #b91c1c !important; border-color: #fecaca !important; background: #fef2f2 !important; }
    .edit-field { margin-bottom: 0.5rem; }
    .edit-field label { display: block; font-size: 0.78rem; color: #64748b; margin-bottom: 0.15rem; }
    .edit-field input, .edit-field select {
      width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.4rem 0.6rem;
    }
    .future-field { font-size: 0.78rem; color: #94a3b8; margin-top: 0.5rem; }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main" id="detail-root">
    <p class="section-hint">読み込み中…</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/project-mgmt-detail-v1.js"></script>
</body>
</html>
