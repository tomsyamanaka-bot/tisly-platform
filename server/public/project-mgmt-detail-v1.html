<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6fa8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 案件詳細</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    .dash-meta { margin-bottom: 0.75rem; }
    .dash-info-grid {
      display: grid; grid-template-columns: minmax(5rem, auto) 1fr;
      gap: 0.3rem 0.55rem; font-size: 0.84rem; margin-bottom: 0.65rem;
    }
    .dash-info-grid dt { color: #64748b; margin: 0; }
    .dash-info-grid dd { margin: 0; color: #1e293b; word-break: break-word; }
    .detail-status {
      display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.45rem;
      border-radius: 999px;
    }
    .status-hero {
      margin: 0 0 0.85rem; padding: 1rem 0.85rem; border-radius: 14px;
      background: linear-gradient(135deg, #f8fafc 0%, #fff 100%);
      border: 1px solid #e2e8f0; text-align: center;
    }
    .status-hero-label {
      margin: 0 0 0.45rem; font-size: 0.78rem; font-weight: 700; color: #64748b;
      letter-spacing: 0.04em;
    }
    .status-hero-value {
      margin: 0; display: inline-block; font-size: 1.35rem; font-weight: 800;
      padding: 0.45rem 1.1rem; border-radius: 999px; line-height: 1.3;
    }
    .status-hero-updated {
      margin: 0.5rem 0 0; font-size: 0.68rem; color: #94a3b8;
    }
    .wf-card-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem;
    }
    @media (min-width: 520px) { .wf-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .wf-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem;
      min-height: 88px; padding: 0.55rem 0.6rem; border-radius: 10px;
      border: 1px solid #e2e8f0; background: #fff; cursor: pointer; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .wf-card:active { background: #f1f5f9; }
    .wf-card-icon { font-size: 1rem; line-height: 1; }
    .wf-card-label { font-weight: 700; font-size: 0.88rem; color: #1e293b; }
    .wf-card-state { font-size: 0.72rem; color: #475569; font-weight: 600; }
    .wf-card-summary { font-size: 0.68rem; color: #94a3b8; margin-top: auto; }
    .detail-tabs {
      display: flex; flex-wrap: nowrap; gap: 0.3rem; margin: 0.5rem 0;
      overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 0.15rem;
    }
    .detail-tab {
      flex: 0 0 auto; min-width: 64px; min-height: 40px; padding: 0.35rem 0.55rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 0.76rem; font-weight: 700; color: #475569; cursor: pointer; white-space: nowrap;
    }
    .detail-tab.active { background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8); }
    .info-grid { display: grid; grid-template-columns: minmax(5.5rem, auto) 1fr; gap: 0.35rem 0.65rem; font-size: 0.88rem; }
    .info-grid dt { color: #64748b; margin: 0; }
    .info-grid dd { margin: 0; color: #1e293b; word-break: break-word; }
    .section-sub { font-size: 0.88rem; margin: 0 0 0.45rem; color: #334155; }
    .share-section { margin-bottom: 0.85rem; padding-bottom: 0.65rem; border-bottom: 1px solid #e2e8f0; }
    .share-row { padding: 0.45rem 0; border-bottom: 1px solid #f1f5f9; }
    .share-doc { font-weight: 700; font-size: 0.88rem; }
    .share-meta { font-size: 0.78rem; color: #64748b; margin-top: 0.1rem; }
    .timeline-list { padding: 0.15rem 0; display: flex; flex-direction: column; gap: 0.45rem; }
    .tl-toolbar { margin-bottom: 0.65rem; }
    .tl-stats-row {
      display: flex; flex-wrap: wrap; gap: 0.5rem 0.85rem;
      margin-bottom: 0.5rem; font-size: 0.78rem; color: #475569;
    }
    .tl-stat strong { font-size: 0.92rem; color: #1e293b; }
    .tl-stat-backfill { color: #94a3b8; }
    .tl-stat-backfill strong { color: #64748b; }
    .tl-search-row {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.45rem;
    }
    .tl-chip-row { margin-bottom: 0; }
    .tl-search-input {
      width: 100%; min-height: 40px; padding: 0.4rem 0.65rem;
      border-radius: 10px; border: 1px solid #cbd5e1; font-size: 0.84rem;
      background: #fff;
    }
    .tl-filter-chip {
      flex: 0 0 auto; min-height: 40px; padding: 0.35rem 0.65rem;
      border-radius: 999px; border: 1px solid #cbd5e1; background: #f8fafc;
      font-size: 0.74rem; font-weight: 700; color: #64748b; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tl-filter-chip.active {
      background: #1e3a5f; color: #fff; border-color: #1e3a5f;
      box-shadow: 0 1px 3px rgba(30, 58, 95, 0.25);
    }
    .tl-card {
      display: block; width: 100%; text-align: left;
      min-height: 56px;
      padding: 0.7rem 0.75rem 0.7rem 0.85rem;
      border: 1px solid #e2e8f0; border-left: 4px solid #cbd5e1;
      border-radius: 0 10px 10px 0; background: #f8fafc;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .tl-card[aria-disabled="true"] { cursor: default; }
    .tl-card-head {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem 0.45rem;
      margin-bottom: 0.2rem;
    }
    .tl-time { font-size: 0.74rem; color: #64748b; font-weight: 700; }
    .tl-type-badge {
      font-size: 0.66rem; font-weight: 700; padding: 0.1rem 0.4rem;
      border-radius: 4px; background: rgba(0,0,0,0.06); color: #475569;
    }
    .tl-backfill-badge {
      font-size: 0.62rem; font-weight: 600; color: #94a3b8;
      padding: 0.05rem 0.35rem; border-radius: 4px;
      border: 1px solid #e2e8f0; background: #fff;
    }
    .tl-title { font-weight: 700; font-size: 0.9rem; color: #1e293b; line-height: 1.35; }
    .tl-detail {
      font-size: 0.78rem; color: #64748b; margin-top: 0.2rem;
      word-break: break-word; line-height: 1.45;
    }
    .tl-detail.clamped {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tl-expand-hint {
      display: block; font-size: 0.68rem; color: #94a3b8; margin-top: 0.15rem;
    }
    .tl-count-hint { font-size: 0.72rem; color: #94a3b8; text-align: right; margin-top: 0.35rem; }
    .tl-date-group { margin-bottom: 0.85rem; }
    .tl-date-heading {
      position: sticky; top: 0; z-index: 3;
      font-size: 0.78rem; font-weight: 700; color: #334155;
      margin: 0 0 0.4rem 0; padding: 0.35rem 0.15rem 0.3rem;
      background: linear-gradient(to bottom, #f8fafc 75%, rgba(248,250,252,0));
      border-bottom: 1px solid #e2e8f0;
    }
    .tl-empty { padding: 0.5rem 0 1rem; }
    .tl-empty-guide {
      font-size: 0.78rem; color: #94a3b8; margin: 0.35rem 0 0; line-height: 1.5;
    }
    .tl-cat-estimate { border-left-color: #2563eb; background: #eff6ff; }
    .tl-cat-estimate .tl-type-badge { background: #dbeafe; color: #1d4ed8; }
    .tl-cat-invoice { border-left-color: #16a34a; background: #f0fdf4; }
    .tl-cat-invoice .tl-type-badge { background: #dcfce7; color: #15803d; }
    .tl-cat-specification { border-left-color: #7c3aed; background: #f5f3ff; }
    .tl-cat-specification .tl-type-badge { background: #ede9fe; color: #6d28d9; }
    .tl-cat-completion { border-left-color: #a21caf; background: #fdf4ff; }
    .tl-cat-completion .tl-type-badge { background: #fae8ff; color: #86198f; }
    .tl-cat-share { border-left-color: #ea580c; background: #fff7ed; }
    .tl-cat-share .tl-type-badge { background: #ffedd5; color: #c2410c; }
    .tl-cat-qnap { border-left-color: #0891b2; background: #ecfeff; }
    .tl-cat-qnap .tl-type-badge { background: #cffafe; color: #0e7490; }
    .tl-cat-photo { border-left-color: #64748b; background: #f8fafc; }
    .tl-cat-photo .tl-type-badge { background: #e2e8f0; color: #475569; }
    .tl-cat-general { border-left-color: #94a3b8; background: #f8fafc; }
    .tl-cat-general .tl-type-badge { background: #e2e8f0; color: #475569; }
    .link-card {
      display: block; padding: 0.75rem; border-radius: 10px; border: 1px solid #e2e8f0;
      background: #fff; text-decoration: none; color: inherit; margin-bottom: 0.5rem;
    }
    .link-card strong { display: block; margin-bottom: 0.2rem; }
    .link-card span { font-size: 0.82rem; color: #64748b; }
    .link-card.disabled { opacity: 0.55; pointer-events: none; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.65rem; }
    .btn-row a, .btn-row button {
      flex: 1; min-width: 120px; min-height: 44px; border-radius: 10px;
      border: 1px solid #cbd5e1; background: #f8fafc; font-weight: 600; font-size: 0.85rem;
      text-decoration: none; color: #334155; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-row .primary { background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8); }
    .btn-danger { color: #b91c1c !important; border-color: #fecaca !important; background: #fef2f2 !important; }
    .edit-field { margin-bottom: 0.5rem; }
    .edit-field label { display: block; font-size: 0.78rem; color: #64748b; margin-bottom: 0.15rem; }
    .edit-field input, .edit-field select {
      width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.4rem 0.6rem;
    }
    .future-field { font-size: 0.78rem; color: #94a3b8; margin-top: 0.5rem; }
    .storage-status-card {
      padding: 0.65rem 0.75rem; border-radius: 10px; border: 1px solid #e2e8f0;
      background: #f8fafc; margin-bottom: 0.75rem;
    }
    .storage-status-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .storage-status-label { font-size: 0.82rem; font-weight: 700; color: #475569; }
    .storage-status-value { font-size: 0.88rem; font-weight: 700; }
    .storage-path { font-size: 0.72rem; color: #64748b; margin-top: 0.35rem; word-break: break-all; }
    .storage-path-label { font-size: 0.72rem; font-weight: 600; color: #94a3b8; margin-top: 0.45rem; }
    .storage-provider-hint { font-size: 0.68rem; color: #94a3b8; margin-top: 0.25rem; }
    .storage-file-list { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.75rem; }
    .storage-file-row {
      display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.55rem 0.65rem;
      border-radius: 10px; border: 1px solid #e2e8f0; background: #fff;
    }
    .storage-file-row.is-empty { opacity: 0.85; }
    .storage-file-icon { font-size: 1.1rem; line-height: 1.2; flex-shrink: 0; }
    .storage-file-body { flex: 1; min-width: 0; }
    .storage-file-name { font-weight: 700; font-size: 0.88rem; word-break: break-all; }
    .storage-file-meta { font-size: 0.74rem; color: #64748b; margin-top: 0.1rem; }
    .storage-file-subname { font-size: 0.72rem; color: #94a3b8; margin-top: 0.15rem; word-break: break-all; }
    .storage-file-empty { font-size: 0.74rem; color: #94a3b8; margin: 0.35rem 0 0; }
    .storage-file-actions {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem;
    }
    .storage-action-btn {
      flex: 1; min-width: 72px; min-height: 36px; padding: 0.3rem 0.45rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc;
      font-size: 0.76rem; font-weight: 700; color: #334155; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .storage-action-btn.primary {
      background: var(--tisly-blue, #4f6fa8); color: #fff; border-color: var(--tisly-blue, #4f6fa8);
    }
    .storage-action-btn:disabled { opacity: 0.55; cursor: wait; }
    .doc-tab-actions { margin-top: 0.45rem; }
    .storage-folder-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .storage-folder-chip {
      font-size: 0.68rem; padding: 0.2rem 0.45rem; border-radius: 6px;
      background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe;
    }
    .storage-upload-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.85rem;
    }
    .storage-upload-btn {
      flex: 1; min-width: 100px; min-height: 40px; padding: 0.35rem 0.5rem;
      border-radius: 8px; border: 1px solid #93c5fd; background: #eff6ff;
      font-size: 0.76rem; font-weight: 700; color: #1d4ed8; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .storage-upload-btn:disabled { opacity: 0.55; cursor: wait; }
    .storage-folder-tree { display: flex; flex-direction: column; gap: 0.35rem; }
    .storage-folder-block {
      border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; overflow: hidden;
    }
    .storage-folder-header {
      width: 100%; display: flex; align-items: center; gap: 0.35rem;
      padding: 0.55rem 0.65rem; border: none; background: #f8fafc;
      font-size: 0.82rem; font-weight: 700; color: #334155; cursor: pointer;
      text-align: left; -webkit-tap-highlight-color: transparent;
    }
    .storage-folder-chevron { font-size: 0.65rem; color: #94a3b8; width: 0.75rem; flex-shrink: 0; }
    .storage-folder-icon { flex-shrink: 0; }
    .storage-folder-name { flex: 1; min-width: 0; }
    .storage-folder-count { font-size: 0.68rem; font-weight: 600; color: #94a3b8; }
    .storage-folder-body { padding: 0.35rem 0.65rem 0.55rem 1.85rem; }
    .storage-folder-body[hidden] { display: none; }
    .storage-folder-file {
      display: flex; align-items: flex-start; gap: 0.35rem;
      padding: 0.2rem 0; font-size: 0.78rem; word-break: break-all;
    }
    .storage-folder-file-icon { flex-shrink: 0; }
    .storage-folder-file-link { color: #1d4ed8; text-decoration: none; }
    @media (orientation: landscape) and (max-height: 500px) {
      .wf-card-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .wf-card { min-height: 72px; }
    }
    .dash-back-link {
      display: inline-flex; align-items: center; gap: 0.25rem;
      margin-bottom: 0.75rem; padding: 0.35rem 0;
      font-size: 0.88rem; font-weight: 700; color: #4f6fa8;
      text-decoration: none; -webkit-tap-highlight-color: transparent;
    }
    .dash-back-link:active { opacity: 0.75; }
    .detail-back-nav {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-bottom: 0.65rem;
    }
    .dash-back-link-secondary { color: #64748b; }
    .detail-header { margin-bottom: 0.65rem; }
    .detail-title { font-size: 1.05rem; font-weight: 800; margin: 0; color: #1e293b; }
    .detail-subtitle { font-size: 0.78rem; color: #64748b; margin: 0.15rem 0 0; }
    .next-actions-card {
      padding: 0.65rem 0.75rem; border-radius: 12px; border: 1px solid #fde68a;
      background: linear-gradient(135deg, #fffbeb 0%, #fff 100%); margin-bottom: 0.75rem;
    }
    .next-actions-card.next-actions-done { border-color: #bbf7d0; background: #f0fdf4; }
    .next-actions-title { font-size: 0.82rem; font-weight: 800; margin: 0 0 0.45rem; color: #92400e; }
    .next-actions-done .next-actions-title { color: #15803d; }
    .next-actions-empty { font-size: 0.84rem; margin: 0; color: #15803d; font-weight: 600; }
    .next-actions-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .next-action-item {
      display: flex; align-items: center; gap: 0.45rem; width: 100%;
      min-height: 44px; padding: 0.45rem 0.55rem; border-radius: 10px;
      border: 1px solid #fcd34d; background: #fff; cursor: pointer; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .next-action-item:active { background: #fef3c7; }
    .next-action-icon { font-size: 1rem; flex-shrink: 0; }
    .next-action-label { font-size: 0.88rem; font-weight: 700; color: #1e293b; }
    .detail-tab .tab-badge { margin-left: 0.2rem; font-size: 0.72rem; }
    .overview-section {
      margin-bottom: 0.85rem; padding-bottom: 0.65rem; border-bottom: 1px solid #e2e8f0;
    }
    .overview-section:last-child { border-bottom: none; }
    .today-actions-list { margin: 0; padding-left: 1.1rem; font-size: 0.86rem; color: #334155; }
    .today-actions-list li { margin-bottom: 0.25rem; }
    .recent-history-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .recent-history-row {
      display: grid; grid-template-columns: minmax(5.5rem, auto) 1fr; gap: 0.35rem 0.55rem;
      font-size: 0.82rem;
    }
    .recent-history-date { color: #64748b; }
    .recent-history-title { font-weight: 600; color: #1e293b; }
    .doc-status-grid { display: flex; flex-direction: column; gap: 0.3rem; }
    .doc-status-row {
      display: grid; grid-template-columns: 1.5rem 1fr auto; gap: 0.35rem; align-items: center;
      font-size: 0.84rem;
    }
    .doc-status-value { color: #64748b; font-weight: 600; }
    .qnap-status-summary { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; }
    .qnap-path-hint { font-size: 0.72rem; color: #94a3b8; margin: 0.35rem 0 0; word-break: break-all; }
    .doc-tab-status { font-size: 0.84rem; font-weight: 700; margin: 0 0 0.35rem; color: #475569; }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main" id="detail-root">
    <p class="section-hint">読み込み中…</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/project-mgmt-detail-v1.js"></script>
</body>
</html>
