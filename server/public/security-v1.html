<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY Security" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2003" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>TiSLY Security</title>
  <link rel="stylesheet" href="/css/features/security/security-floor-v1.css?v=2471" />
</head>
<body class="sf-body sf-soc" data-hqs-skip="1">
  <header class="sf-soc-header">
    <a class="sf-back" href="/app">← 戻る</a>
    <div class="sf-soc-brand">
      <span class="sf-crystal" aria-hidden="true"></span>
      <div>
        <p class="sf-brand-name">TiSLY</p>
        <h1 class="sf-title">TiSLY Security</h1>
      </div>
    </div>
    <div class="sf-soc-meta">
      <select id="sf-site-select" class="sf-select sf-select-inline" aria-label="物件選択"></select>
      <span class="sf-online-pill" id="sf-online">● オンライン</span>
      <time id="sf-clock">—</time>
      <span class="sf-bell" aria-label="通知">🔔<b id="sf-bell-count">0</b></span>
      <span class="sf-user">株式会社デモカンパニー 管理者</span>
    </div>
  </header>

  <nav class="sf-mobile-tabs" aria-label="画面切替">
    <button type="button" class="is-on" data-pane="map">3Dマップ</button>
    <button type="button" data-pane="alert">警報</button>
    <button type="button" data-pane="log">ログ</button>
  </nav>

  <div class="sf-soc-shell">
    <section class="sf-soc-hero" data-pane="map">
      <div class="sf-status sf-status-hero" id="sf-status-hero">
        <span class="sf-status-emoji" id="sf-status-emoji">🟢</span>
        <p class="sf-status-label" id="sf-status-label">正常です</p>
        <span hidden>
          <span id="sf-sum-total">0</span>
          <strong id="sf-sum-alert">0</strong>
        </span>
      </div>
      <div class="sf-map-wrap sf-iso-wrap is-lights-on" id="sf-map-wrap">
        <div class="sf-iso-scene">
          <div class="sf-iso-orbit" id="sf-iso-orbit" data-focus="2f">
            <article class="sf-iso-layer is-focus" data-layer="2f" style="--drum-i:0">
              <p class="sf-iso-caption">2F</p>
              <svg class="sf-map sf-iso-svg" viewBox="0 0 100 100" role="img" aria-label="2F">
                <rect class="sf-iso-slab" x="1" y="1" width="98" height="98" rx="3"></rect>
                <rect class="sf-room" data-room-id="my-2f-master" x="6" y="10" width="42" height="48" rx="2"></rect>
                <text class="sf-room-label" x="27" y="34" text-anchor="middle">主寝室</text>
                <rect class="sf-room" data-room-id="my-2f-child" x="52" y="10" width="42" height="48" rx="2"></rect>
                <text class="sf-room-label" x="73" y="34" text-anchor="middle">子供部屋</text>
                <g class="sf-pin is-sens" data-sensor-id="my-mmwave-2f" transform="translate(24 32)">
                  <circle class="sf-pin-pulse" r="9"></circle>
                  <circle class="sf-pin-bg" r="5.6"></circle>
                  <text class="sf-pin-icon" y="0.6">📡</text>
                </g>
              </svg>
            </article>
            <article class="sf-iso-layer" data-layer="1f" style="--drum-i:1">
              <p class="sf-iso-caption">1F</p>
              <svg class="sf-map sf-iso-svg" viewBox="0 0 100 100" role="img" aria-label="1F">
                <rect class="sf-iso-slab" x="1" y="1" width="98" height="98" rx="3"></rect>
                <rect class="sf-room" data-room-id="my-1f-entry" x="4" y="58" width="24" height="38" rx="2"></rect>
                <text class="sf-room-label" x="16" y="77" text-anchor="middle">玄関ホール</text>
                <rect class="sf-room" data-room-id="my-1f-living" x="30" y="8" width="44" height="54" rx="2"></rect>
                <text class="sf-room-label" x="52" y="35" text-anchor="middle">リビング</text>
                <rect class="sf-room" data-room-id="my-1f-kitchen" x="76" y="8" width="20" height="40" rx="2"></rect>
                <text class="sf-room-label" x="86" y="28" text-anchor="middle">キッチン</text>
                <circle class="sf-light" cx="22" cy="22" r="2.2"></circle>
                <circle class="sf-light" cx="52" cy="28" r="2.2"></circle>
                <g class="sf-pin is-sens" data-sensor-id="my-door-front" data-camera="my-cam-entry" transform="translate(16 88)">
                  <circle class="sf-pin-pulse" r="9"></circle>
                  <circle class="sf-pin-bg" r="5.6"></circle>
                  <text class="sf-pin-icon" y="0.6">🚪</text>
                </g>
                <g class="sf-pin is-cam" data-sensor-id="my-cam-entry" data-camera="my-cam-entry" transform="translate(10 62)">
                  <circle class="sf-pin-pulse" r="9"></circle>
                  <circle class="sf-pin-bg" r="5.6"></circle>
                  <text class="sf-pin-icon" y="0.6">📷</text>
                </g>
              </svg>
            </article>
            <article class="sf-iso-layer" data-layer="outdoor" style="--drum-i:2">
              <p class="sf-iso-caption">外周・敷地</p>
              <svg class="sf-map sf-iso-svg" viewBox="0 0 100 100" role="img" aria-label="外周・敷地">
                <rect class="sf-iso-slab" x="1" y="1" width="98" height="98" rx="3"></rect>
                <rect class="sf-room" data-room-id="my-out-park" x="6" y="16" width="50" height="68" rx="2"></rect>
                <text class="sf-room-label" x="31" y="50" text-anchor="middle">ガレージ</text>
                <rect class="sf-room" data-room-id="my-out-garden" x="60" y="16" width="34" height="68" rx="2"></rect>
                <text class="sf-room-label" x="77" y="50" text-anchor="middle">庭・外周</text>
                <rect class="sf-car" x="14" y="38" width="16" height="9" rx="1.6"></rect>
                <g class="sf-pin is-cam" data-sensor-id="my-cam-park" data-camera="my-cam-park" transform="translate(30 50)">
                  <circle class="sf-pin-pulse" r="9"></circle>
                  <circle class="sf-pin-bg" r="5.6"></circle>
                  <text class="sf-pin-icon" y="0.6">📷</text>
                </g>
              </svg>
            </article>
          </div>
        </div>
      </div>
      <p class="sf-orbit-hint">上下スワイプでドラム回転 · 2F → 1F → 外周</p>
    </section>

    <section class="sf-soc-tools">
      <p class="sf-card-label">フロア切替</p>
      <div class="sf-tabs sf-layer-tabs" id="sf-floor-tabs">
        <button type="button" class="sf-tab is-on" data-floor="2f">2F</button>
        <button type="button" class="sf-tab" data-floor="1f">1F</button>
        <button type="button" class="sf-tab" data-floor="outdoor">外周</button>
      </div>
      <div class="sf-kpi-row" id="sf-kpi"></div>
    </section>

    <section class="sf-soc-mid" data-pane="alert">
      <section class="sf-card sf-alarm-panel" id="sf-alarm-panel">
        <p class="sf-card-label">アラーム発報 <span id="sf-alarm-count">0件発生中</span></p>
        <ul class="sf-alarm-list" id="sf-alarm-list"></ul>
        <dl class="sf-detail" id="sf-alarm-detail"></dl>
        <button type="button" class="sf-ack" id="sf-ack">アラーム対応完了</button>
      </section>
      <section class="sf-card">
        <p class="sf-card-label" id="sf-cam-title">ライブカメラ</p>
        <div class="sf-live-feed" id="sf-live-feed">
          <span class="sf-live-badge">LIVE</span>
          <div class="sf-scan"></div>
        </div>
        <div class="sf-cam-thumbs" id="sf-cam-thumbs"></div>
        <div class="sf-cam-actions">
          <button type="button" class="sf-ghost" id="sf-cam-expand">ライブ映像を拡大</button>
          <button type="button" class="sf-ghost" id="sf-cam-next">別カメラを表示</button>
          <button type="button" class="sf-ghost" id="sf-cam-play">録画再生</button>
        </div>
      </section>
    </section>

    <section class="sf-card sf-quick-card">
      <p class="sf-card-label">クイック操作</p>
      <div class="sf-quick">
        <div class="sf-modes" id="sf-modes">
          <button type="button" class="sf-mode" data-mode="home">🛡️ 在宅警備</button>
          <button type="button" class="sf-mode is-on" data-mode="away">🛡️ 外出警戒</button>
          <button type="button" class="sf-mode" data-mode="disarmed">🛡️ 警戒解除</button>
        </div>
        <button type="button" id="sf-light-on">💡 照明を一括ON</button>
        <button type="button" id="sf-light-off">💡 照明を一括OFF</button>
        <button type="button" class="sf-demo-btn" id="sf-demo-alert">🔔 通知テスト</button>
        <button type="button" id="sf-export">📄 レポート出力</button>
      </div>
      <details class="sf-opts">
        <summary>表示オプション・物件情報</summary>
        <div class="sf-opts-grid">
          <label class="sf-tog"><input type="checkbox" id="sf-opt-cam" checked /> カメラ</label>
          <label class="sf-tog"><input type="checkbox" id="sf-opt-sens" checked /> センサー</label>
          <label class="sf-tog"><input type="checkbox" id="sf-opt-zone" checked /> ゾーン</label>
          <label class="sf-tog"><input type="checkbox" id="sf-opt-label" checked /> ラベル</label>
        </div>
        <div class="sf-property" id="sf-property">—</div>
        <p id="sf-weather">—</p>
        <p id="sf-plan">—</p>
      </details>
    </section>

    <section class="sf-soc-bottom" data-pane="log">
      <div class="sf-log-head">
        <p class="sf-card-label">アラームログ（リアルタイム）</p>
        <select id="sf-log-kind" class="sf-mini" aria-label="種別">
          <option value="">種別すべて</option>
          <option value="侵入検知">侵入検知</option>
          <option value="開放検知">開放検知</option>
          <option value="人感検知">人感検知</option>
          <option value="ガス漏れ">ガス漏れ</option>
        </select>
        <select id="sf-log-floor" class="sf-mini" aria-label="フロア">
          <option value="">フロアすべて</option>
        </select>
        <input id="sf-log-q" class="sf-mini" placeholder="キーワード" />
      </div>
      <div class="sf-log-table-wrap">
        <table class="sf-log-table">
          <thead>
            <tr>
              <th>時刻</th><th>フロア</th><th>場所</th>
              <th>種別</th><th>デバイス</th><th>ステータス</th><th>対応者</th>
            </tr>
          </thead>
          <tbody id="sf-log-body"></tbody>
        </table>
      </div>
      <ul class="sf-legend" id="sf-notes"></ul>
    </section>
  </div>

  <dialog class="sf-live-dialog" id="sf-live-dialog">
    <form method="dialog">
      <div class="sf-live-feed is-xl" id="sf-live-xl">
        <span class="sf-live-badge">LIVE</span>
        <div class="sf-scan"></div>
      </div>
      <p id="sf-play-note" hidden>録画再生（デモ）— 直近イベントをモック再生します</p>
      <button type="submit" class="sf-ghost">閉じる</button>
    </form>
  </dialog>

  <script src="/js/features/security/security-floor-light-v1.js?v=2471"></script>
  <script type="module" src="/js/features/security/security-floor-operator-v1.js?v=2471"></script>
</body>
</html>
