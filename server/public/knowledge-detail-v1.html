<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — ナレッジ詳細</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-neon-dark-v1.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/knowledge-field-ux-v2.css" />
  <link rel="stylesheet" href="/css/knowledge-field-ux-v3.css" />
  <link rel="stylesheet" href="/css/knowledge-field-ux-v4.css" />
  <link rel="stylesheet" href="/css/knowledge-field-ux-v5.css" />
  <style>
    .detail-title { margin: 0 0 0.35rem; font-size: 1.2rem; line-height: 1.4; }
    .detail-meta { font-size: 0.85rem; color: #64748b; margin: 0.2rem 0 0.65rem; }
    .detail-section { margin: 0.75rem 0 0; }
    .detail-section h2 {
      font-size: 0.88rem; color: #475569; margin: 0 0 0.35rem;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 0.25rem;
    }
    .detail-section p, .detail-section li { font-size: 0.95rem; line-height: 1.55; margin: 0.25rem 0; }
    .detail-section ul { margin: 0.25rem 0; padding-left: 1.2rem; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag-chip {
      font-size: 0.78rem; background: #f1f5f9; color: #475569;
      border-radius: 999px; padding: 0.15rem 0.5rem;
    }
    .flag-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0; }
    .flag-badge {
      font-size: 0.8rem; border-radius: 8px; padding: 0.2rem 0.5rem;
      background: #dbeafe; color: #1d4ed8; font-weight: 600;
    }
    .detail-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.75rem;
    }
    .detail-actions a, .detail-actions button {
      min-height: 3rem; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; font-size: 0.92rem; font-weight: 600;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #1e293b; text-decoration: none;
    }
    .detail-actions .primary { background: #334155; color: #fff; border-color: #334155; grid-column: 1 / -1; }
    .related-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .related-item {
      display: block; padding: 0.55rem 0.65rem; border: 1px solid #e2e8f0;
      border-radius: 10px; text-decoration: none; color: #1e293b; font-size: 0.92rem;
    }
    .related-item small { display: block; color: #64748b; font-size: 0.78rem; margin-top: 0.1rem; }
    .empty-hint { color: #94a3b8; font-size: 0.88rem; }
    body.has-practical-nav .app-main { padding-bottom: 5.5rem; }
    body.has-detail-fixed-bar.has-practical-nav .app-main { padding-bottom: 10rem; }
  </style>
</head>
<body class="tisly-friendly knowledge-field-v4 has-detail-fixed-bar tisly-neon-dark">
  <main class="app-main" id="detail-root">
    <p class="status-muted">読み込み中…</p>
  </main>
  <div id="detail-fixed-bar" class="detail-fixed-bar" hidden>
    <a href="/knowledge-field-v1" id="detail-back-btn">← 戻る</a>
    <button type="button" id="detail-fav-btn">☆ お気に入り</button>
    <button type="button" class="primary-used" id="detail-used-btn">✓ 使った</button>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/knowledge-detail-v1.js"></script>
</body>
</html>
