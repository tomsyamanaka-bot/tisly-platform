<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1E3A8A" />

<body class="cv-body">
  <header class="cv-header">

    <section class="cv-stats" id="cv-stats">

      <input

        id="cv-search"
        class="cv-search"
        placeholder="顧客名 · コード · 物件名で検索"
        autocomplete="off"
      />

    <div id="cv-list" class="cv-list">
      <p class="cv-loading">読み込み中…</p>

  <script type="module" src="/js/features/home/customer-view-v1.js?v=2460"></script>
