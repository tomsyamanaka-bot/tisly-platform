<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="color-scheme" content="light" />
  <title>顧客を見る — TiSLY HOME 社内管理</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/features/home/customer-view-v1.css?v=2461" />
</head>
<body class="cv-body">
  <header class="cv-header">
    <a class="cv-back" href="/app">← 業務アプリ</a>
    <h1>顧客を見る</h1>
    <p class="cv-sub">TiSLY HOME 契約・導入済み物件のみ（社内専用）</p>
  </header>

  <main class="cv-main">
    <section class="cv-stats" id="cv-stats">
      <p class="cv-loading">読み込み中…</p>
    </section>

    <section class="cv-toolbar">
      <input
        type="search"
        id="cv-search"
        class="cv-search"
        placeholder="物件名 · 住所 · 連絡先で検索"
        autocomplete="off"
      />
      <button type="button" id="cv-add-btn" class="cv-add-btn">＋ 新規登録</button>
    </section>

    <div id="cv-list" class="cv-list">
      <p class="cv-loading">読み込み中…</p>
    </div>
  </main>

  <div id="cv-modal" class="cv-modal" hidden>
    <div class="cv-modal-panel" role="dialog" aria-labelledby="cv-modal-title">
      <div class="cv-modal-head">
        <h2 id="cv-modal-title">新規物件を登録</h2>
        <button type="button" class="cv-modal-close" data-modal-close aria-label="閉じる">×</button>
      </div>
      <form id="cv-form" class="cv-form">
        <label class="cv-field">
          <span>物件名 <em>*</em></span>
          <input name="displayName" required maxlength="80" placeholder="例: 守谷市 佐藤邸" />
        </label>
        <label class="cv-field">
          <span>住所</span>
          <input name="addressLabel" maxlength="120" placeholder="例: 茨城県守谷市..." />
        </label>
        <label class="cv-field">
          <span>プラン</span>
          <select name="planCode">
            <option value="home_basic">ベーシック（1,980円/月）</option>
            <option value="home_standard">スタンダード（3,800円/月）</option>
          </select>
        </label>
        <label class="cv-field">
          <span>担当者名</span>
          <input name="contactName" maxlength="60" placeholder="例: 佐藤 太郎" />
        </label>
        <label class="cv-field">
          <span>電話番号</span>
          <input name="contactPhone" type="tel" maxlength="20" placeholder="例: 090-1234-5678" />
        </label>
        <label class="cv-field">
          <span>メール</span>
          <input name="contactEmail" type="email" maxlength="80" placeholder="例: example@mail.jp" />
        </label>
        <div class="cv-form-actions">
          <button type="button" class="cv-btn-secondary" data-modal-close>キャンセル</button>
          <button type="submit" class="cv-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/features/home/customer-view-v1.js?v=2461"></script>
</body>
</html>
