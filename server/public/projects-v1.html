<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6b8cce" />
  <title>TiSLY — 案件一覧</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    .doc-action-grid { display: grid; gap: 0.4rem; }
    .doc-action-grid .btn-doc-action {
      display: block; width: 100%; min-height: 48px; padding: 0.75rem 1rem;
      font-size: 0.95rem; font-weight: 600; text-align: center; text-decoration: none;
      border-radius: var(--tisly-radius); border: 2px solid var(--tisly-blue);
      background: var(--tisly-surface); color: var(--tisly-blue);
    }
    .project-card { position: relative; cursor: pointer; }
    .project-card .list-card-actions { position: absolute; top: 0.65rem; right: 0.65rem; }
    .pdf-row {
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.65rem 0.75rem; margin-bottom: 0.55rem;
      background: #fff;
    }
    .pdf-row-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .pdf-row-head strong { font-size: 0.95rem; }
    .pdf-meta { font-size: 0.78rem; color: #64748b; line-height: 1.45; }
    .pdf-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .pdf-actions button, .pdf-actions a {
      min-height: 40px; padding: 0.35rem 0.65rem; font-size: 0.82rem; font-weight: 600;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155;
      text-decoration: none; cursor: pointer;
    }
    .pdf-actions .btn-primary-action { background: var(--tisly-blue); color: #fff; border-color: var(--tisly-blue); }
    .pdf-actions .btn-danger { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .pdf-storage-status {
      font-size: 0.8rem; line-height: 1.5; margin-top: 0.35rem; padding: 0.4rem 0.5rem;
      background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;
    }
    .pdf-local-ok { color: #15803d; font-weight: 600; }
    .pdf-qnap-label { font-weight: 600; }
    .pdf-qnap-success { color: #15803d; }
    .pdf-qnap-failed { color: #b45309; }
    .pdf-qnap-pending, .pdf-qnap-uploading { color: #0369a1; }
    .pdf-qnap-none { color: #94a3b8; }
    .pdf-qnap-error { margin-top: 0.25rem; font-size: 0.75rem; color: #b91c1c; word-break: break-all; }
    .pdf-empty { font-size: 0.85rem; color: #94a3b8; padding: 0.35rem 0; }
    .doc-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.55rem; }
    .doc-tab {
      flex: 1; min-width: 72px; min-height: 40px; padding: 0.35rem 0.5rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 0.78rem; font-weight: 700; color: #475569; cursor: pointer;
    }
    .doc-tab.active { background: var(--tisly-blue); color: #fff; border-color: var(--tisly-blue); }
    .doc-tab-empty { opacity: 0.72; }
    .doc-tab-panel.hidden { display: none; }
    .spec-create-row { margin-bottom: 0.55rem; }
    .spec-create-row .btn-doc-action {
      display: block; width: 100%; min-height: 44px; border-radius: 10px;
      border: 2px solid var(--tisly-blue); background: #eff6ff; color: var(--tisly-blue);
      font-weight: 700; cursor: pointer;
    }
    .deleted-card { border-left: 3px solid #f87171; }
    .list-tabs { display: flex; gap: 0.35rem; margin-bottom: 0.75rem; }
    .list-tabs button {
      flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #cbd5e1;
      background: #fff; font-weight: 600; font-size: 0.88rem;
    }
    .list-tabs button.active { background: var(--tisly-blue); color: #fff; border-color: var(--tisly-blue); }
    .delete-dialog-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .delete-dialog-overlay.hidden { display: none; }
    .delete-dialog {
      background: #fff; border-radius: 14px; padding: 1.1rem; max-width: 360px; width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }
    .delete-dialog h4 { margin: 0 0 0.65rem; font-size: 1rem; }
    .delete-dialog .stats { font-size: 0.9rem; line-height: 1.6; margin-bottom: 0.85rem; }
    .delete-dialog .dialog-actions { display: flex; gap: 0.5rem; }
    .delete-dialog .dialog-actions button { flex: 1; min-height: 44px; border-radius: 10px; font-weight: 700; }
    .delete-dialog .btn-cancel { border: 1px solid #cbd5e1; background: #f8fafc; }
    .delete-dialog .btn-confirm-delete { border: none; background: #dc2626; color: #fff; }
    .detail-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.75rem 0; }
    .detail-tab {
      flex: 1; min-width: 72px; min-height: 44px; padding: 0.35rem 0.5rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 0.78rem; font-weight: 700; color: #475569; cursor: pointer;
    }
    .detail-tab.active { background: var(--tisly-blue); color: #fff; border-color: var(--tisly-blue); }
    .detail-tab-panel.hidden { display: none; }
    .field-check-item { border-bottom: 1px solid #e8ecf0; padding: 0.65rem 0; }
    .field-check-item:last-child { border-bottom: none; }
    .field-check-row { display: flex; align-items: center; gap: 0.65rem; cursor: pointer; }
    .field-check-row input[type=checkbox] { width: 1.4rem; height: 1.4rem; flex-shrink: 0; accent-color: #059669; }
    .field-check-label { flex: 1; font-size: 1rem; font-weight: 600; }
    .field-check-cat { font-size: 0.72rem; color: #64748b; background: #f1f5f9; padding: 0.15rem 0.45rem; border-radius: 999px; }
    .field-check-item.checked .field-check-label { color: #64748b; text-decoration: line-through; }
    .field-check-photo-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0 0 2rem; }
    .field-check-thumb img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
    .btn-photo-attach {
      display: inline-flex; align-items: center; min-height: 36px; padding: 0.25rem 0.65rem;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin: 0.35rem 0; }
    .progress-fill { height: 100%; background: #059669; transition: width 0.2s; }
    .checklist-warn { color: #b45309; font-size: 0.85rem; }
    .checklist-ok { color: #15803d; font-size: 0.85rem; }
  </style>
</head>
<body class="tisly-friendly field-ops-touch">
  <main class="app-main">
    <div id="view-list">
      <div id="today-departure-card" class="hidden"></div>
      <div id="dashboard-grid" class="dashboard-grid"></div>
      <a href="/search-v1" class="btn-sub" style="width:100%;margin-bottom:0.75rem;text-align:center;">🔍 検索</a>
      <div class="list-tabs">
        <button type="button" id="tab-active" class="active">📂 案件一覧</button>
        <button type="button" id="tab-deleted">🗑 削除済</button>
      </div>
      <div id="project-list" class="empty-state">読み込み中…</div>
      <div id="deleted-list" class="hidden empty-state"></div>
    </div>
    <div id="view-detail" class="hidden">
      <div id="detail-header" class="friendly-card"></div>
      <div class="detail-tabs" role="tablist">
        <button type="button" class="detail-tab active" data-detail-tab="overview">概要</button>
        <button type="button" class="detail-tab" data-detail-tab="checklist">チェックリスト</button>
        <button type="button" class="detail-tab" data-detail-tab="documents">書類</button>
        <button type="button" class="detail-tab" data-detail-tab="timeline">履歴</button>
      </div>
      <div id="detail-panel-overview" class="detail-tab-panel">
        <p class="section-label">ステータス</p>
        <div id="detail-pipeline" class="pipeline-bar friendly-card"></div>
        <p class="section-label">現場作業</p>
        <div id="detail-work-session"></div>
      </div>
      <div id="detail-panel-checklist" class="detail-tab-panel hidden">
        <div id="detail-checklist" class="friendly-card"></div>
        <a href="#" id="link-full-checklist" class="btn-sub" style="display:block;text-align:center;margin-top:0.5rem;">チェックリスト画面を開く</a>
      </div>
      <div id="detail-panel-documents" class="detail-tab-panel hidden">
        <p class="section-label">書類</p>
        <div id="detail-documents" class="friendly-card hidden"></div>
      </div>
      <div id="detail-panel-timeline" class="detail-tab-panel hidden">
        <p class="section-label">時系列</p>
        <div id="detail-timeline" class="friendly-card"></div>
      </div>
      <button type="button" class="btn-sub" id="btn-back-list">一覧に戻る</button>
    </div>
  </main>
  <div id="delete-dialog-overlay" class="delete-dialog-overlay hidden" role="dialog" aria-modal="true">
    <div class="delete-dialog">
      <h4>案件を削除</h4>
      <div id="delete-dialog-body" class="stats"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-cancel" id="delete-dialog-cancel">キャンセル</button>
        <button type="button" class="btn-confirm-delete" id="delete-dialog-confirm">削除する</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/projects-v1.js"></script>
</body>
</html>
