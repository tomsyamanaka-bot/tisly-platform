<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5cb87a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY現調" />
  <link rel="manifest" href="/manifest-survey-v1.webmanifest" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2001" />
  <title>TiSLY — 現調</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <p class="section-hint" id="page-hint">お客様の現場を見に行く記録を残します</p>

    <div id="view-list">
      <button type="button" class="btn-main" id="btn-new">＋ 新しい現調をはじめる</button>
      <p class="section-label">📋 案件一覧</p>
      <div id="project-list" class="empty-state">読み込み中…</div>
    </div>

    <div id="view-form" class="hidden">
      <div class="friendly-card">
        <h2>新しい現調</h2>
        <p>まずはお客様のお名前だけ入れればOKです</p>
      </div>
      <form id="project-form">
        <label class="friendly-label">お客様のお名前 <input name="customerName" required placeholder="山田様邸" /></label>
        <label class="friendly-label">住所 <input name="address" placeholder="あとからでも入れられます" /></label>
        <label class="friendly-label">現調日 <input name="surveyDate" type="date" /></label>
        <label class="friendly-label">メモ <textarea name="notes" rows="3" placeholder="気づいたことをメモ"></textarea></label>
        <button type="submit" class="btn-main" id="btn-save">保存する</button>
      </form>
      <div id="form-error" class="error-friendly hidden"></div>
    </div>

    <div id="view-edit" class="hidden">
      <form id="edit-form">
        <label class="friendly-label">お客様のお名前 <input name="customerName" required /></label>
        <label class="friendly-label">住所 <input name="address" /></label>
        <label class="friendly-label">電話番号 <input name="phone" type="tel" inputmode="tel" /></label>
        <label class="friendly-label">メール <input name="email" type="email" inputmode="email" /></label>
        <label class="friendly-label">現調日 <input name="surveyDate" type="date" /></label>
        <label class="friendly-label">担当者 <input name="assignee" /></label>
        <label class="friendly-label">メモ <textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn-main">変更を保存</button>
      </form>
      <div id="edit-error" class="error-friendly hidden"></div>
    </div>

    <div id="view-detail" class="hidden">
      <div class="friendly-card">
        <span id="detail-status" class="status-badge green">現場調査中</span>
        <h2 id="detail-name">—</h2>
        <p id="detail-meta"></p>
        <p id="detail-notes" class="hidden"></p>
        <button type="button" class="btn-sub" id="btn-edit" style="margin-top:0.5rem;">お客様情報を直す</button>
      </div>

      <p class="section-label">📷 写真</p>
      <p class="section-hint">現場の様子を写真で残します</p>
      <div class="friendly-card">
        <div id="photo-list"></div>
        <label class="friendly-label">写真の説明 <textarea id="photo-comment" rows="2" placeholder="どこを撮ったか"></textarea></label>
        <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" />
        <button type="button" class="btn-sub" id="btn-camera">📷 写真を撮る</button>
        <button type="button" class="btn-sub" id="btn-photo-memo">📝 文字だけメモ</button>
      </div>

      <p class="section-label">🔧 使う部材</p>
      <p class="section-hint">カメラや配線など、使うものを選びます</p>
      <div class="friendly-card">
        <div id="material-list"></div>
        <label class="friendly-label">種類
          <select id="material-category"></select>
        </label>
        <label class="friendly-label">品名 <input id="material-label" placeholder="例: 屋外カメラ" /></label>
        <label class="friendly-label">数量 <input id="material-qty" type="number" min="1" value="1" inputmode="numeric" /></label>
        <label class="friendly-label">補足 <input id="material-memo" placeholder="設置場所など" /></label>
        <button type="button" class="btn-sub" id="btn-add-material">部材を追加</button>
      </div>

      <button type="button" class="btn-main blue" id="btn-handoff">見積へ送る</button>
      <p id="handoff-info" class="section-hint hidden"></p>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/survey-v1.js"></script>
</body>
</html>
