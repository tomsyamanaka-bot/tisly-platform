<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5cb87a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TiSLY現調" />
  <link rel="manifest" href="/manifest-survey-v1.webmanifest" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2001" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2001" />
  <title>TiSLY — 現調</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <style>
    .photo-preview-btn {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .photo-preview-btn img { pointer-events: none; }
    body.photo-preview-open { overflow: hidden; }
    .photo-preview-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-preview-modal.hidden { display: none; }
    .photo-preview-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
    }
    .photo-preview-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-height: 100dvh;
      padding:
        calc(env(safe-area-inset-top, 0px) + 0.5rem)
        0.75rem
        calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
      box-sizing: border-box;
    }
    .photo-preview-close-x {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 0.35rem);
      right: 0.75rem;
      z-index: 2;
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
    }
    .photo-preview-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2.5rem 0 0.5rem;
    }
    .photo-preview-stage img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
    }
    .photo-preview-meta {
      flex-shrink: 0;
      text-align: center;
      padding: 0.5rem 0.25rem;
      color: #f8fafc;
    }
    .photo-preview-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      word-break: break-word;
    }
    .photo-preview-date {
      margin: 0.35rem 0 0;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .photo-preview-actions {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.4rem;
      align-items: center;
      padding-top: 0.35rem;
    }
    .photo-preview-nav-btn {
      min-height: 44px;
      border: 1px solid #64748b;
      border-radius: 8px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .photo-preview-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .photo-preview-close-btn {
      min-height: 44px;
      padding: 0 1rem;
      border: none;
      border-radius: 8px;
      background: #5cb87a;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    body.photo-editor-open { overflow: hidden; }
    .photo-editor {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0) 0.5rem env(safe-area-inset-bottom, 0);
    }
    .photo-editor.hidden { display: none; }
    .photo-editor-toolbar {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      padding: 0.5rem 0;
    }
    .photo-editor-tool {
      flex: 1;
      min-width: 4.5rem;
      min-height: 44px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .photo-editor-tool.active {
      border-color: #5cb87a;
      background: #14532d;
    }
    .photo-editor-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .photo-editor-stage canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
    }
    #photo-editor-draw {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      touch-action: none;
    }
    #photo-editor-base {
      display: none;
    }
    .photo-editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.4rem;
      padding: 0.5rem 0 0.75rem;
    }
    .photo-editor-actions button {
      min-height: 48px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    #photo-editor-save {
      background: #5cb87a;
      color: #fff;
      border: none;
    }
    #photo-editor-undo,     #photo-editor-cancel {
      background: #fff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .photo-title-label {
      display: block;
      padding: 0.35rem 0.4rem 0.5rem;
    }
    .photo-title-label-text {
      display: block;
      font-size: 0.75rem;
      color: var(--tisly-muted);
      margin-bottom: 0.25rem;
    }
    .photo-card-top {
      display: flex;
      justify-content: flex-end;
      padding: 0.25rem 0.35rem 0;
    }
    .photo-delete-btn {
      min-height: 32px;
      padding: 0.15rem 0.45rem;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fff5f5;
      color: #b91c1c;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .photo-reorder-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem;
      padding: 0.35rem 0.4rem 0.45rem;
    }
    .photo-reorder-btn {
      min-height: 36px;
      border: 1px solid var(--tisly-border);
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .photo-reorder-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="tisly-friendly">
  <main class="app-main">
    <p class="section-hint" id="page-hint">お客様の現場を見に行く記録を残します</p>

    <div id="view-list">
      <button type="button" class="btn-hero" id="btn-new">＋ 新しい現調を作る</button>
      <p class="section-label">📋 これまでの現調</p>
      <div id="project-list" class="empty-state">読み込み中…</div>
    </div>

    <div id="view-form" class="hidden">
      <div class="friendly-card">
        <h2>新しい現調</h2>
        <p>依頼主と現場を分けて入力できます</p>
      </div>
      <form id="project-form">
        <p class="section-label" style="margin-top:0.5rem;">👤 依頼主（お客様）</p>
        <label class="friendly-label">依頼主 <input name="customerName" required placeholder="株式会社〇〇 / 山田様" /></label>
        <label class="friendly-label">住所 <input name="customerAddress" placeholder="依頼主の住所" /></label>
        <label class="friendly-label">電話 <input name="phone" type="tel" inputmode="tel" placeholder="090-0000-0000" /></label>
        <label class="friendly-label">メール <input name="email" type="email" inputmode="email" placeholder="example@mail.jp" /></label>

        <p class="section-label">🏗 現場</p>
        <label class="friendly-label">現場名 <input name="siteName" placeholder="〇〇ビル 3F" /></label>
        <label class="friendly-label">工事場所 <input name="address" placeholder="市区町村・番地（現場の住所）" /></label>
        <label class="friendly-label">担当者 <input name="assignee" placeholder="現場ご担当者名" /></label>
        <label class="friendly-label">現調日 <input name="surveyDate" type="date" /></label>
        <label class="friendly-label">現調メモ <textarea name="notes" rows="3" placeholder="気づいたこと、お客様のご要望など"></textarea></label>
        <button type="submit" class="btn-main" id="btn-save">保存する</button>
      </form>
      <div id="form-error" class="error-friendly hidden"></div>
    </div>

    <div id="view-edit" class="hidden">
      <form id="edit-form">
        <p class="section-label" style="margin-top:0;">👤 依頼主</p>
        <label class="friendly-label">依頼主 <input name="customerName" required /></label>
        <label class="friendly-label">住所 <input name="customerAddress" /></label>
        <label class="friendly-label">電話 <input name="phone" type="tel" inputmode="tel" /></label>
        <label class="friendly-label">メール <input name="email" type="email" inputmode="email" /></label>
        <p class="section-label">🏗 現場</p>
        <label class="friendly-label">現場名 <input name="siteName" /></label>
        <label class="friendly-label">工事場所 <input name="address" /></label>
        <label class="friendly-label">担当者 <input name="assignee" /></label>
        <label class="friendly-label">現調日 <input name="surveyDate" type="date" /></label>
        <label class="friendly-label">現調メモ <textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn-main">変更を保存</button>
      </form>
      <div id="edit-error" class="error-friendly hidden"></div>
    </div>

    <div id="view-detail" class="hidden">
      <div class="friendly-card">
        <span id="detail-status" class="status-badge green">現場調査中</span>
        <h2 id="detail-name">—</h2>
        <p id="detail-meta"></p>
        <p id="detail-notes" class="hidden"></p>
        <button type="button" class="btn-sub" id="btn-edit" style="margin-top:0.5rem;">お客様・現場情報を直す</button>
      </div>

      <p class="section-label">📷 現場の写真</p>
      <p class="section-hint">カメラで撮るか、写真ライブラリから複数枚選べます</p>
      <div class="friendly-card">
        <div id="photo-list" class="photo-scroll-container"></div>
        <p id="photo-count" class="section-hint hidden"></p>
        <button type="button" class="btn-sub hidden" id="btn-load-more-photos">さらに写真を表示</button>
        <p class="section-hint">写真は仕様書・完了報告書に使えます。見積書と請求書には載せません。</p>
        <label class="friendly-label">文字だけメモ（任意） <textarea id="photo-comment" rows="2" placeholder="写真なしのメモ"></textarea></label>
        <input type="file" id="file-input-camera" accept="image/jpeg,image/png,image/heic,image/heif,image/*" capture="environment" style="display:none" />
        <input type="file" id="file-input-library" accept="image/jpeg,image/png,image/heic,image/heif,image/*" multiple style="display:none" />
        <div class="photo-action-row">
          <button type="button" class="btn-sub" id="btn-camera">📷 カメラで撮る</button>
          <button type="button" class="btn-sub" id="btn-library">🖼 写真を選ぶ</button>
        </div>
        <button type="button" class="btn-sub" id="btn-photo-memo">📝 文字だけメモ</button>
        <p id="photo-upload-progress" class="section-hint hidden"></p>
      </div>

      <p class="section-label">🔧 使う部材</p>
      <p class="section-hint">タップして選びます（複数選べます）</p>
      <div class="friendly-card">
        <div id="material-list"></div>
        <div id="material-picker" class="material-picker-grid" role="group" aria-label="部材の種類"></div>
        <label class="friendly-label">品名・型番（任意） <input id="material-label" placeholder="例：屋外カメラ 2台目" /></label>
        <label class="friendly-label">数量 <input id="material-qty" type="number" min="1" value="1" inputmode="numeric" /></label>
        <label class="friendly-label">設置場所など <input id="material-memo" placeholder="玄関・駐車場など" /></label>
        <button type="button" class="btn-sub" id="btn-add-material">選んだ部材を追加</button>
      </div>

      <div class="tisly-sticky-action">
        <button type="button" class="btn-main blue" id="btn-handoff">見積へ送る</button>
        <p id="handoff-info" class="section-hint hidden"></p>
      </div>
    </div>
  </main>

  <div id="photo-preview-modal" class="photo-preview-modal hidden" role="dialog" aria-modal="true" aria-labelledby="photo-preview-title" aria-hidden="true">
    <div class="photo-preview-backdrop" id="photo-preview-backdrop"></div>
    <div class="photo-preview-panel">
      <button type="button" class="photo-preview-close-x" id="photo-preview-close-x" aria-label="閉じる">×</button>
      <div class="photo-preview-stage" id="photo-preview-stage">
        <img id="photo-preview-img" src="" alt="" />
      </div>
      <div class="photo-preview-meta">
        <p id="photo-preview-title" class="photo-preview-title"></p>
        <p id="photo-preview-date" class="photo-preview-date"></p>
      </div>
      <div class="photo-preview-actions">
        <button type="button" class="photo-preview-nav-btn" id="photo-preview-prev">← 前へ</button>
        <button type="button" class="photo-preview-close-btn" id="photo-preview-close">閉じる</button>
        <button type="button" class="photo-preview-nav-btn" id="photo-preview-next">次へ →</button>
      </div>
    </div>
  </div>

  <div id="photo-editor" class="photo-editor hidden" aria-hidden="true">
    <div class="photo-editor-toolbar">
      <button type="button" class="photo-editor-tool active" data-tool="pen">手書き</button>
      <button type="button" class="photo-editor-tool" data-tool="arrow">矢印</button>
      <button type="button" class="photo-editor-tool" data-tool="circle">丸囲み</button>
      <button type="button" class="photo-editor-tool" data-tool="text">文字</button>
    </div>
    <div class="photo-editor-stage">
      <canvas id="photo-editor-base"></canvas>
      <canvas id="photo-editor-draw"></canvas>
    </div>
    <div class="photo-editor-actions">
      <button type="button" id="photo-editor-undo">戻す</button>
      <button type="button" id="photo-editor-cancel">キャンセル</button>
      <button type="button" id="photo-editor-save">保存</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/survey-v1.js"></script>
</body>
</html>
