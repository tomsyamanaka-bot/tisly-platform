<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8a54b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 日程詳細</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/field-ops-mobile.css" />
  <style>
    #day-title { cursor: pointer; }
    #day-title:active { opacity: 0.75; }
    .day-memo-line { margin: 0.35rem 0; font-size: 0.9rem; line-height: 1.45; }
    .day-memo-label { display: inline-block; min-width: 4.5rem; font-weight: 600; color: #64748b; font-size: 0.78rem; }
    .event-desc-snippet {
      display: inline-block;
      margin: 0.15rem 0 0;
      padding: 0;
      border: none;
      background: none;
      text-align: left;
      font-size: 0.82rem;
      line-height: 1.35;
      color: #475569;
      cursor: pointer;
    }
    .event-desc-snippet[aria-expanded="true"] { color: #0f172a; white-space: pre-wrap; display: block; }
    .integration-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 0.5rem; }
    .integration-badge { font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 999px; font-weight: 600; }
    .integration-badge.live { background: #dcfce7; color: #166534; }
    .integration-badge.mock { background: #fef3c7; color: #92400e; }
    .integration-badge.unset { background: #f1f5f9; color: #64748b; }
    .travel-blocks { display: flex; flex-direction: column; gap: 0.5rem; }
    .travel-block { padding: 0.5rem 0.65rem; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    .travel-block-label { font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem; }
    .travel-block-meta { font-size: 0.82rem; color: #475569; margin-bottom: 0.35rem; }
    .travel-maps-hint { color: #b45309; margin: 0 0 0.5rem; }
    .event-map-btn { margin-left: 0.35rem; }
    .btn-compact { font-size: 0.78rem !important; padding: 0.28rem 0.5rem !important; min-height: 0; line-height: 1.25; }
    .departure-prep-card {
      margin: 0.35rem 0;
      padding: 0.35rem 0.45rem;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
    }
    .departure-prep-summary {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.1rem 0;
      border: none;
      background: none;
      text-align: left;
      font-size: 0.78rem;
      line-height: 1.35;
      color: #78350f;
      cursor: pointer;
    }
    .departure-prep-compact-line { font-weight: 600; }
    .departure-prep-details { margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dashed #fcd34d; }
    .departure-prep-details-title { margin: 0 0 0.2rem !important; font-size: 0.82rem !important; }
    .departure-prep-detail-row { margin: 0.12rem 0; font-size: 0.8rem; }
    .departure-prep-actions { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.35rem; }
    .departure-prep-kit-always { margin-top: 0.25rem; }
    .departure-remind-badge { font-size: 0.72rem; padding: 0.05rem 0.35rem; border-radius: 999px; background: #dbeafe; color: #1d4ed8; }
    .departure-alert-card { margin: 0 0 0.5rem; padding: 0.5rem 0.6rem; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; }
    .departure-alert-title { margin: 0; font-weight: 700; font-size: 0.88rem; color: #92400e; }
    .departure-alert-body { margin: 0.2rem 0 0.35rem; font-size: 0.82rem; color: #78350f; }
    .schedule-intel-card-compact {
      border-left: 3px solid #e8a54b;
      margin-bottom: 0.4rem !important;
      padding: 0.4rem 0.55rem !important;
    }
    .event-cal-line { margin-top: 0.08rem; font-size: 0.68rem; line-height: 1.2; color: #94a3b8; }
    .schedule-intel-time { font-size: 0.75rem; color: #64748b; line-height: 1.3; }
    .schedule-intel-title {
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .schedule-intel-summary-line {
      font-size: 0.72rem;
      line-height: 1.35;
      color: #475569;
      margin: 0.15rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .schedule-intel-address-compact { font-size: 0.72rem; color: #64748b; margin: 0.1rem 0; }
    .schedule-intel-maps-compact { margin-top: 0.2rem; }
    .schedule-intel-maps-compact .btn-small { font-size: 0.72rem !important; padding: 0.22rem 0.45rem !important; }
    .schedule-day-summary-compact { margin-top: 0.5rem !important; padding: 0.5rem 0.6rem !important; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    .schedule-day-summary-label { margin: 0 0 0.35rem !important; font-size: 0.82rem !important; }
    .schedule-day-summary-body { font-size: 0.8rem; line-height: 1.45; }
    #day-events .section-label { margin-bottom: 0.35rem !important; font-size: 0.85rem; }
    #day-memo-summary { padding: 0.5rem 0.65rem !important; margin-bottom: 0.45rem !important; }
  </style>
</head>
<body class="tisly-friendly field-ops-touch">
  <main class="app-main">
    <div id="integration-badges"></div>
    <div id="departure-alert-mount" class="hidden" aria-live="polite"></div>
    <h2 id="day-title" class="schedule-week-label" title="タップしてメモを編集">—</h2>
    <div id="day-departure" class="hidden"></div>
    <div id="day-weather" class="schedule-weather-mini"></div>
    <div id="day-memo-summary" class="friendly-card" role="button" tabindex="0" aria-label="日付メモを編集"></div>
    <div id="day-events" class="friendly-card"></div>
    <div id="day-intelligence-summary"></div>
    <div id="day-travel" class="friendly-card hidden"></div>
    <div id="day-dispatch" class="friendly-card hidden"></div>
    <div id="day-work-sessions" class="hidden"></div>
    <a id="day-maps" class="btn-main" href="#" target="_blank" rel="noopener" style="display:none;margin-top:0.75rem;">📍 Googleマップ</a>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/schedule-day-v1.js"></script>
</body>
</html>
