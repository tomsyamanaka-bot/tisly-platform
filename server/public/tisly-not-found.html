<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>TiSLY — ページが見つかりません</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-neon-dark-v1.css" />
  <style>
    body.tisly-friendly { padding: 1.25rem; }
    .nf-card { max-width: 420px; margin: 2rem auto; }
    .nf-title { margin: 0 0 0.5rem; font-size: 1.15rem; color: #0f172a; }
    .nf-path { font-size: 0.85rem; color: #64748b; word-break: break-all; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  </style>
</head>
<body class="tisly-friendly tisly-neon-dark">
  <main class="friendly-card nf-card">
    <h1 class="nf-title">ページが見つかりません</h1>
    <p class="section-hint">お探しのURLは存在しないか、移動した可能性があります。</p>
    <p id="nf-path" class="nf-path"></p>
    <div class="nf-actions">
      <a class="btn-primary" href="/schedule-v1">日程調整</a>
      <a class="btn-sub" href="/google-calendar-settings-v1">Googleカレンダー連携</a>
      <a class="btn-sub" href="/survey-v1">現調</a>
    </div>
  </main>
  <script>
    document.getElementById("nf-path").textContent = location.pathname;
  </script>
</body>
</html>
