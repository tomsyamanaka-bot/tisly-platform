<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a7f37" />
  <title>TiSLY — 営業デモ（AI分析）</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .hero { background: linear-gradient(135deg, #1a7f37, #116329); color: #fff; padding: 2rem; border-radius: 12px; }
    .insight { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1.25rem; margin: 1rem 0; }
    .priority-critical { border-left: 4px solid #cf222e; }
    .priority-alarm { border-left: 4px solid #d29922; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>TiSLY AI 分析結果</h1>
    <p>通知 → 運用 → 自律復旧へ進化したプラットフォームのデモ</p>
  </div>
  <section class="insight" id="nl-insight">
    <h2>AI インサイト（自然言語）</h2>
    <p id="nl-text">読込中…</p>
  </section>
  <section class="insight">
    <h2>本日のハイライト</h2>
    <ul id="sales-bullets"></ul>
  </section>
  <section class="insight">
    <h2>差別化ポイント</h2>
    <ul>
      <li>AI リスクスコア（0–100）と優先度自動調整</li>
      <li>Recovery Engine — デバイス別自動復旧</li>
      <li>QNAP 連携 — イベント・カメラアーカイブ</li>
    </ul>
  </section>
  <p><a href="/analytics">詳細 Analytics 画面 →</a> · <a href="/operations">運用コンソール →</a></p>
  <script type="module">
    import { apiGet } from "./js/api.js";
    const data = await apiGet("/api/analytics/overview");
    document.getElementById("nl-text").textContent =
      data.naturalLanguage.today.paragraphs.join(" ");
    document.getElementById("sales-bullets").innerHTML = data.summary.today.bullets
      .map((b) => {
        const cls =
          b.priority === "critical"
            ? "priority-critical"
            : b.priority === "alarm"
              ? "priority-alarm"
              : "";
        return `<li class="${cls}">${b.text}</li>`;
      })
      .join("");
  </script>
</body>
</html>
