<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TiSLY — 見積マスター</title>
  <link rel="stylesheet" href="/css/tisly-friendly-ui.css" />
  <link rel="stylesheet" href="/css/tisly-practical-nav.css" />
  <link rel="stylesheet" href="/css/master-v1.css" />
</head>
<body class="tisly-friendly master-v1-touch">
  <header class="master-header">
    <h1>📋 見積マスター</h1>
    <div class="master-toolbar">
      <input type="search" id="search-input" placeholder="名前・型番・カテゴリ・タグ・メモで検索…" enterkeyhint="search" autocomplete="off" />
      <button type="button" id="btn-favorite-filter" class="chip-btn" title="よく使うのみ">⭐</button>
      <button type="button" id="btn-bulk-mode" class="chip-btn" title="一括編集">☑</button>
      <button type="button" id="btn-tools" class="chip-btn" title="CSV・設定">⚙</button>
    </div>
    <div id="category-chips" class="category-chips"></div>
    <div id="missing-filter-chips" class="category-chips missing-chips hidden"></div>
  </header>

  <main class="app-main master-main">
    <div id="panel-customers" class="master-panel hidden"></div>
    <div id="panel-ranks" class="master-panel hidden"></div>
    <div id="panel-work" class="master-panel hidden"></div>
    <div id="panel-materials" class="master-panel hidden"></div>
    <div id="panel-prices" class="master-panel hidden"></div>
    <div id="panel-mappings" class="master-panel hidden"></div>
    <div id="panel-categories" class="master-panel hidden"></div>
    <div id="panel-estimate-preview" class="master-panel hidden"></div>
    <div id="panel-stats" class="master-panel hidden"></div>
  </main>

  <div id="quick-add-bar" class="quick-add-bar hidden">
    <input type="text" id="quick-add-name" placeholder="作業名 / 材料名" enterkeyhint="done" autocomplete="off" />
    <div class="quick-add-actions">
      <button type="button" id="btn-quick-save" class="btn-primary btn-touch">保存</button>
      <button type="button" id="btn-quick-save-next" class="btn-primary btn-touch btn-save-next">保存して次へ</button>
    </div>
    <label class="quick-continuous"><input type="checkbox" id="chk-continuous" /> 連続入力</label>
  </div>

  <nav class="master-bottom-nav" id="bottom-nav">
    <button type="button" data-tab="customers" class="active"><span>👤</span><small>顧客</small></button>
    <button type="button" data-tab="ranks"><span>🏷</span><small>ランク</small></button>
    <button type="button" data-tab="work"><span>🔧</span><small>作業</small></button>
    <button type="button" data-tab="materials"><span>📦</span><small>材料</small></button>
    <button type="button" data-tab="prices"><span>💴</span><small>単価</small></button>
    <button type="button" data-tab="mappings"><span>🔗</span><small>記号</small></button>
    <button type="button" data-tab="categories"><span>📂</span><small>カテゴリ</small></button>
    <button type="button" data-tab="estimate-preview"><span>🧮</span><small>見積候補</small></button>
    <button type="button" data-tab="stats"><span>📊</span><small>統計</small></button>
  </nav>

  <div id="fab-add" class="fab-add" title="追加">＋</div>

  <dialog id="edit-dialog" class="master-dialog">
    <form id="edit-form" method="dialog">
      <h2 id="edit-title">編集</h2>
      <div id="edit-fields"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-sub" id="btn-edit-cancel">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="tools-dialog" class="master-dialog">
    <h2>ツール</h2>
    <div class="tools-section">
      <p class="section-hint">CSV 入出力（UTF-8 BOM）</p>
      <div class="tools-row">
        <button type="button" class="btn-sub" data-csv-export="customers">顧客 CSV</button>
        <label class="btn-sub csv-import-label">顧客 取込<input type="file" accept=".csv,text/csv" data-csv-import="customers" hidden /></label>
      </div>
      <div class="tools-row">
        <button type="button" class="btn-sub" data-csv-export="work-items">作業 CSV</button>
        <label class="btn-sub csv-import-label">作業 取込<input type="file" accept=".csv,text/csv" data-csv-import="work-items" hidden /></label>
      </div>
      <div class="tools-row">
        <button type="button" class="btn-sub" data-csv-export="materials">材料 CSV</button>
        <label class="btn-sub csv-import-label">材料 取込<input type="file" accept=".csv,text/csv" data-csv-import="materials" hidden /></label>
      </div>
    </div>
    <div class="tools-section">
      <p class="section-hint">StorageProvider テスト</p>
      <div class="tools-row">
        <button type="button" class="btn-sub" data-storage-test="local">local</button>
        <button type="button" class="btn-sub" data-storage-test="webdav">webdav</button>
        <button type="button" class="btn-sub" data-storage-test="qnap">qnap</button>
      </div>
      <p id="storage-test-result" class="hint-small"></p>
    </div>
    <button type="button" class="btn-primary" id="btn-tools-close">閉じる</button>
  </dialog>

  <div id="bulk-bar" class="bulk-bar hidden">
    <span id="bulk-count">0件選択</span>
    <button type="button" class="btn-sub" id="btn-bulk-favorite">⭐ よく使う</button>
    <button type="button" class="btn-sub" id="btn-bulk-active">有効化</button>
    <button type="button" class="btn-sub" id="btn-bulk-cancel">解除</button>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/master-v1.js"></script>
</body>
</html>
