  .sp-page { width: 198mm; height: 285mm; page-break-after: always; overflow: hidden; }

  .sp-no-photos { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12pt; color: #64748b; letter-spacing: 0.1em; }
  .sp-photo-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3mm;
  }
  .sp-page:not(.sp-first-page) .sp-photo-grid { height: 100%; }
  .sp-photo-cell { display: flex; flex-direction: column; min-height: 0; }

  .sp-photo-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sp-photo-empty { visibility: hidden; }
