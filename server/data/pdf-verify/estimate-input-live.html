<style>

      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.45;
      font-size: 0.95rem;
      box-sizing: border-box;

    .line-metrics-grid {

    .line-metric-label {

    .line-item-card .qty-input,

    @media (max-width: 480px) {
      .standalone-form .line-qty-price { grid-template-columns: 1fr 1fr; }
    }
