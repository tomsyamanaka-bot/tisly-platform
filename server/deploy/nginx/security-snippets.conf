# nginx Security Snippets — TiSLY Platform
# Include from server block: include /path/to/security-snippets.conf;

# Rate limit zones
limit_req_zone $binary_remote_addr zone=tisly_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tisly_ingest:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=tisly_admin:10m rate=10r/m;

# Upload size (JSON ingest only)
client_max_body_size 1m;

# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

# Block dotfiles / path traversal probes
location ~ /\. {
    deny all;
    return 404;
}

location ~* (\.\./|%2e%2e) {
    deny all;
    return 400;
}

# Ingest endpoint — dedicated rate limit
location = /api/events/ingest {
    limit_req zone=tisly_ingest burst=20 nodelay;
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Admin / auth — stricter limit (add allow/deny for office IP in production)
location ~ ^/api/(auth|security)/ {
    limit_req zone=tisly_admin burst=5 nodelay;
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# General API
location /api/ {
    limit_req zone=tisly_general burst=50 nodelay;
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Empty User-Agent bots
if ($http_user_agent = "") {
    return 403;
}

# SQL injection — prefer app-layer prepared statements; optional ModSecurity CRS
