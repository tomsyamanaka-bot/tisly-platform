# TiSLY Platform Phase 261-280 — Customer subdomain template
# Place under /etc/nginx/sites-available/ and symlink to sites-enabled.
# Requires wildcard TLS cert for *.tisly.jp

map $host $tisly_customer_code {
    default "";
    ~^(?<sub>[a-z0-9]+)\.tisly\.jp$ $sub;
}

map $tisly_customer_code $tisly_customer_resolved {
    default "";
    toms001   TOMS001;
    hotel001  HOTEL001;
    plant001  PLANT001;
}

upstream tisly_app {
    server 127.0.0.1:3080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.tisly.jp;

    # ssl_certificate     /etc/letsencrypt/live/tisly.jp/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tisly.jp/privkey.pem;

    include /etc/nginx/snippets/tisly-waf.conf;

    set $customer_code $tisly_customer_resolved;

    location /api/ {
        proxy_pass http://tisly_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-TiSLY-Customer-Code $customer_code;
    }

    location /customer/ {
        proxy_pass http://tisly_app;
        proxy_set_header Host $host;
        proxy_set_header X-TiSLY-Customer-Code $customer_code;
    }

    location /tv/ {
        proxy_pass http://tisly_app;
        proxy_set_header Host $host;
        proxy_set_header X-TiSLY-Customer-Code $customer_code;
    }

    location / {
        if ($customer_code = "") {
            return 302 https://tisly.jp/customer;
        }
        proxy_pass http://tisly_app/customer/$customer_code;
        proxy_set_header Host $host;
        proxy_set_header X-TiSLY-Customer-Code $customer_code;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name *.tisly.jp;
    return 301 https://$host$request_uri;
}
