# TiSLY — tisly.jp nginx template (HTTPS)
# Install: /etc/nginx/sites-available/tisly.jp
# Adjust ssl_certificate paths after certbot.

upstream tisly_backend {
    server 127.0.0.1:3080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tisly.jp www.tisly.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tisly.jp www.tisly.jp;

    ssl_certificate     /etc/letsencrypt/live/tisly.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tisly.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # REST API
    location /api/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (TV / clients)
    location /ws {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # PWA static + HTML routes (notifications, settings, tv)
    location / {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
