# TiSLY — tisly.jp nginx template (HTTPS + PWA)
# Phase 1241–1280 — RC2 本番公開パッケージ
#
# インストール:
#   sudo cp /opt/tisly/server/deploy/nginx/tisly.jp.conf /etc/nginx/sites-available/tisly.jp
#   sudo ln -sf /etc/nginx/sites-available/tisly.jp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# すべての HTML / PWA ルートは同一 Node.js アプリ (127.0.0.1:3080) へプロキシします。
# Express (server/src/app.ts) が SPA 深いリンク（例: /customer/TOMS001/install/home）を処理するため、
# nginx 側で try_files は不要です。

upstream tisly_backend {
    server 127.0.0.1:3080;
    keepalive 32;
}

# 共通プロキシヘッダ（PWA・API 共通）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name tisly.jp www.tisly.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tisly.jp www.tisly.jp;

    ssl_certificate     /etc/letsencrypt/live/tisly.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tisly.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- PWA 必須静的（キャッシュ方針を分離） ---

    # Service Worker — 常に最新を取得（インストール失敗防止）
    location = /service-worker.js {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Business 専用 Service Worker（scope: /business）
    location = /sw-business.js {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # manifest 系 — 404 防止（静的 + 動的ルート両方を Node へ）
    location ~ ^/(manifest.*\.webmanifest|business/manifest\.webmanifest|customer/[^/]+/manifest\.webmanifest|customer/[^/]+/pro-remote/manifest\.webmanifest|customer/[^/]+/install/manifest\.webmanifest)$ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300" always;
    }

    # PWA アイコン
    location /icons/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket（PRO Remote / TV / 営業デモ） ---
    location /ws {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- RC2 本番 PWA / HTML ルート（すべて同一アプリへ） ---
    # /app /survey /business /sales
    location ~ ^/(app|survey|business|sales)(/|$) {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /customer/:code/* — install/home 深いリンクのリロード 404 防止
    location /customer/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /tv/:code — Google TV Web
    location /tv/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /deployment/checklist — 導入チェックリスト
    location /deployment/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uploads（現調写真・PDF）
    location /uploads/ {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック
    location = /health {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # フォールバック — その他すべて Node.js へ（PWA 静的含む）
    location / {
        proxy_pass http://tisly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
