<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="3D Floorplan Builder" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2003" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>TiSLY 3D Floorplan Builder</title>
  <link rel="stylesheet" href="/css/features/floorplan-builder/floorplan-builder-v1.css?v=2477" />
</head>
<body class="fpb-body">
  <header class="fpb-header">
    <a class="fpb-back" href="/app">← 戻る</a>
    <div class="fpb-brand">
      <p class="fpb-brand-name">TiSLY</p>
      <h1 class="fpb-title">3D Floorplan Builder</h1>
      <p class="fpb-sub">方眼紙スキャン · アイソメ俯瞰 · Security連携</p>
    </div>
  </header>

  <main class="fpb-main">
    <section class="fpb-card fpb-presets">
      <p class="fpb-label">プリセット（撮影なしで試す）</p>
      <div class="fpb-preset-row">
        <button type="button" class="fpb-btn fpb-btn-primary" id="fpb-preset-tsukuba">
          つくばモデルハウス
        </button>
        <button type="button" class="fpb-btn fpb-btn-primary" id="fpb-preset-hiraya">
          平屋デモ住宅
        </button>
      </div>
      <p class="fpb-hint" id="fpb-status">プリセットを選ぶか、方眼紙写真を取り込んでください</p>
    </section>

    <section class="fpb-card">
      <p class="fpb-label">フロア切替</p>
      <div class="fpb-tabs" id="fpb-floor-tabs" role="tablist">
        <button type="button" class="fpb-tab is-on" data-floor="1f">1階</button>
        <button type="button" class="fpb-tab" data-floor="2f">2階</button>
        <button type="button" class="fpb-tab" data-floor="outdoor">外周・敷地</button>
      </div>
    </section>

    <section class="fpb-card fpb-scan">
      <p class="fpb-label">方眼紙写真（1マス＝3尺など）</p>
      <div class="fpb-scan-actions">
        <label class="fpb-btn fpb-btn-camera fpb-file-label" for="fpb-file-camera">
          📷 カメラで撮影
          <input type="file" id="fpb-file-camera" accept="image/*" capture="environment" />
        </label>
        <label class="fpb-btn fpb-btn-library fpb-file-label" for="fpb-file-library">
          📁 フォルダ/アルバムから選ぶ
          <input type="file" id="fpb-file-library" accept="image/*" />
        </label>
        <button type="button" class="fpb-btn fpb-btn-ghost" id="fpb-clear-bg">背景クリア</button>
      </div>
      <div
        class="fpb-dropzone"
        id="fpb-dropzone"
        tabindex="0"
        role="button"
        aria-label="方眼紙写真をドロップまたはクリックして選択"
      >
        ここに画像をドロップ（PC）· タップでアルバムから選択
      </div>
      <div class="fpb-canvas-wrap" id="fpb-canvas-wrap">
        <img id="fpb-bg" class="fpb-bg" alt="方眼紙間取り" hidden />
        <canvas id="fpb-grid" class="fpb-grid" width="400" height="400" aria-hidden="true"></canvas>
        <svg id="fpb-overlay" class="fpb-overlay" viewBox="0 0 100 100" aria-label="部屋オーバーレイ"></svg>
      </div>
      <div class="fpb-edit-row">
        <label>壁の高さ
          <input type="range" id="fpb-wall-h" min="1.8" max="3.6" step="0.1" value="2.7" />
          <span id="fpb-wall-h-val">2.7m</span>
        </label>
        <label>部屋透過
          <input type="range" id="fpb-opacity" min="0.2" max="0.9" step="0.05" value="0.55" />
          <span id="fpb-opacity-val">55%</span>
        </label>
      </div>
    </section>

    <section class="fpb-card fpb-preview-card">
      <p class="fpb-label">3D斜め俯瞰（アイソメトリック）</p>
      <div class="fpb-preview" id="fpb-preview" aria-label="3Dプレビュー"></div>
      <p class="fpb-hint">ドラッグで回転 · ピンチ/ホイールでズーム</p>
    </section>

    <section class="fpb-card fpb-actions">
      <button type="button" class="fpb-btn fpb-btn-neon" id="fpb-save">
        💾 LocalStorage &amp; サーバーに保存
      </button>
      <button type="button" class="fpb-btn fpb-btn-send" id="fpb-send-security">
        🛡️ TiSLY Securityに送信して使う
      </button>
      <a class="fpb-btn fpb-btn-ghost" id="fpb-open-security" href="/security-v1?fromBuilder=1">
        Security俯瞰を開く
      </a>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/features/floorplan-builder/floorplan-builder-v1.js?v=2477"></script>
</body>
</html>
