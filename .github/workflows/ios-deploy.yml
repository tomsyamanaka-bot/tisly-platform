name: iOS App Store Deploy (legacy alias)

# 正規パイプライン（xcodebuild）へ委譲

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect へアップロードする"
        type: boolean
        default: true
      server_url:
        description: "Capacitor server.url"
        required: false
        default: "https://tisly.jp"
        type: string

jobs:
  call-canonical:
    name: Delegate to ios-build-deploy
    uses: ./.github/workflows/ios-build-deploy.yml
    with:
      upload: ${{ inputs.upload }}
      server_url: ${{ inputs.server_url }}
    secrets: inherit
