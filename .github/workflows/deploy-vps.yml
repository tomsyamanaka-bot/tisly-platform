name: VPS Auto Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "デプロイする ref（省略時は master の最新）"
        required: false
        default: "master"
        type: string

concurrency:
  group: tisly-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ConoHa VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (resolve deploy commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${VPS_HOST}" ] && missing+=("VPS_HOST")
          [ -z "${VPS_USER}" ] && missing+=("VPS_USER")
          [ -z "${VPS_SSH_KEY}" ] && missing+=("VPS_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::GitHub Secrets が未設定です: ${missing[*]}"
            echo ""
            echo "=== 不足している Secrets ==="
            for name in "${missing[@]}"; do
              echo "  - ${name}"
            done
            echo ""
            echo "=== 登録手順 ==="
            echo "  Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "=== 必要な Secrets（4 項目）==="
            echo "  VPS_HOST     — VPS の IP またはホスト名"
            echo "  VPS_USER     — SSH ログインユーザー（例: root / tisly）"
            echo "  VPS_SSH_KEY  — 秘密鍵 PEM 全文"
            echo "  VPS_PORT     — SSH ポート（省略可、デフォルト 55222）"
            echo ""
            echo "詳細: docs/autonomous/VPS_AUTO_DEPLOY.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PORT="${VPS_PORT:-55222}"
          echo "Secrets OK (host=${VPS_HOST}, user=${VPS_USER}, port=${PORT})"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy commit
        id: commit
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploy target commit: ${SHORT} (${FULL})"

      - name: Prepare SSH and log deploy target
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-55222}"
          KEY_FILE="${HOME}/.ssh/tisly_deploy_key"

          echo "=== Deploy SSH target ==="
          echo "host: ${VPS_HOST}"
          echo "user: ${VPS_USER}"
          echo "port: ${PORT}"

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          # 秘密鍵の改行崩れ対策（複数パターンを試行、中身はログに出さない）
          # NOTE: printf '%b' は鍵本文のバックスラッシュを壊すため使わない
          KEY_READY=false
          write_key() {
            printf '%s' "$1" > "${KEY_FILE}"
            chmod 600 "${KEY_FILE}"
          }
          has_begin_marker() {
            [ -s "${KEY_FILE}" ] && head -1 "${KEY_FILE}" | grep -q 'BEGIN'
          }

          write_key "${VPS_SSH_KEY}"
          has_begin_marker && KEY_READY=true && echo "ssh key loaded (strategy: raw)"

          if [ "${KEY_READY}" != "true" ]; then
            write_key "$(printf '%s' "${VPS_SSH_KEY}" | sed 's/\\n/\n/g')"
            has_begin_marker && KEY_READY=true && echo "ssh key loaded (strategy: sed-\\\\n)"
          fi

          if [ "${KEY_READY}" != "true" ]; then
            write_key "$(printf '%s' "${VPS_SSH_KEY}" | tr -d '\r' | sed 's/\\n/\n/g')"
            has_begin_marker && KEY_READY=true && echo "ssh key loaded (strategy: tr-sed)"
          fi

          if [ "${KEY_READY}" != "true" ]; then
            if printf '%s' "${VPS_SSH_KEY}" | tr -d '\n\r ' | base64 -d > "${KEY_FILE}" 2>/dev/null; then
              chmod 600 "${KEY_FILE}"
              has_begin_marker && KEY_READY=true && echo "ssh key loaded (strategy: base64)"
            fi
          fi

          # 6) 1行潰れ OpenSSH / PEM を PEM 形式へ再構成
          if [ "${KEY_READY}" != "true" ] || ! ssh-keygen -y -f "${KEY_FILE}" >/dev/null 2>&1; then
            python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ.get("VPS_SSH_KEY", "").strip().replace("\\n", "\n")
          m = re.search(
              r"(-----BEGIN [^-]+-----)\s*(.+?)\s*(-----END [^-]+-----)",
              raw,
              re.S,
          )
          if m:
              header, body, footer = m.groups()
              body = re.sub(r"\s+", "", body)
              wrapped = "\n".join(textwrap.wrap(body, 70))
              fixed = f"{header}\n{wrapped}\n{footer}\n"
              path = os.path.expanduser("~/.ssh/tisly_deploy_key")
              os.makedirs(os.path.dirname(path), mode=0o700, exist_ok=True)
              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(fixed)
              os.chmod(path, 0o600)
          PY
            has_begin_marker && KEY_READY=true && echo "ssh key loaded (strategy: python-wrap)"
          fi

          if [ "${KEY_READY}" != "true" ]; then
            echo "::error::SSH key format invalid — VPS_SSH_KEY に BEGIN 行がありません。秘密鍵 PEM 全文を再登録してください"
            exit 1
          fi

          echo "ssh key file: present ($(wc -c < "${KEY_FILE}") bytes)"
          if ssh-keygen -y -f "${KEY_FILE}" >/dev/null 2>&1; then
            echo "ssh key validation: OK (ssh-keygen -y)"
          else
            echo "::warning::ssh-keygen -y failed — SSH 接続テストで最終判定します"
          fi

      - name: Deploy via SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          EXPECTED_SHORT: ${{ steps.commit.outputs.short }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-55222}"
          KEY_FILE="${HOME}/.ssh/tisly_deploy_key"
          SSH_BASE=(
            -p "${PORT}"
            -i "${KEY_FILE}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o GlobalKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          TARGET="${VPS_USER}@${VPS_HOST}"

          echo "=== SSH connectivity test ==="
          ssh_try() {
            local p="$1"
            ssh -p "${p}" -i "${KEY_FILE}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o GlobalKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              -o ConnectTimeout=15 \
              "${TARGET}" 'echo "SSH_OK user=$(whoami) host=$(hostname) port='"${p}"'"'
          }

          CONNECTED=false
          for try_port in "${PORT}" 55222 22; do
            echo "try port: ${try_port}"
            if ssh_try "${try_port}"; then
              PORT="${try_port}"
              CONNECTED=true
              echo "SSH connected on port ${PORT}"
              break
            fi
          done

          if [ "${CONNECTED}" != "true" ]; then
            echo "::error::SSH 接続失敗 (host=${VPS_HOST} user=${VPS_USER}, tried ports: ${PORT} 55222 22)"
            echo "確認: VPS_SSH_KEY が秘密鍵 PEM 全文か / 対応する公開鍵が authorized_keys にあるか / ファイアウォール"
            exit 1
          fi

          SSH_BASE=(
            -p "${PORT}"
            -i "${KEY_FILE}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o GlobalKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          echo "=== Remote deploy (inline, no VPS script required) ==="
          ssh "${SSH_BASE[@]}" "${TARGET}" "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}" bash -s "${EXPECTED_SHORT}" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHORT="${1:-}"
          REPO_ROOT=/opt/tisly
          SERVER_DIR="${REPO_ROOT}/server"
          SERVICE_NAME=tisly-server
          HEALTH_URL=https://tisly.jp/api/health
          ENV_FILE="${SERVER_DIR}/.env"

          sync_env_var() {
            local key="$1"
            local val="$2"
            [ -n "${val}" ] || return 0
            if [ ! -f "${ENV_FILE}" ]; then
              echo "${key}=${val}" >> "${ENV_FILE}"
              echo "=== env: created ${key} in .env ==="
              return 0
            fi
            if grep -q "^${key}=" "${ENV_FILE}"; then
              sed -i "s|^${key}=.*|${key}=${val}|" "${ENV_FILE}"
            else
              echo "${key}=${val}" >> "${ENV_FILE}"
            fi
            echo "=== env: synced ${key} in .env ==="
          }

          if [ -n "${GOOGLE_MAPS_API_KEY:-}" ]; then
            sync_env_var "GOOGLE_MAPS_API_KEY" "${GOOGLE_MAPS_API_KEY}"
          fi

          echo "========================================"
          echo "  TiSLY VPS Auto Deploy (inline)"
          echo "  expected commitShort: ${EXPECTED_SHORT}"
          echo "  user: $(whoami)"
          echo "  host: $(hostname)"
          echo "========================================"

          cd "${REPO_ROOT}"
          echo "=== current git commit (before sync) ==="
          git log -1 --oneline || true

          echo "=== git fetch & reset (no git pull) ==="
          git fetch origin
          git reset --hard origin/master

          echo "=== current git commit (after sync) ==="
          git log -1 --oneline
          HEAD_SHORT="$(git rev-parse --short HEAD)"
          echo "commitShort (after sync): ${HEAD_SHORT}"

          cd "${SERVER_DIR}"
          echo "=== npm install ==="
          npm install
          [ -d node_modules/puppeteer ] || { echo "ERROR: puppeteer missing — PDF generation requires puppeteer"; exit 1; }
          echo "=== build ==="
          npm run build
          [ -f dist/index.js ] || { echo "ERROR: dist/index.js missing"; exit 1; }

          echo "=== restart ==="
          if [ "$(id -u)" -eq 0 ]; then
            systemctl restart "${SERVICE_NAME}"
          else
            sudo -n systemctl restart "${SERVICE_NAME}"
          fi

          echo "=== health check ==="
          HEALTH_BODY=""
          for attempt in $(seq 1 30); do
            if HEALTH_BODY="$(curl -sf --max-time 15 "${HEALTH_URL}" 2>/dev/null)"; then
              if echo "${HEALTH_BODY}" | grep -q commitShort; then
                break
              fi
            fi
            echo "health wait (${attempt}/30)..."
            sleep 2
          done
          [ -n "${HEALTH_BODY}" ] || { echo "ERROR: health API unreachable"; exit 1; }
          echo "${HEALTH_BODY}" | grep commitShort || { echo "ERROR: commitShort missing in health"; exit 1; }

          ACTUAL_SHORT="$(echo "${HEALTH_BODY}" | grep -oE '"commitShort":"[0-9a-f]{7}"' | head -1 | cut -d'"' -f4 || true)"
          if [ "${ACTUAL_SHORT}" != "${HEAD_SHORT}" ]; then
            echo "ERROR: commitShort mismatch health=${ACTUAL_SHORT:-<none>} git=${HEAD_SHORT}"
            exit 1
          fi
          if [ -n "${EXPECTED_SHORT}" ] && [ "${ACTUAL_SHORT}" != "${EXPECTED_SHORT}" ]; then
            echo "ERROR: commitShort mismatch expected=${EXPECTED_SHORT} actual=${ACTUAL_SHORT}"
            exit 1
          fi

          echo "${HEALTH_BODY}" | grep -q '"qnapPdfBackupV1":true' \
            || { echo "ERROR: runtimeFeatures.qnapPdfBackupV1 missing — Node process not restarted with new build"; exit 1; }
          echo "${HEALTH_BODY}" | grep -q '"pdfEngine":"puppeteer"' \
            || { echo "ERROR: pdfEngine is not puppeteer — PDF generation unavailable"; exit 1; }
          echo "${HEALTH_BODY}" | grep -q '"pdfEngineReady":true' \
            || { echo "ERROR: pdfEngineReady is false — check Chromium on VPS"; exit 1; }
          UPTIME="$(echo "${HEALTH_BODY}" | grep -oE '"uptime":[0-9]+' | head -1 | cut -d: -f2 || true)"
          if [ -n "${UPTIME}" ] && [ "${UPTIME}" -gt 180 ]; then
            echo "ERROR: uptime ${UPTIME}s after restart (expected <= 180)"
            exit 1
          fi

          MAPS_OK="$(echo "${HEALTH_BODY}" | grep -oE '"googleMapsApiConfigured":(true|false)' | head -1 || true)"
          echo "=== integrations: ${MAPS_OK:-maps status unknown} ==="
          if [ -n "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "${HEALTH_BODY}" | grep -q '"googleMapsApiConfigured":true' \
              || { echo "ERROR: GOOGLE_MAPS_API_KEY set but health googleMapsApiConfigured is not true"; exit 1; }
          fi

          echo ""
          echo "========================================"
          echo "  DEPLOY OK"
          echo "  commit: ${HEAD_SHORT}"
          echo "  health: ${HEALTH_URL}"
          echo "========================================"
          REMOTE

      - name: Verify health commitShort (GitHub Actions)
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPECTED_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          set -euo pipefail
          short="${EXPECTED_SHORT}"
          echo "=== health API 最終確認 ==="
          echo "期待 commitShort: ${short}"
          body="$(curl -sf --max-time 30 https://tisly.jp/api/health)"
          echo "${body}"
          echo "${body}" | grep -q "\"commitShort\":\"${short}\"" \
            || { echo "::error::commitShort が ${short} と一致しません"; exit 1; }
          echo "${body}" | grep -q '"qnapPdfBackupV1":true' \
            || { echo "::error::runtimeFeatures.qnapPdfBackupV1 がありません（Node 再起動未反映）"; exit 1; }
          uptime="$(echo "${body}" | grep -oE '"uptime":[0-9]+' | head -1 | cut -d: -f2 || true)"
          if [ -n "${uptime}" ] && [ "${uptime}" -gt 180 ]; then
            echo "::error::uptime ${uptime}s — 再起動後のプロセスではありません"
            exit 1
          fi
          echo "commitShort verified: ${short}"

      - name: Deploy summary
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## DEPLOY OK :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## DEPLOY FAILED :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 値 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| commitShort | \`${{ steps.commit.outputs.short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| health URL | https://tisly.jp/api/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "| trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "成功確認: \`curl -s https://tisly.jp/api/health | grep commitShort\`" >> "$GITHUB_STEP_SUMMARY"
