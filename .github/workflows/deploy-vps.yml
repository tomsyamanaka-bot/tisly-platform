name: VPS Auto Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "デプロイする ref（省略時は master の最新）"
        required: false
        default: "master"
        type: string

concurrency:
  group: tisly-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ConoHa VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (resolve deploy commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${VPS_HOST}" ] && missing+=("VPS_HOST")
          [ -z "${VPS_USER}" ] && missing+=("VPS_USER")
          [ -z "${VPS_SSH_KEY}" ] && missing+=("VPS_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::GitHub Secrets が未設定です: ${missing[*]}"
            echo ""
            echo "=== 不足している Secrets ==="
            for name in "${missing[@]}"; do
              echo "  - ${name}"
            done
            echo ""
            echo "=== 登録手順 ==="
            echo "  Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "=== 必要な Secrets（4 項目）==="
            echo "  VPS_HOST     — VPS の IP またはホスト名"
            echo "  VPS_USER     — SSH ログインユーザー（例: tisly）"
            echo "  VPS_SSH_KEY  — 秘密鍵 PEM 全文"
            echo "  VPS_PORT     — SSH ポート（省略可、デフォルト 22）"
            echo ""
            echo "詳細: docs/autonomous/VPS_AUTO_DEPLOY.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          PORT="${VPS_PORT:-22}"
          echo "Secrets OK (host=${VPS_HOST}, user=${VPS_USER}, port=${PORT})"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy commit
        id: commit
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploy target commit: ${SHORT} (${FULL})"

      - name: Deploy via SSH
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_COMMIT_SHORT: ${{ steps.commit.outputs.full }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.secrets.outputs.port || 22 }}
          script_stop: true
          envs: EXPECTED_COMMIT_SHORT
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "========================================"
            echo "  TiSLY VPS Auto Deploy (SSH)"
            echo "  expected commitShort: ${EXPECTED_COMMIT_SHORT:0:7}"
            echo "  triggered by: ${{ github.actor }} (${{ github.event_name }})"
            echo "========================================"
            export EXPECTED_COMMIT_SHORT="${EXPECTED_COMMIT_SHORT}"
            bash /opt/tisly/scripts/deploy-vps.sh

      - name: Verify health commitShort (GitHub Actions)
        if: steps.secrets.outputs.ready == 'true'
        env:
          EXPECTED_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          set -euo pipefail
          short="${EXPECTED_SHORT}"
          echo "=== health API 最終確認 ==="
          echo "期待 commitShort: ${short}"
          body="$(curl -sf --max-time 30 https://tisly.jp/api/health)"
          echo "${body}"
          echo "${body}" | grep -q "\"commitShort\":\"${short}\"" \
            || { echo "::error::commitShort が ${short} と一致しません"; exit 1; }
          echo "commitShort verified: ${short}"

      - name: Deploy summary
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## DEPLOY OK :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## DEPLOY FAILED :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 値 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| commitShort | \`${{ steps.commit.outputs.short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| health URL | https://tisly.jp/api/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "| trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "成功確認: \`curl -s https://tisly.jp/api/health | grep commitShort\`" >> "$GITHUB_STEP_SUMMARY"
