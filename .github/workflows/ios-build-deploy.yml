name: iOS Build & Deploy (Capacitor)

# Capacitor iOS → IPA → TestFlight（macos-latest）
# xcodebuild Automatic Signing + ASC API キー（Fastlane なし）
# Secrets: APP_STORE_KEY_ID / APP_STORE_ISSUER_ID / APP_STORE_PRIVATE_KEY
# Variable: APPLE_TEAM_ID
# 既存 PWA / VPS / DB は変更しない

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect / TestFlight へアップロードする"
        type: boolean
        default: true
      server_url:
        description: "Capacitor server.url"
        required: false
        default: "https://tisly.jp"
        type: string
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      server_url:
        type: string
        required: false
        default: "https://tisly.jp"
  push:
    tags:
      - "ios-v*"
      - "v*-ios"

concurrency:
  group: tisly-ios-build-deploy
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: jp.tisly.app
  NODE_VERSION: "20"

jobs:
  build-and-upload:
    name: xcodebuild + ASC API key
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Variables / Secrets から Team ID をジョブ全体へ明示バインド
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve APPLE_TEAM_ID and ASC config
        id: cfg
        env:
          # ステップでも再宣言（ジョブ env を明示上書き・可観測に）
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${APP_STORE_KEY_ID:-}" ] && missing+=("APP_STORE_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}" ] && missing+=("APP_STORE_ISSUER_ID")
          [ -z "${APP_STORE_PRIVATE_KEY:-}" ] && missing+=("APP_STORE_PRIVATE_KEY")

          # 正規化: 空白・引用符・CRLF を除去し大文字化
          TEAM="${APPLE_TEAM_ID:-}"
          if [ -z "$TEAM" ] && [ -f ios-ci/apple-team-id ]; then
            TEAM="$(grep -v '^#' ios-ci/apple-team-id | tr -d '[:space:]' || true)"
          fi
          TEAM="$(printf '%s' "$TEAM" | tr -d '[:space:]' | tr -d "\"'" | tr '[:lower:]' '[:upper:]')"

          if [ -z "$TEAM" ]; then
            missing+=("APPLE_TEAM_ID")
          elif ! printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID の形式が不正です（英数字10文字が必要）。length=${#TEAM}"
            echo "GitHub → Settings → Secrets and variables → Actions → Variables に APPLE_TEAM_ID を登録してください。"
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::未設定: ${missing[*]}"
            echo "docs/IOS_SECRETS_SETUP.md"
            exit 1
          fi

          UPLOAD="true"
          SERVER_URL="https://tisly.jp"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="${{ github.event.inputs.upload }}"
            SERVER_URL="${{ github.event.inputs.server_url }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            UPLOAD="${{ inputs.upload }}"
            SERVER_URL="${{ inputs.server_url }}"
          fi

          # 後続ステップ・xcodebuild が参照する環境変数を確定
          echo "APPLE_TEAM_ID=${TEAM}" >> "$GITHUB_ENV"
          echo "team_id=${TEAM}" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "server_url=${SERVER_URL}" >> "$GITHUB_OUTPUT"
          # 値そのものはログに出さず、長さと形式のみ（Secret 登録時の *** 誤検知を避ける）
          echo "Config OK bundle=jp.tisly.app team_len=${#TEAM} team_format=ok upload=${UPLOAD}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install npm deps
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix server

      - name: Build web / server
        run: npm run build

      - name: Prepare Capacitor www
        run: npm run cap:prepare
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks | head -n 40 || true

      - name: Capacitor add / sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios
          npm run ios:patch-plist
          # 確認: capacitor.config appId と一致
          grep -n "jp.tisly.app\|PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj | head -n 40 || true

      - name: Write ASC API key (.p8)
        env:
          APP_STORE_KEY_ID: ${{ env.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ env.APP_STORE_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ env.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_KEY_ID}.p8"
          if [ "${APP_STORE_PRIVATE_KEY_IS_BASE64:-}" = "1" ]; then
            echo -n "$APP_STORE_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          else
            printf '%s\n' "$APP_STORE_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"
          fi
          # PEM ヘッダ確認
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_PRIVATE_KEY が PEM 形式ではありません"
            exit 1
          fi
          mkdir -p "${HOME}/private_keys" "${HOME}/.appstoreconnect/private_keys" "./private_keys"
          cp "$KEY_PATH" "${HOME}/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "./private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          ls -la "$KEY_PATH"

      - name: Prepare CI keychain (codesign)
        run: |
          set -euo pipefail
          KC="${RUNNER_TEMP}/tisly-ci.keychain-db"
          KP="tisly-ci-temp"
          security delete-keychain "$KC" 2>/dev/null || true
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          echo "KEYCHAIN_PATH=${KC}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=${KP}" >> "$GITHUB_ENV"

      - name: Setup Ruby + xcodeproj
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install xcodeproj gem
        run: gem install xcodeproj -N

      - name: Patch Podfile for CI (disable Pods code sign)
        run: bash scripts/ios-patch-podfile.sh ios/App/Podfile

      - name: CocoaPods install
        working-directory: ios/App
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Configure Xcode project (bundle + team + Automatic)
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_TEAM_ID が空です（vars.APPLE_TEAM_ID を確認）"
            exit 1
          fi
          echo "Using APPLE_TEAM_ID length=${#APPLE_TEAM_ID}"
          ruby scripts/ios-configure-xcode.rb \
            ios/App/App.xcodeproj \
            jp.tisly.app \
            "$APPLE_TEAM_ID"
          xcodebuild -workspace ios/App/App.xcworkspace -list
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|MARKETING_VERSION|CURRENT_PROJECT_VERSION' \
            | head -n 40 || true

      - name: Resolve Xcode scheme
        id: xcode
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/ios/App/App.xcworkspace"
          if [ ! -d "$WS" ]; then
            echo "::error::workspace がありません: $WS"
            ls -la "${GITHUB_WORKSPACE}/ios/App" || true
            exit 1
          fi
          LIST="$(xcodebuild -workspace "$WS" -list)"
          echo "$LIST"
          # Prefer scheme App (Capacitor default), then TiSLY, then first listed scheme
          SCHEME="App"
          if ! echo "$LIST" | grep -E '^\s+App\s*$' >/dev/null; then
            if echo "$LIST" | grep -E '^\s+TiSLY\s*$' >/dev/null; then
              SCHEME="TiSLY"
            else
              SCHEME="$(echo "$LIST" | awk '/Schemes:/{f=1;next} f && NF{gsub(/^ +/,""); print; exit}')"
            fi
          fi
          if [ -z "$SCHEME" ]; then
            echo "::error::Xcode scheme を検出できませんでした"
            exit 1
          fi
          echo "scheme=${SCHEME}" >> "$GITHUB_OUTPUT"
          echo "workspace=${WS}" >> "$GITHUB_OUTPUT"
          echo "app_dir=${GITHUB_WORKSPACE}/ios/App" >> "$GITHUB_OUTPUT"
          echo "Resolved scheme=${SCHEME}"

      - name: Render ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          mkdir -p "${APP_DIR}/build/ipa"
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" ios-ci/ExportOptions.plist > "${APP_DIR}/build/ExportOptions.plist"
          # destination must be export to produce a local .ipa
          /usr/libexec/PlistBuddy -c "Set :destination export" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :destination string export" "${APP_DIR}/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :method app-store" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null || true
          plutil -p "${APP_DIR}/build/ExportOptions.plist"

      - name: Archive (xcodebuild)
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          WS="${APP_DIR}/App.xcworkspace"
          ARCHIVE_PATH="${APP_DIR}/build/TiSLY.xcarchive"
          RESULT_PATH="${APP_DIR}/build/TiSLY.xcresult"
          LOG="${APP_DIR}/build/archive.log"
          mkdir -p "${APP_DIR}/build"
          cd "$APP_DIR"

          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_TEAM_ID empty at archive step"
            exit 1
          fi
          echo "scheme=${XCODE_SCHEME} archivePath=${ARCHIVE_PATH} team_len=${#APPLE_TEAM_ID}"

          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -resultBundlePath "$RESULT_PATH" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=jp.tisly.app \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild archive failed with exit ${STATUS}"
            grep -E 'error:|warning:|ARCHIVE FAILED|Provisioning|Signing|bundle|Team' "$LOG" | tail -n 80 || true
            exit "$STATUS"
          fi
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::archive が作成されませんでした: $ARCHIVE_PATH"
            ls -laR "${APP_DIR}/build" || true
            exit 1
          fi
          echo "Archive OK:"
          ls -la "$ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH/Products/Applications" 2>/dev/null || true

      - name: Export IPA (xcodebuild)
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          ARCHIVE_PATH="${APP_DIR}/build/TiSLY.xcarchive"
          EXPORT_DIR="${APP_DIR}/build/ipa"
          EXPORT_PLIST="${APP_DIR}/build/ExportOptions.plist"
          LOG="${APP_DIR}/build/export.log"
          OUT_IPA="${APP_DIR}/build/TiSLY.ipa"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::export 前に archive がありません: $ARCHIVE_PATH"
            exit 1
          fi
          if [ ! -f "$EXPORT_PLIST" ]; then
            echo "::error::ExportOptions.plist がありません: $EXPORT_PLIST"
            exit 1
          fi

          echo "exportArchive archive=${ARCHIVE_PATH}"
          echo "exportPath=${EXPORT_DIR}"
          plutil -p "$EXPORT_PLIST"

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "===== export dir listing ====="
          ls -laR "$EXPORT_DIR" || true
          ls -laR "${APP_DIR}/build" || true

          # IPA を広い範囲で探索（App.ipa / TiSLY.ipa など scheme 由来の名前）
          IPA="$(find "$EXPORT_DIR" "${APP_DIR}/build" -type f -name '*.ipa' 2>/dev/null | head -n 1 || true)"

          if [ "$STATUS" -ne 0 ] && [ -z "$IPA" ]; then
            echo "::error::xcodebuild export failed with exit ${STATUS} and no IPA"
            grep -E 'error:|Export|Provisioning|Signing|IPA' "$LOG" | tail -n 100 || true
            exit "$STATUS"
          fi

          if [ -z "$IPA" ]; then
            echo "::error::IPA が見つかりません（exportPath=${EXPORT_DIR}）"
            grep -E 'error:|Export|IPA|\.ipa' "$LOG" | tail -n 100 || true
            exit 1
          fi

          cp -f "$IPA" "$OUT_IPA"
          echo "Found IPA: ${IPA}"
          ls -lh "$OUT_IPA"

      - name: Upload to App Store Connect
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::upload 用 IPA がありません: $IPA"
            find "${GITHUB_WORKSPACE}/ios/App/build" -name '*.ipa' -ls || true
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID" \
            --verbose

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiSLY-ios-ipa
          path: |
            ios/App/build/TiSLY.ipa
            ios/App/build/ipa/**
            ios/App/build/archive.log
            ios/App/build/export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          TEAM_LEN="$(printf '%s' '${{ steps.cfg.outputs.team_id }}' | wc -c | tr -d ' ')"
          IPA="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa"
          IPA_STATE="missing"
          if [ -f "$IPA" ]; then IPA_STATE="$(ls -lh "$IPA" | awk '{print $5}')"; fi
          echo "### TiSLY iOS (xcodebuild + ASC API key)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundle: \`jp.tisly.app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- scheme: \`${{ steps.xcode.outputs.scheme }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA: \`${IPA_STATE}\` at \`ios/App/build/TiSLY.ipa\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APPLE_TEAM_ID: bound from \`vars.APPLE_TEAM_ID\` (len=${TEAM_LEN})" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload: \`${{ steps.cfg.outputs.upload }}\`" >> "$GITHUB_STEP_SUMMARY"
