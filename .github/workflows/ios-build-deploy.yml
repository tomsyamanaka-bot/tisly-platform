name: iOS Build & Deploy (Capacitor)

# Capacitor iOS → IPA → App Store Connect / TestFlight（macos-latest）
# xcodebuild Automatic Signing + ASC API キー（Fastlane なし）
# Secrets: APP_STORE_KEY_ID / APP_STORE_ISSUER_ID / APP_STORE_PRIVATE_KEY
# Variables: APPLE_TEAM_ID（推奨）または APP_TEAM_ID
# Canonical IPA: ${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa
# 既存 PWA / VPS / DB は変更しない

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect / TestFlight へアップロードする"
        type: boolean
        default: true
      server_url:
        description: "Capacitor server.url"
        required: false
        default: "https://tisly.jp"
        type: string
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      server_url:
        type: string
        required: false
        default: "https://tisly.jp"
  push:
    branches: [master]
    paths:
      - ".github/workflows/ios-build-deploy.yml"
      - ".github/workflows/ios-deploy.yml"
      - "scripts/ios-*"
      - "ios-ci/**"
      - "capacitor.config.ts"
    tags:
      - "ios-v*"
      - "v*-ios"

concurrency:
  group: tisly-ios-build-deploy
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: jp.tisly.app
  NODE_VERSION: "20"
  # Canonical paths (relative to workspace; steps expand with GITHUB_WORKSPACE)
  IOS_APP_DIR: ios/App
  IOS_IPA_REL: ios/App/build/TiSLY.ipa

jobs:
  build-and-upload:
    name: xcodebuild + ASC API key
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Team ID: APPLE_TEAM_ID / APP_TEAM_ID（Variables 優先、Secrets フォールバック）
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.APP_TEAM_ID || secrets.APPLE_TEAM_ID || secrets.APP_TEAM_ID }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve APPLE_TEAM_ID and ASC config
        id: cfg
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.APP_TEAM_ID || secrets.APPLE_TEAM_ID || secrets.APP_TEAM_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${APP_STORE_KEY_ID:-}" ] && missing+=("APP_STORE_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}" ] && missing+=("APP_STORE_ISSUER_ID")
          [ -z "${APP_STORE_PRIVATE_KEY:-}" ] && missing+=("APP_STORE_PRIVATE_KEY")

          TEAM="${APPLE_TEAM_ID:-}"
          if [ -z "$TEAM" ] && [ -f ios-ci/apple-team-id ]; then
            TEAM="$(grep -v '^#' ios-ci/apple-team-id | tr -d '[:space:]' || true)"
          fi
          TEAM="$(printf '%s' "$TEAM" | tr -d '[:space:]' | tr -d "\"'" | tr '[:lower:]' '[:upper:]')"

          if [ -z "$TEAM" ]; then
            missing+=("APPLE_TEAM_ID|APP_TEAM_ID")
          elif ! printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::Team ID の形式が不正です（英数字10文字）。length=${#TEAM}"
            echo "Variables に APPLE_TEAM_ID（または APP_TEAM_ID）を登録してください。"
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::未設定: ${missing[*]}"
            echo "docs/IOS_SECRETS_SETUP.md"
            exit 1
          fi

          UPLOAD="true"
          SERVER_URL="https://tisly.jp"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="${{ github.event.inputs.upload }}"
            SERVER_URL="${{ github.event.inputs.server_url }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            UPLOAD="${{ inputs.upload }}"
            SERVER_URL="${{ inputs.server_url }}"
          fi

          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          IPA="${APP_DIR}/build/TiSLY.ipa"
          echo "APPLE_TEAM_ID=${TEAM}" >> "$GITHUB_ENV"
          echo "team_id=${TEAM}" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "server_url=${SERVER_URL}" >> "$GITHUB_OUTPUT"
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "ipa_path=${IPA}" >> "$GITHUB_OUTPUT"
          echo "Config OK bundle=jp.tisly.app team_len=${#TEAM} team_format=ok upload=${UPLOAD}"
          echo "Canonical IPA will be: ${IPA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install npm deps
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix server

      - name: Build web / server
        run: npm run build

      - name: Prepare Capacitor www
        run: npm run cap:prepare
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks | head -n 40 || true

      - name: Capacitor add / sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          # 初回 sync（システム pod）。最終 pod install は gem cocoapods で再実行する
          npx cap sync ios
          test -d ios/App/App.xcodeproj
          test -f ios/App/Podfile
          npm run ios:patch-plist
          grep -n "jp.tisly.app\|PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj | head -n 40 || true

      - name: Write ASC API key (.p8)
        env:
          APP_STORE_KEY_ID: ${{ env.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ env.APP_STORE_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ env.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_KEY_ID}.p8"
          if [ "${APP_STORE_PRIVATE_KEY_IS_BASE64:-}" = "1" ]; then
            echo -n "$APP_STORE_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          else
            printf '%s\n' "$APP_STORE_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_PRIVATE_KEY が PEM 形式ではありません"
            exit 1
          fi
          mkdir -p "${HOME}/private_keys" "${HOME}/.appstoreconnect/private_keys" "./private_keys"
          cp "$KEY_PATH" "${HOME}/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "./private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          chmod 600 "$KEY_PATH" \
            "${HOME}/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8" \
            "./private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          ls -la "$KEY_PATH"

      - name: Prepare CI keychain (codesign)
        run: |
          set -euo pipefail
          KC="${RUNNER_TEMP}/tisly-ci.keychain-db"
          KP="tisly-ci-temp"
          security delete-keychain "$KC" 2>/dev/null || true
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          # Allow codesign without UI prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" 2>/dev/null || true
          echo "KEYCHAIN_PATH=${KC}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=${KP}" >> "$GITHUB_ENV"

      - name: Setup Ruby + CocoaPods + xcodeproj
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods and xcodeproj gems
        run: |
          set -euo pipefail
          gem install cocoapods xcodeproj -N
          which pod
          pod --version
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION'

      - name: Patch Podfile for CI (single post_install)
        run: bash scripts/ios-patch-podfile.sh ios/App/Podfile

      - name: CocoaPods install
        working-directory: ios/App
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ios/App/build"
          echo "===== Podfile ====="
          cat Podfile
          POST_COUNT="$(grep -c 'post_install do' Podfile || true)"
          echo "post_install_count=${POST_COUNT}"
          if [ "$POST_COUNT" -ne 1 ]; then
            echo "::error::Podfile must contain exactly one post_install (got ${POST_COUNT})"
            exit 1
          fi
          which pod
          pod --version
          set +e
          pod install 2>&1 | tee "${GITHUB_WORKSPACE}/ios/App/build/pod-install.log"
          POD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$POD_STATUS" -ne 0 ]; then
            echo "pod install failed (${POD_STATUS}) — retry with --repo-update"
            pod install --repo-update 2>&1 | tee -a "${GITHUB_WORKSPACE}/ios/App/build/pod-install.log"
          fi
          test -d App.xcworkspace
          test -f Podfile.lock
          ls -la App.xcworkspace Podfile.lock

      - name: Configure Xcode project (bundle + team + Automatic)
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_TEAM_ID が空です"
            exit 1
          fi
          echo "Using APPLE_TEAM_ID length=${#APPLE_TEAM_ID} build=${CURRENT_PROJECT_VERSION}"
          ruby scripts/ios-configure-xcode.rb \
            ios/App/App.xcodeproj \
            jp.tisly.app \
            "$APPLE_TEAM_ID"
          xcodebuild -workspace ios/App/App.xcworkspace -list
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|SKIP_INSTALL|MARKETING_VERSION|CURRENT_PROJECT_VERSION' \
            | head -n 50 || true

      - name: Resolve Xcode scheme
        id: xcode
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/ios/App/App.xcworkspace"
          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          if [ ! -d "$WS" ]; then
            echo "::error::workspace がありません: $WS"
            ls -la "$APP_DIR" || true
            exit 1
          fi
          LIST="$(xcodebuild -workspace "$WS" -list)"
          echo "$LIST"
          SCHEME="App"
          if ! echo "$LIST" | grep -E '^\s+App\s*$' >/dev/null; then
            if echo "$LIST" | grep -E '^\s+TiSLY\s*$' >/dev/null; then
              SCHEME="TiSLY"
            else
              SCHEME="$(echo "$LIST" | awk '/Schemes:/{f=1;next} f && NF{gsub(/^ +/,""); print; exit}')"
            fi
          fi
          if [ -z "$SCHEME" ]; then
            echo "::error::Xcode scheme を検出できませんでした"
            exit 1
          fi
          echo "scheme=${SCHEME}" >> "$GITHUB_OUTPUT"
          echo "workspace=${WS}" >> "$GITHUB_OUTPUT"
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "ipa_path=${APP_DIR}/build/TiSLY.ipa" >> "$GITHUB_OUTPUT"
          echo "Resolved scheme=${SCHEME} ipa=${APP_DIR}/build/TiSLY.ipa"

      - name: Render ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          mkdir -p "${APP_DIR}/build/ipa"
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" ios-ci/ExportOptions.plist > "${APP_DIR}/build/ExportOptions.plist"
          # Enforce Automatic Signing + local IPA export (ITMS-90174 対策)
          /usr/libexec/PlistBuddy -c "Set :destination export" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :destination string export" "${APP_DIR}/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :method app-store-connect" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :method app-store" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :signingStyle automatic" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "${APP_DIR}/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID ${APPLE_TEAM_ID}" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "${APP_DIR}/build/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate Apple Distribution" "${APP_DIR}/build/ExportOptions.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "${APP_DIR}/build/ExportOptions.plist"
          echo "===== ExportOptions (must have teamID + automatic + app-store-connect) ====="
          plutil -p "${APP_DIR}/build/ExportOptions.plist"
          grep -q "${APPLE_TEAM_ID}" "${APP_DIR}/build/ExportOptions.plist"

      - name: Archive (xcodebuild) + write TiSLY.ipa
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          # Re-unlock CI keychain for codesign
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -n "${KEYCHAIN_PASSWORD:-}" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          fi

          APP_DIR="${GITHUB_WORKSPACE}/ios/App"
          WS="${APP_DIR}/App.xcworkspace"
          ARCHIVE_PATH="${APP_DIR}/build/TiSLY.xcarchive"
          DERIVED_DATA="${APP_DIR}/build/DerivedData"
          OUT_IPA="${APP_DIR}/build/TiSLY.ipa"
          LOG="${APP_DIR}/build/archive.log"
          mkdir -p "${APP_DIR}/build"
          rm -rf "$ARCHIVE_PATH" "$DERIVED_DATA" "$OUT_IPA" "${APP_DIR}/build/ipa"
          mkdir -p "${APP_DIR}/build/ipa"
          cd "$APP_DIR"

          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${XCODE_SCHEME:-}" ] || [ -z "${AUTH_KEY_PATH:-}" ]; then
            echo "::error::missing APPLE_TEAM_ID / XCODE_SCHEME / AUTH_KEY_PATH"
            exit 1
          fi
          echo "scheme=${XCODE_SCHEME}"
          echo "workspace=${WS}"
          echo "archivePath=${ARCHIVE_PATH}"
          echo "outIpa=${OUT_IPA}"
          echo "authKey=${AUTH_KEY_PATH}"
          echo "team_len=${#APPLE_TEAM_ID}"
          test -d "$WS"
          test -f "$AUTH_KEY_PATH"
          echo "===== codesigning identities ====="
          security find-identity -v -p codesigning || true

          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=jp.tisly.app \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" \
            SKIP_INSTALL=NO \
            INSTALL_PATH='$(LOCAL_APPS_DIR)' \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::archive failed exit=${STATUS}"
            grep -E 'error:|ARCHIVE FAILED|Provisioning|Signing|Code Sign|SKIP_INSTALL' "$LOG" | tail -n 120 || true
            exit "$STATUS"
          fi
          test -d "$ARCHIVE_PATH"

          # exportArchive 必須（Payload zip 禁止）— Team/ASC を明示渡す
          export AUTH_KEY_PATH APP_STORE_KEY_ID APP_STORE_ISSUER_ID APPLE_TEAM_ID
          chmod +x "${GITHUB_WORKSPACE}/scripts/ios-make-ipa.sh"
          bash "${GITHUB_WORKSPACE}/scripts/ios-make-ipa.sh" "$APP_DIR"

          test -f "$OUT_IPA"
          test -s "$OUT_IPA"
          ls -lh "$OUT_IPA"
          echo "CANONICAL_IPA=${OUT_IPA}" >> "$GITHUB_ENV"

      - name: Verify IPA path + embedded.mobileprovision
        run: |
          set -euo pipefail
          IPA="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa"
          echo "Expect: $IPA"
          if [ ! -f "$IPA" ]; then
            echo "::error::canonical IPA missing at $IPA"
            find "${GITHUB_WORKSPACE}/ios/App/build" -type f \( -name '*.ipa' -o -name '*.xcarchive' \) -ls || true
            exit 1
          fi
          BYTES="$(wc -c < "$IPA" | tr -d ' ')"
          if [ "$BYTES" -lt 100000 ]; then
            echo "::error::IPA too small (${BYTES} bytes) — likely incomplete"
            exit 1
          fi
          ls -lh "$IPA"
          /usr/bin/unzip -l "$IPA" | head -n 50
          # ITMS-90174 guard: provisioning profile must be inside the .app
          if ! /usr/bin/unzip -l "$IPA" | grep -qE 'Payload/[^/]+\.app/embedded\.mobileprovision'; then
            echo "::error::ITMS-90174 guard: embedded.mobileprovision missing inside IPA"
            exit 1
          fi
          STAGE="${GITHUB_WORKSPACE}/ios/App/build/ipa-verify-upload"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          /usr/bin/unzip -q "$IPA" -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -f "$APP/embedded.mobileprovision"
          echo "embedded.mobileprovision present ($(wc -c < "$APP/embedded.mobileprovision" | tr -d ' ') bytes)"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -n 30 || true
          echo "IPA_BYTES=${BYTES}" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect / TestFlight
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        id: upload_api
        continue-on-error: true
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ github.workspace }}/ios/App/build/TiSLY.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          wait-for-processing: false
          backend: AppStoreAPI

      - name: Upload fallback (altool / iTMSTransporter)
        if: ${{ steps.cfg.outputs.upload == 'true' && steps.upload_api.outcome != 'success' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa"
          test -f "$IPA"
          test -f "${HOME}/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "apple-actions upload failed — falling back to altool/Transporter"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID" \
            --verbose 2>&1 | tee "${GITHUB_WORKSPACE}/ios/App/build/upload.log"
          UP_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$UP_STATUS" -eq 0 ]; then
            echo "altool upload OK"
            exit 0
          fi
          echo "altool failed (${UP_STATUS}) — trying iTMSTransporter"
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA" \
            -apiKey "$APP_STORE_KEY_ID" \
            -apiIssuer "$APP_STORE_ISSUER_ID" \
            -v informational 2>&1 | tee -a "${GITHUB_WORKSPACE}/ios/App/build/upload.log"
          echo "Transporter upload OK"

      - name: Confirm upload succeeded
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.upload_api.outcome }}" = "success" ]; then
            echo "Upload OK via apple-actions (AppStoreAPI)"
            exit 0
          fi
          # fallback step must have succeeded if we got here (otherwise job already failed)
          echo "Upload OK via altool/Transporter fallback"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiSLY-ios-ipa
          path: |
            ${{ github.workspace }}/ios/App/build/TiSLY.ipa
            ${{ github.workspace }}/ios/App/build/ipa/**
            ${{ github.workspace }}/ios/App/build/archive.log
            ${{ github.workspace }}/ios/App/build/export.log
            ${{ github.workspace }}/ios/App/build/pod-install.log
            ${{ github.workspace }}/ios/App/build/upload.log
            ${{ github.workspace }}/ios/App/Podfile
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          TEAM_LEN="$(printf '%s' '${{ steps.cfg.outputs.team_id }}' | wc -c | tr -d ' ')"
          IPA="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.ipa"
          ARCHIVE="${GITHUB_WORKSPACE}/ios/App/build/TiSLY.xcarchive"
          if [ -f "$IPA" ]; then
            IPA_STATE="$(wc -c < "$IPA" | tr -d ' ') bytes"
          elif [ ! -d "$ARCHIVE" ]; then
            IPA_STATE="missing (archive not created — check CocoaPods / xcodebuild)"
          else
            IPA_STATE="missing (archive exists — see export.log)"
          fi
          echo "### TiSLY iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- scheme: \`${{ steps.xcode.outputs.scheme }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- archive: \`$ARCHIVE\` ($([ -d "$ARCHIVE" ] && echo present || echo missing))" >> "$GITHUB_STEP_SUMMARY"
          echo "- IPA: \`$IPA\` (${IPA_STATE})" >> "$GITHUB_STEP_SUMMARY"
          echo "- team_id len: ${TEAM_LEN}" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload: \`${{ steps.cfg.outputs.upload }}\`" >> "$GITHUB_STEP_SUMMARY"
          for f in pod-install.log archive.log export.log upload.log; do
            P="${GITHUB_WORKSPACE}/ios/App/build/$f"
            if [ -f "$P" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "#### ${f} (tail)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 30 "$P" >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
