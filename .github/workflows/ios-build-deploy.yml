name: iOS Build & Deploy (Capacitor)

# Capacitor iOS → TestFlight（macos-latest）
# 認証: APP_STORE_KEY_ID / APP_STORE_ISSUER_ID / APP_STORE_PRIVATE_KEY
# 既存 PWA / VPS / DB は変更しない

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight へアップロードする"
        type: boolean
        default: true
      ref:
        description: "ビルドする ref（省略時は現在のブランチ）"
        required: false
        type: string
      server_url:
        description: "Capacitor server.url（default=https://tisly.jp）"
        required: false
        default: "https://tisly.jp"
        type: string
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      ref:
        type: string
        required: false
        default: ""
      server_url:
        type: string
        required: false
        default: "https://tisly.jp"
  push:
    tags:
      - "ios-v*"
      - "v*-ios"

concurrency:
  group: tisly-ios-build-deploy
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: jp.tisly.app
  NODE_VERSION: "20"

jobs:
  build-and-upload:
    name: Build & upload (ASC API key only)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check ASC API key secrets (3 only)
        id: secrets
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${APP_STORE_KEY_ID:-}" ] && missing+=("APP_STORE_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}" ] && missing+=("APP_STORE_ISSUER_ID")
          [ -z "${APP_STORE_PRIVATE_KEY:-}" ] && missing+=("APP_STORE_PRIVATE_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::必須 Secrets 不足: ${missing[*]}"
            echo "docs/IOS_SECRETS_SETUP.md を参照"
            exit 1
          fi

          UPLOAD="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="${{ github.event.inputs.upload }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            UPLOAD="${{ inputs.upload }}"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"

          SERVER_URL="https://tisly.jp"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVER_URL="${{ github.event.inputs.server_url }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            SERVER_URL="${{ inputs.server_url }}"
          fi
          echo "server_url=${SERVER_URL}" >> "$GITHUB_OUTPUT"
          echo "ASC API keys OK — certificate secrets are NOT used"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root (Capacitor) dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build web / server
        run: npm run build

      - name: Prepare Capacitor www
        run: npm run cap:prepare
        env:
          CAPACITOR_SERVER_URL: ${{ steps.secrets.outputs.server_url }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Add Capacitor iOS platform (idempotent)
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "ios/ already present"
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ steps.secrets.outputs.server_url }}

      - name: Patch Info.plist
        run: npm run ios:patch-plist

      - name: Resolve Apple Team ID (public · not a certificate)
        id: team
        env:
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
          SECRET_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TEAM="${VAR_TEAM:-}"
          if [ -z "$TEAM" ]; then TEAM="${SECRET_TEAM:-}"; fi
          if [ -z "$TEAM" ] && [ -f ios-ci/apple-team-id ]; then
            TEAM="$(grep -v '^#' ios-ci/apple-team-id | tr -d '[:space:]' || true)"
          fi
          echo "team_id=${TEAM}" >> "$GITHUB_OUTPUT"
          if [ -n "$TEAM" ]; then
            echo "Apple Team ID resolved (${#TEAM} chars)"
          else
            echo "::warning::APPLE_TEAM_ID 未設定。GitHub Variables に APPLE_TEAM_ID（Team ID・秘密ではない）を追加してください。docs/IOS_SECRETS_SETUP.md"
          fi

      - name: Set bundle id + automatic signing on Xcode project
        env:
          APPLE_TEAM_ID: ${{ steps.team.outputs.team_id }}
        run: |
          set -euo pipefail
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          /usr/bin/sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = jp.tisly.app;/g" "$PBX"
          /usr/bin/sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g" "$PBX" || true
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            if grep -q "DEVELOPMENT_TEAM =" "$PBX"; then
              /usr/bin/sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" "$PBX"
            fi
            echo "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}"
          fi

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Copy Fastlane + team id into ios/App
        run: |
          set -euo pipefail
          mkdir -p ios/App/fastlane ios/App/ios-ci
          cp ios-ci/fastlane/Fastfile ios/App/fastlane/Fastfile
          cp ios-ci/fastlane/Appfile ios/App/fastlane/Appfile
          cp ios-ci/apple-team-id ios/App/ios-ci/apple-team-id
          # Also at repo-relative path Fastfile resolve_team_id checks
          mkdir -p ios/ios-ci
          cp ios-ci/apple-team-id ios/ios-ci/apple-team-id

      - name: Archive & TestFlight (API key only)
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
          APPLE_TEAM_ID: ${{ steps.team.outputs.team_id }}
          IOS_BUNDLE_ID: jp.tisly.app
          IOS_SKIP_UPLOAD: ${{ steps.secrets.outputs.upload == 'true' && '0' || '1' }}
          CI: "true"
        run: |
          set -euo pipefail
          fastlane release \
            workspace:"App.xcworkspace" \
            scheme:"App" \
            skip_upload:${{ steps.secrets.outputs.upload == 'true' && 'false' || 'true' }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiSLY-ios-ipa
          path: |
            ios/App/build/*.ipa
            ios/App/build/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          echo "### TiSLY iOS (ASC API key only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- secrets used: APP_STORE_KEY_ID, APP_STORE_ISSUER_ID, APP_STORE_PRIVATE_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload: \`${{ steps.secrets.outputs.upload }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- guide: docs/IOS_SECRETS_SETUP.md" >> "$GITHUB_STEP_SUMMARY"
