name: iOS Build & Deploy (Capacitor)

# クラウド Mac（macos-latest）で Capacitor iOS をビルドし TestFlight へアップロード。
# 署名は App Store Connect API キーのみ（.p12 / プロビジョニング Secrets 不要）。
# Fastlane setup_ci + cert + sigh が CI 上で証明書・プロファイルを自動取得する。
# Secrets: docs/IOS_SECRETS_SETUP.md
# 既存 PWA / VPS / DB は変更しない。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect / TestFlight へアップロードする"
        type: boolean
        default: true
      ref:
        description: "ビルドする ref（省略時は現在のブランチ）"
        required: false
        type: string
      server_url:
        description: "Capacitor server.url（空=https://tisly.jp / local=ローカルwww）"
        required: false
        default: "https://tisly.jp"
        type: string
  push:
    tags:
      - "ios-v*"
      - "v*-ios"

concurrency:
  group: tisly-ios-build-deploy
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: jp.tisly.app
  NODE_VERSION: "20"

jobs:
  build-and-upload:
    name: Build IPA (macos · ASC API key)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Check App Store Connect API key secrets
        id: secrets
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${APP_STORE_KEY_ID:-}" ] && missing+=("APP_STORE_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}" ] && missing+=("APP_STORE_ISSUER_ID")
          [ -z "${APP_STORE_PRIVATE_KEY:-}" ] && missing+=("APP_STORE_PRIVATE_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::App Store Connect API キー Secrets が未設定です: ${missing[*]}"
            echo "登録手順: docs/IOS_SECRETS_SETUP.md"
            echo "（.p12 / プロビジョニングプロファイルは不要です）"
            exit 1
          fi

          UPLOAD="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="${{ github.event.inputs.upload }}"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "ASC API key secrets OK (certificate/profile secrets not required)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root (Capacitor) dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build web / server (npm run build)
        run: npm run build

      - name: Prepare Capacitor www (from server/public)
        run: npm run cap:prepare
        env:
          CAPACITOR_SERVER_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.server_url || 'https://tisly.jp' }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Add Capacitor iOS platform (idempotent)
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "ios/ already present — skipping cap add"
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.server_url || 'https://tisly.jp' }}

      - name: Patch Info.plist (camera / push / local network)
        run: npm run ios:patch-plist

      - name: Set bundle id on Xcode project
        run: |
          set -euo pipefail
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          /usr/bin/sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = jp.tisly.app;/g" "$PBX"
          # Automatic → Fastlane が cert/sigh 後に Manual + profile を適用
          /usr/bin/sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBX" || true
          echo "Updated PRODUCT_BUNDLE_IDENTIFIER in $PBX"

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Setup Ruby / Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Copy Fastlane into ios/App
        run: |
          set -euo pipefail
          mkdir -p ios/App/fastlane
          cp ios-ci/fastlane/Fastfile ios/App/fastlane/Fastfile
          cp ios-ci/fastlane/Appfile ios/App/fastlane/Appfile

      - name: Archive & upload (ASC API key only · Fastlane)
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: jp.tisly.app
          IOS_SKIP_UPLOAD: ${{ steps.secrets.outputs.upload == 'true' && '0' || '1' }}
          CI: "true"
        run: |
          set -euo pipefail
          fastlane release \
            workspace:"App.xcworkspace" \
            scheme:"App" \
            skip_upload:${{ steps.secrets.outputs.upload == 'true' && 'false' || 'true' }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiSLY-ios-ipa
          path: |
            ios/App/build/*.ipa
            ios/App/build/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          echo "### TiSLY iOS build (ASC API key only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundle: \`jp.tisly.app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload: \`${{ steps.secrets.outputs.upload }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- signing: Fastlane cert/sigh via App Store Connect API（.p12 不要）" >> "$GITHUB_STEP_SUMMARY"
          echo "- secrets: docs/IOS_SECRETS_SETUP.md" >> "$GITHUB_STEP_SUMMARY"
