name: iOS Build & Deploy (Capacitor)

# Capacitor iOS → IPA → TestFlight（macos-latest）
# xcodebuild Automatic Signing + ASC API キー（Fastlane なし）
# Secrets: APP_STORE_KEY_ID / APP_STORE_ISSUER_ID / APP_STORE_PRIVATE_KEY
# Variable: APPLE_TEAM_ID
# 既存 PWA / VPS / DB は変更しない

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect / TestFlight へアップロードする"
        type: boolean
        default: true
      server_url:
        description: "Capacitor server.url"
        required: false
        default: "https://tisly.jp"
        type: string
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      server_url:
        type: string
        required: false
        default: "https://tisly.jp"
  push:
    tags:
      - "ios-v*"
      - "v*-ios"

concurrency:
  group: tisly-ios-build-deploy
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: jp.tisly.app
  NODE_VERSION: "20"

jobs:
  build-and-upload:
    name: xcodebuild + ASC API key
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check secrets / team id
        id: cfg
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
          SECRET_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${APP_STORE_KEY_ID:-}" ] && missing+=("APP_STORE_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}" ] && missing+=("APP_STORE_ISSUER_ID")
          [ -z "${APP_STORE_PRIVATE_KEY:-}" ] && missing+=("APP_STORE_PRIVATE_KEY")

          TEAM="${VAR_TEAM:-}"
          if [ -z "$TEAM" ]; then TEAM="${SECRET_TEAM:-}"; fi
          if [ -z "$TEAM" ] && [ -f ios-ci/apple-team-id ]; then
            TEAM="$(grep -v '^#' ios-ci/apple-team-id | tr -d '[:space:]' || true)"
          fi
          if [ -z "$TEAM" ]; then
            missing+=("APPLE_TEAM_ID")
          fi
          # Team ID は通常 10 英数字
          if [ -n "$TEAM" ] && ! echo "$TEAM" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::warning::APPLE_TEAM_ID の形式が想定外です: ${TEAM}（通常は英数字10文字）"
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::未設定: ${missing[*]}"
            echo "docs/IOS_SECRETS_SETUP.md"
            exit 1
          fi

          UPLOAD="true"
          SERVER_URL="https://tisly.jp"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPLOAD="${{ github.event.inputs.upload }}"
            SERVER_URL="${{ github.event.inputs.server_url }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            UPLOAD="${{ inputs.upload }}"
            SERVER_URL="${{ inputs.server_url }}"
          fi

          echo "team_id=${TEAM}" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "server_url=${SERVER_URL}" >> "$GITHUB_OUTPUT"
          echo "Config OK bundle=jp.tisly.app team=${TEAM} upload=${UPLOAD}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install npm deps
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix server

      - name: Build web / server
        run: npm run build

      - name: Prepare Capacitor www
        run: npm run cap:prepare
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks | head -n 40 || true

      - name: Capacitor add / sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios
          npm run ios:patch-plist
          # 確認: capacitor.config appId と一致
          grep -n "jp.tisly.app\|PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj | head -n 40 || true

      - name: Write ASC API key (.p8)
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_PRIVATE_KEY_IS_BASE64: ${{ secrets.APP_STORE_PRIVATE_KEY_IS_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_KEY_ID}.p8"
          if [ "${APP_STORE_PRIVATE_KEY_IS_BASE64:-}" = "1" ]; then
            echo -n "$APP_STORE_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          else
            printf '%s\n' "$APP_STORE_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"
          fi
          # PEM ヘッダ確認
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_PRIVATE_KEY が PEM 形式ではありません"
            exit 1
          fi
          mkdir -p "${HOME}/private_keys" "${HOME}/.appstoreconnect/private_keys" "./private_keys"
          cp "$KEY_PATH" "${HOME}/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          cp "$KEY_PATH" "./private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          ls -la "$KEY_PATH"

      - name: Prepare CI keychain (codesign)
        run: |
          set -euo pipefail
          KC="${RUNNER_TEMP}/tisly-ci.keychain-db"
          KP="tisly-ci-temp"
          security delete-keychain "$KC" 2>/dev/null || true
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          echo "KEYCHAIN_PATH=${KC}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=${KP}" >> "$GITHUB_ENV"

      - name: Setup Ruby + xcodeproj
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install xcodeproj gem
        run: gem install xcodeproj -N

      - name: Patch Podfile for CI (disable Pods code sign)
        run: bash scripts/ios-patch-podfile.sh ios/App/Podfile

      - name: CocoaPods install
        working-directory: ios/App
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Configure Xcode project (bundle + team + Automatic)
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          ruby scripts/ios-configure-xcode.rb \
            ios/App/App.xcodeproj \
            jp.tisly.app \
            "$APPLE_TEAM_ID"
          # Shared scheme 確認
          xcodebuild -workspace ios/App/App.xcworkspace -list
          # Build settings スナップショット
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|MARKETING_VERSION|CURRENT_PROJECT_VERSION' \
            | head -n 40 || true

      - name: Render ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          mkdir -p ios/App/build
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" ios-ci/ExportOptions.plist > ios/App/build/ExportOptions.plist
          cat ios/App/build/ExportOptions.plist

      - name: Archive (xcodebuild)
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ steps.cfg.outputs.team_id }}
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TiSLY.xcarchive" \
            -resultBundlePath "$PWD/build/TiSLY.xcresult" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=jp.tisly.app \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive 2>&1 | tee build/archive.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild archive failed with exit ${STATUS}"
            echo "===== archive.log (errors) ====="
            grep -E 'error:|warning:|ARCHIVE FAILED|Provisioning|Signing|bundle|Team' build/archive.log | tail -n 80 || true
            echo "===== xcresult ====="
            if [ -d build/TiSLY.xcresult ]; then
              xcrun xcresulttool get --path build/TiSLY.xcresult --format json 2>/dev/null | head -c 8000 || true
            fi
            exit "$STATUS"
          fi

      - name: Export IPA (xcodebuild)
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/TiSLY.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            2>&1 | tee build/export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild export failed with exit ${STATUS}"
            grep -E 'error:|Export|Provisioning|Signing' build/export.log | tail -n 80 || true
            exit "$STATUS"
          fi
          IPA="$(find "$PWD/build/export" -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::IPA が生成されませんでした"
            ls -laR build || true
            exit 1
          fi
          cp "$IPA" "$PWD/build/TiSLY.ipa"
          ls -lh "$PWD/build/TiSLY.ipa"

      - name: Upload to App Store Connect
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$PWD/build/TiSLY.ipa" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID" \
            --verbose

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiSLY-ios-ipa
          path: |
            ios/App/build/TiSLY.ipa
            ios/App/build/archive.log
            ios/App/build/export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          echo "### TiSLY iOS (xcodebuild + ASC API key)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundle: \`jp.tisly.app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- team: \`${{ steps.cfg.outputs.team_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload: \`${{ steps.cfg.outputs.upload }}\`" >> "$GITHUB_STEP_SUMMARY"
